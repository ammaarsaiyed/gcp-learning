, "how": "RPO drives the replication and backup design (synchronous → RPO ≈ 0; async → seconds to minutes; nightly backup → up to 24 h). RTO drives the standby design (hot, warm, cold) and the level of automation."}, {"id": "reliability-and-operations--dr-patterns-backup-restore-pilot-light-warm-standby-active-active", "domain": "reliability-and-operations", "term": "DR patterns: backup/restore, pilot light, warm standby, active-active", "tier": "core", "related": ["RTO and RPO", "Multi-region"], "what": "**Backup and restore (cold):** only backups in another region; rebuild on disaster (RTO hours or days, cheapest). **Pilot light:** core data replicated and minimal infrastructure defined (often as code), scaled up on failover. **Warm standby:** a scaled-down but running copy in region 2, with replicated databases (RTO minutes). **Hot / active-active:** full capacity in multiple regions serving traffic simultaneously (global load balancing + multi-region databases; RTO ≈ 0; most expensive and complex).", "gcp": "IaC (Terraform) + cross-region Cloud SQL or AlloyDB replicas + a dual- or multi-region GCS bucket + Artifact Registry in multiple regions + a global load balancer gives a typical warm standby. Spanner multi-region + global load balancing + Cloud Run in two or more regions gives active-active. Rehearse it: a DR plan that hasn't been tested doesn't count."}, {"id": "reliability-and-operations--failure-domains-zones-and-regions", "domain": "reliability-and-operations", "term": "Failure domains: zones and regions", "tier": "core", "related": ["Location scope", "High availability"], "what": "A **failure domain** is a set of resources that can fail together. In GCP, a **zone** is a failure domain within a region (independent power, cooling and networking). A **region** is a geographic area of three or more zones.", "how": "Zonal resources (VMs, zonal disks) need multi-zone redundancy for HA. Regional resources (regional MIGs, Cloud Run, Cloud SQL HA, regional Spanner) handle zone failure for you. Multi-region resources handle region failure. Check each product's documented failure behaviour.", "gcp": "London is `europe-west2` (3 zones), and it's currently Google Cloud's only UK region. UK banks therefore usually get HA from multiple London zones. For region-level DR they pair it with another region (often `europe-west1`, Belgium) where data policy allows data to leave the UK, or with on-prem. Check current region availability and your bank's residency policy."}, {"id": "reliability-and-operations--redundancy-and-n-1-capacity", "domain": "reliability-and-operations", "term": "Redundancy and N+1 capacity", "tier": "working", "related": ["Failure domains", "Capacity planning"], "what": "Provisioning enough spare capacity that losing one unit (an instance, a zone) still leaves enough to serve peak load. With 3 zones, each zone must handle 50% of peak if one fails (N+1 across zones). For maintenance during an outage you need N+2."}, {"id": "reliability-and-operations--graceful-degradation", "domain": "reliability-and-operations", "term": "Graceful degradation", "tier": "working", "related": ["Circuit breaker", "Load shedding"], "what": "Keeping core functions working when parts fail: serve cached balances if the live ledger is slow, disable recommendations rather than the whole app, fall back to a smaller model or a \"please try later\" response when the LLM provider returns 429s."}, {"id": "reliability-and-operations--observability-vs-monitoring", "domain": "reliability-and-operations", "term": "Observability vs monitoring", "tier": "core", "related": ["Cloud Logging", "Cloud Monitoring", "Distributed tracing"], "what": "**Monitoring** watches known signals and alerts on known failure modes (dashboards, thresholds). **Observability** is the ability to understand *new, unexpected* behaviour from the telemetry the system emits: **logs** (discrete events), **metrics** (numeric time series), **traces** (request paths across services), plus **profiles**.", "gcp": "**Google Cloud Observability**: Cloud Logging, Cloud Monitoring, Cloud Trace, Cloud Profiler, Error Reporting, Managed Service for Prometheus. All of it is OpenTelemetry-friendly."}, {"id": "reliability-and-operations--cloud-logging", "domain": "reliability-and-operations", "term": "Cloud Logging", "tier": "core", "related": ["Cloud Audit Logs", "Log sinks", "Structured logging"], "what": "Collects, stores, searches and routes logs from GCP services, your apps (stdout/stderr on Cloud Run and GKE, the Ops Agent on VMs) and audit logs.", "how": "The **Log Router** checks every entry against **sinks** (include and exclusion filters) → destinations: **log buckets** (with configurable retention and region, CMEK, and optional **Log Analytics** for SQL queries), BigQuery, Cloud Storage, Pub/Sub, or other projects. The `_Required` bucket (audit and admin logs, 400 days, unchangeable) and the `_Default` bucket (30 days, configurable) exist in every project. Query with the **Logging query language** in Logs Explorer. **Log-based metrics** turn matching entries into counters or distributions.", "watch": "Log volume is a real cost. Use exclusion filters, sampling and sensible log levels. Logs can contain PII, so redact before logging, and restrict log views."}, {"id": "reliability-and-operations--structured-logging-and-log-correlation", "domain": "reliability-and-operations", "term": "Structured logging and log correlation", "tier": "working", "related": ["Cloud Logging", "Distributed tracing"], "what": "Writing logs as **JSON** with fields (severity, message, request ID, user ID, `logging.googleapis.com/trace`) instead of free text, so they're queryable and correlated.", "gcp": "On Cloud Run and GKE, JSON lines on stdout are parsed automatically. Include the trace ID so the Logs Explorer can show every log line for one request alongside its trace."}, {"id": "reliability-and-operations--cloud-monitoring", "domain": "reliability-and-operations", "term": "Cloud Monitoring", "tier": "core", "related": ["SLI/SLO/SLA", "Alerting", "Golden signals"], "what": "Metrics, dashboards and alerting for GCP, hybrid and multicloud resources.", "how": "**Built-in metrics** for every service (no setup), **custom metrics** (OpenTelemetry, Prometheus, the API), **log-based metrics**, **Metrics Explorer**, **PromQL** querying, **dashboards** (including multi-project with metrics scopes), **alerting policies** (metric thresholds, absence, log-match, SLO burn-rate) → **notification channels** (email, SMS, Slack, PagerDuty, webhooks, Pub/Sub), **uptime checks** and **synthetic monitors** (scripted probes of user journeys), **Personalized Service Health** (Google-side incidents affecting your projects).", "gcp": "A **metrics scope** lets one project view metrics from many, which is how a central SRE or SOC team sees the whole estate."}, {"id": "reliability-and-operations--distributed-tracing", "domain": "reliability-and-operations", "term": "Distributed tracing", "tier": "core", "related": ["OpenTelemetry", "Structured logging", "Agents"], "what": "Following one request across services. A **trace** is a tree of **spans** (timed operations with attributes). **Context propagation** passes the trace ID and span ID in headers (W3C `traceparent`) from hop to hop.", "how": "The waterfall view shows where latency goes (\"80% of this request was the LLM call; 15% was vector search\").", "gcp": "**Cloud Trace** (with OpenTelemetry), with automatic spans for load balancers, Cloud Run and many client libraries. **For agents, tracing is essential**: each model call, tool call and retrieval should be a span. ADK and Agent Runtime emit traces."}, {"id": "reliability-and-operations--opentelemetry", "domain": "reliability-and-operations", "term": "OpenTelemetry", "tier": "working", "related": ["Distributed tracing", "Cloud Monitoring"], "what": "The vendor-neutral CNCF standard and SDKs for generating and exporting traces, metrics and logs (with semantic conventions, now including GenAI conventions for model calls and token usage), plus the **OpenTelemetry Collector** for processing and routing.", "gcp": "Google Cloud Observability ingests OTLP natively. Instrumenting once with OTel avoids lock-in to any observability backend."}, {"id": "reliability-and-operations--golden-signals-red-and-use", "domain": "reliability-and-operations", "term": "Golden signals, RED and USE", "tier": "core", "related": ["Cloud Monitoring", "SLI/SLO/SLA"], "what": "Frameworks for choosing what to measure. **Four golden signals** (Google SRE): **latency**, **traffic**, **errors**, **saturation**. **RED** (for services): **R**ate, **E**rrors, **D**uration. **USE** (for resources): **U**tilization, **S**aturation, **E**rrors.", "how": "Alert on user-facing symptoms (golden signals and SLO burn), and use resource metrics (USE) for diagnosis and capacity.", "watch": "For LLM apps, add tokens per request, time to first token, cost per request, refusal and guardrail-block rates, and evaluation scores."}, {"id": "reliability-and-operations--alerting-practice", "domain": "reliability-and-operations", "term": "Alerting practice", "tier": "working", "related": ["Burn rate alerting", "Incident management"], "what": "Good alerts are **actionable** (a human must do something), **symptom-based** (users are affected) and **urgent-only** for pages. Everything else becomes a ticket or a dashboard. Each alert links a **playbook / runbook**.", "watch": "Alert fatigue (too many noisy alerts) is how real incidents get missed."}, {"id": "reliability-and-operations--incident-management-and-postmortems", "domain": "reliability-and-operations", "term": "Incident management and postmortems", "tier": "working", "related": ["Alerting", "Operational resilience"], "what": "A structured response: detect → declare → assign roles (**incident commander**, communications lead, operations) → mitigate first (roll back, fail over, shed load) → resolve → **blameless postmortem** (timeline, root and contributing causes, action items with owners).", "watch": "Mitigate before debugging. Rolling back a bad release beats investigating while customers wait. Banks must also meet regulatory incident-reporting duties."}, {"id": "reliability-and-operations--toil", "domain": "reliability-and-operations", "term": "Toil", "tier": "aware", "related": ["Infrastructure as code", "Automation"], "what": "SRE term for manual, repetitive, automatable operational work that scales with the service and has no lasting value. SRE practice caps toil (for example at 50% of time) and automates the rest."}, {"id": "reliability-and-operations--quotas-limits-and-capacity-planning", "domain": "reliability-and-operations", "term": "Quotas, limits and capacity planning", "tier": "working", "related": ["Reservations", "Autoscaling"], "what": "**Quotas** cap how much of a resource a project can use. **Rate quotas** limit API calls per minute (including Gemini requests and tokens per minute). **Allocation quotas** limit the count of resources (CPUs per region, IP addresses). They can usually be raised through a request. **System limits** are hard ceilings. **Capacity planning** forecasts demand and ensures headroom: quota increases, **reservations** (guaranteed VM or GPU capacity in a zone), committed use discounts, and Provisioned Throughput for models.", "watch": "Hitting a quota during a peak or a DR failover is a common, avoidable outage. Pre-raise quotas in DR regions too."}, {"id": "reliability-and-operations--load-testing-and-chaos-engineering", "domain": "reliability-and-operations", "term": "Load testing and chaos engineering", "tier": "working", "related": ["Disaster recovery", "SLOs"], "what": "**Load testing:** generate realistic traffic to find capacity limits and bottlenecks before users do (Locust, k6, JMeter; distributed on GKE). **Chaos engineering:** deliberately inject failures (kill instances, add latency, fail a zone or dependency) in a controlled way, to verify that resilience mechanisms actually work.", "gcp": "Fault injection in the load balancer or service mesh, stopping zones in DR tests, failing over Cloud SQL deliberately. It aligns with the operational resilience requirement to **test against severe but plausible scenarios**."}, {"id": "reliability-and-operations--deployment-strategies", "domain": "reliability-and-operations", "term": "Deployment strategies", "tier": "core", "related": ["Cloud Run traffic splitting", "Cloud Deploy", "Feature flags"], "what": "**Recreate:** stop the old, start the new (downtime). **Rolling:** replace instances gradually. **Blue/green:** run the new version alongside the old, switch all traffic at once, keep blue for instant rollback. **Canary:** send a small percentage of traffic to the new version, watch the metrics, then increase. **A/B testing:** split by user segment to compare behaviour. **Shadow / mirroring:** send a copy of real traffic to the new version without returning its responses. **Feature flags:** deploy code dark and toggle behaviour at runtime, which separates *deploy* from *release*.", "gcp": "Cloud Run revisions + traffic splitting + tags. GKE through Deployments, the Gateway API and Cloud Deploy canaries. MIG rolling updates. Load balancer weighted backends and traffic mirroring.", "watch": "Database schema changes need the **expand → migrate → contract** approach, so old and new versions both work during rollout."}, {"id": "reliability-and-operations--ci-cd", "domain": "reliability-and-operations", "term": "CI/CD", "tier": "core", "related": ["Cloud Build", "Cloud Deploy", "Software supply chain security"], "what": "**Continuous Integration:** every change is merged frequently and automatically built and tested (unit tests, linters, SAST, dependency and container scanning). **Continuous Delivery:** every change is *releasable*, promoted through environments by an automated pipeline, often with approval gates. **Continuous Deployment:** every passing change goes to production automatically. This all sits inside the **SDLC** (software development life cycle): plan → design → build → test → release → operate, with security built into every stage (\"shift left\").", "gcp": "Source (GitHub, GitLab, Bitbucket, Secure Source Manager) → **Cloud Build** (CI) → **Artifact Registry** (images + SBOM + provenance) → **Binary Authorization** → **Cloud Deploy** (CD across dev → test → prod targets, with approvals and canaries) → GKE or Cloud Run. Or GitHub Actions authenticating with Workload Identity Federation."}, {"id": "reliability-and-operations--build-time-vs-runtime-secrets", "domain": "reliability-and-operations", "term": "Build-time vs runtime secrets", "tier": "working", "related": ["Secret Manager", "CI/CD", "Container images"], "what": "**Build-time** secrets are needed to *build* (for example a token for a private package registry). Use them in the build step only, from Secret Manager, and never let them end up in image layers. **Runtime** secrets are needed by the running app (database passwords, API keys). Inject them at deploy or run time (Cloud Run or GKE secret mounts, Secret Manager API) so the same image works in every environment and rotation doesn't need a rebuild.", "watch": "`docker history` exposes values passed as build arguments or copied into earlier layers. Scan images for secrets."}, {"id": "reliability-and-operations--cloud-build", "domain": "reliability-and-operations", "term": "Cloud Build", "tier": "working", "related": ["CI/CD", "Workload Identity Federation", "Private pools"], "what": "Serverless CI. Builds run as a series of **steps** (each a container) defined in `cloudbuild.yaml`, triggered by git events, Pub/Sub, webhooks or manually. It produces images and artifacts with **SLSA provenance**.", "how": "Runs as a configurable service account (least privilege). **Private pools** run builds inside your VPC with no public internet access, required by many banks to reach private repositories and artifact proxies."}, {"id": "reliability-and-operations--cloud-deploy", "domain": "reliability-and-operations", "term": "Cloud Deploy", "tier": "working", "related": ["CI/CD", "Deployment strategies"], "what": "Managed **continuous delivery** to GKE, Cloud Run and GKE-attached clusters. You define a **delivery pipeline** of ordered **targets** (environments). **Releases** are promoted through them with **approvals**, automated or manual **canary** and blue/green strategies, verification jobs, rollbacks, and full audit history. It uses Skaffold for rendering and deploying."}, {"id": "reliability-and-operations--infrastructure-as-code-iac", "domain": "reliability-and-operations", "term": "Infrastructure as code (IaC)", "tier": "core", "related": ["Terraform state", "GitOps", "Landing zone"], "what": "Defining infrastructure in version-controlled code instead of console clicks. You get repeatability, code review, audit trail, drift detection and rebuild-from-scratch DR.", "how": "**Declarative** tools (Terraform, Config Connector) describe the desired end state, and the tool works out the changes (**plan**) and applies them. **Imperative** scripts (gcloud) describe steps.", "gcp": "**Terraform** (the industry default, with the `google` provider), **Infrastructure Manager** (Google-managed Terraform runs, state and history), **Config Connector** (GCP resources as Kubernetes custom resources), **Cloud Foundation Fabric / FAST** (opinionated modules and a staged enterprise org bootstrap) and the Cloud Foundation Toolkit."}, {"id": "reliability-and-operations--terraform-state-plan-and-drift", "domain": "reliability-and-operations", "term": "Terraform state, plan and drift", "tier": "working", "related": ["Infrastructure as code"], "what": "**State** is Terraform's record mapping code to real resources. Keep it in a **remote backend** (a GCS bucket with versioning; locking prevents concurrent applies). **Plan** shows the diff before **apply**. **Drift** happens when someone changes resources outside Terraform.", "watch": "State can contain secrets. Restrict access to the state bucket, encrypt it with CMEK, and never commit it to git. Run Terraform from a pipeline with an impersonated service account, never from laptops with personal Owner rights."}, {"id": "reliability-and-operations--gitops", "domain": "reliability-and-operations", "term": "GitOps", "tier": "working", "related": ["Infrastructure as code", "Fleets", "CI/CD"], "what": "Git is the single source of truth for desired state. An agent in the cluster (**Config Sync**, **Argo CD**, Flux) continuously pulls and reconciles, so changes happen only through reviewed pull requests, and drift is corrected automatically."}, {"id": "reliability-and-operations--immutable-infrastructure-and-configuration-management", "domain": "reliability-and-operations", "term": "Immutable infrastructure and configuration management", "tier": "working", "related": ["Images", "Containers", "Deployment strategies"], "what": "Instead of patching running servers in place, **build a new image or container and replace** the instances. This removes configuration drift and makes rollback trivial. Configuration is injected at deploy time (env vars, Secret Manager, ConfigMaps), never baked per environment into the image."}, {"id": "reliability-and-operations--environments-and-promotion", "domain": "reliability-and-operations", "term": "Environments and promotion", "tier": "working", "related": ["CI/CD", "Projects strategy"], "what": "Separate **dev → test/UAT → pre-prod → prod** environments, usually separate projects (or folders), each with its own IAM, network and data. The *same artifact* (image digest) is promoted through them. In banks, prod data generally can't be used in lower environments without masking or synthetic replacement. **Ephemeral environments** (spun up per pull request from IaC, then destroyed) give realistic testing without permanent cost."}, {"id": "reliability-and-operations--testing-types", "domain": "reliability-and-operations", "term": "Testing types", "tier": "working", "related": ["CI/CD", "Load testing", "LLM evaluation"], "what": "**Unit** (functions in isolation), **integration** (with real or emulated dependencies; GCP has **emulators** for Pub/Sub, Firestore, Bigtable, Spanner and Datastore, run through `gcloud emulators` or **Cloud Code** in the IDE), **contract** (consumer and provider API expectations), **end-to-end**, **performance / load**, **security** (SAST, DAST, dependency scanning, pen tests), **DR tests**. **Evaluation suites** for LLM and agent behaviour are an AI-specific addition."}, {"id": "reliability-and-operations--active-assist-and-recommenders", "domain": "reliability-and-operations", "term": "Active Assist and recommenders", "tier": "working", "related": ["Rightsizing", "Policy Intelligence"], "what": "Machine-learning-driven recommendations across GCP: idle VMs, disks and IPs, VM rightsizing, committed-use purchases, IAM excess permissions, unattended projects, and network and security improvements. They're available through the console, API and the BigQuery export."}, {"id": "reliability-and-operations--gemini-cloud-assist", "domain": "reliability-and-operations", "term": "Gemini Cloud Assist", "tier": "aware", "related": ["Observability", "Active Assist"], "what": "An AI assistant in the Google Cloud console that helps design architectures, explain resources and costs, troubleshoot (investigations that analyze logs, metrics and configuration) and generate configurations. It appears in the newer exam guides. It's useful, but always verify its suggestions."}, {"id": "reliability-and-operations--app-hub-and-cloud-hub", "domain": "reliability-and-operations", "term": "App Hub and Cloud Hub", "tier": "aware", "related": ["Cloud Asset Inventory", "Observability"], "what": "**App Hub** groups resources across projects into *applications* (services and workloads with owners, criticality and environment attributes), so monitoring, cost and governance can be organised by application rather than by project. **Cloud Hub** is a console home that shows application health, active incidents, deployments, quotas and other operational signals in one place. Both appear in the newer exam guides."}, {"id": "governance-and-cost--resource-hierarchy", "domain": "governance-and-cost", "term": "Resource hierarchy", "tier": "core", "related": ["IAM policies and inheritance", "Organization Policy", "Landing zone"], "what": "**Organization** (root, tied to a Cloud Identity / Workspace domain) → **Folders** (nestable, typically by business unit, environment or both) → **Projects** (the unit of billing, API enablement, quotas and most IAM) → **Resources**.", "how": "IAM policies, org policies, tags and some firewall policies inherit downwards. A project has an immutable, globally unique **project ID**, a mutable **name** and a Google-assigned **number**. Deleting a project shuts it down, and it can be restored within 30 days.", "gcp": "Bank layouts usually look like `org → {common/shared, prod, non-prod, sandbox} → business-unit folders → app/env projects`. Each design choice there changes which policies are easiest to apply."}, {"id": "governance-and-cost--landing-zone-and-enterprise-foundations", "domain": "governance-and-cost", "term": "Landing zone and enterprise foundations", "tier": "core", "related": ["Resource hierarchy", "Shared VPC", "Organization Policy"], "what": "The pre-built, governed foundation that workloads land in: identity integration, hierarchy, org policies, networking (Shared VPC hubs, hybrid connectivity, DNS), centralized logging and monitoring, security tooling (SCC, KMS), billing setup, and a project factory (automated, compliant project creation).", "gcp": "Google's **enterprise foundations blueprint** and **Cloud Foundation Fabric FAST** are the reference implementations, deployed with Terraform. In a bank, the platform team owns it, and you mostly consume it, but you need to understand it to design within it."}, {"id": "governance-and-cost--project-strategy", "domain": "governance-and-cost", "term": "Project strategy", "tier": "working", "related": ["Resource hierarchy", "Environments"], "what": "How workloads are split into projects. Common practice: **one project per application per environment** (for example `payments-api-dev` / `-prod`), plus shared projects (network host, logging, security, CI/CD, shared data).", "how": "Projects are free. They give isolation of IAM, quotas, billing and blast radius. Too few means shared permissions and noisy neighbours. Too many needs automation (a project factory) and consistent naming and labels."}, {"id": "governance-and-cost--labels", "domain": "governance-and-cost", "term": "Labels", "tier": "working", "related": ["Secure Tags vs network tags vs labels", "Billing export"], "what": "Key/value metadata on most resources (`env=prod`, `team=fraud`, `cost-centre=1234`, `data-class=confidential`), used for filtering, automation and **cost allocation** (labels appear in billing exports). Labels have no security effect."}, {"id": "governance-and-cost--cloud-asset-inventory", "domain": "governance-and-cost", "term": "Cloud Asset Inventory", "tier": "working", "related": ["Security Command Center", "Policy Analyzer"], "what": "A searchable inventory of all resources and IAM policies across the org, with a **history** of changes (about 35 days), real-time **feeds** to Pub/Sub, and **exports** to BigQuery for analysis (\"every bucket without CMEK\", \"every service account with Owner\")."}, {"id": "governance-and-cost--quotas-and-limits", "domain": "governance-and-cost", "term": "Quotas and limits", "tier": "core", "related": ["Capacity planning", "Gemini quotas"], "what": "Per-project or per-region caps on resources (CPUs, IPs, GPUs) and API rates (requests per minute, tokens per minute). They protect both Google's capacity and you (from runaway spend or a bug). Most can be increased by request. **Quota adjuster** can automate increases. You can also *lower* quotas yourself as a cost guardrail (for example capping BigQuery bytes scanned per day)."}, {"id": "governance-and-cost--billing-accounts-and-billing-structure", "domain": "governance-and-cost", "term": "Billing accounts and billing structure", "tier": "core", "related": ["Budgets", "Billing export"], "what": "A **Cloud Billing account** pays for one or more linked projects. It can be self-serve (card) or invoiced. Subaccounts are for resellers. Billing IAM roles are separate from project roles (Billing Account Administrator, User, Viewer).", "how": "Unlinking billing stops paid services in the project. Only principals with Billing Account User on the account can link projects to it."}, {"id": "governance-and-cost--budgets-and-alerts", "domain": "governance-and-cost", "term": "Budgets and alerts", "tier": "core", "related": ["Billing accounts", "Pub/Sub"], "what": "Thresholds on actual or forecasted spend for a billing account, filtered by projects, services or labels, that **notify** by email or publish to **Pub/Sub** (for automated responses).", "watch": "Budgets don't cap spend. A hard stop needs automation (Pub/Sub → a function that disables billing or scales services down). Quotas are the other preventive control."}, {"id": "governance-and-cost--billing-export-to-bigquery-and-finops-reporting", "domain": "governance-and-cost", "term": "Billing export to BigQuery and FinOps reporting", "tier": "working", "related": ["Labels", "FinOps"], "what": "Detailed usage-cost data (standard and detailed, resource-level), pricing data, and committed-use data exported daily to BigQuery for SQL analysis, Looker dashboards, showback and chargeback by labels, and anomaly detection."}, {"id": "governance-and-cost--pricing-models-and-discounts", "domain": "governance-and-cost", "term": "Pricing models and discounts", "tier": "core", "related": ["Spot VMs", "BigQuery slots", "Provisioned Throughput"], "what": "**On-demand / pay-as-you-go**: per second or per unit, no commitment. **Sustained use discounts (SUDs):** automatic discounts for VMs that run a large part of the month (some machine families). **Committed use discounts (CUDs):** a 1- or 3-year commitment for big discounts. *Resource-based* CUDs commit to vCPU and memory in a region. *Spend-based (flexible)* CUDs commit to a $/hour of spend across services. **Spot VMs:** deep discounts for interruptible capacity. **BigQuery editions** commitments. **Provisioned Throughput** for Gemini (reserved model capacity).", "watch": "Commit only to steady baseline usage. Cover spiky usage with on-demand or Spot."}, {"id": "governance-and-cost--finops", "domain": "governance-and-cost", "term": "FinOps", "tier": "working", "related": ["Billing export", "Labels", "Rightsizing"], "what": "The practice of cloud financial management: shared accountability between engineering, finance and product. The phases are **Inform** (visibility, allocation, showback or chargeback), **Optimize** (rightsizing, discounts, waste removal) and **Operate** (governance, budgets, continuous improvement).", "gcp": "Labels and tags + billing export + Looker dashboards + recommenders + budgets + CUD management. For AI workloads, track **cost per request and per token per use case**."}, {"id": "governance-and-cost--rightsizing-and-waste-reduction", "domain": "governance-and-cost", "term": "Rightsizing and waste reduction", "tier": "working", "related": ["Active Assist", "Autoscaling"], "what": "Matching resources to real usage: downsize over-provisioned VMs, delete idle disks, IPs and snapshots, scale to zero where possible, use autoscaling, apply lifecycle policies to storage, set GKE requests correctly, tune BigQuery queries, and stop non-prod environments out of hours."}, {"id": "governance-and-cost--capex-vs-opex-and-tco", "domain": "governance-and-cost", "term": "CapEx vs OpEx and TCO", "tier": "working", "related": ["Migration", "Pricing models"], "what": "**CapEx:** upfront capital spend on assets (servers, data centres), depreciated over years. **OpEx:** ongoing operating spend (cloud consumption). **TCO** (total cost of ownership) compares *everything*: hardware, licences, power and cooling, facilities, staff, downtime and opportunity cost, not just the hosting price.", "watch": "Cloud moves spend from CapEx to OpEx and makes it variable. That's great for agility, but it needs FinOps discipline."}, {"id": "governance-and-cost--regions-zones-and-choosing-a-location", "domain": "governance-and-cost", "term": "Regions, zones and choosing a location", "tier": "core", "related": ["Failure domains", "Data residency", "Latency"], "what": "Choose a region based on: (1) **regulatory and residency** requirements, (2) **latency** to users and systems (including on-prem Interconnect locations), (3) **service and machine availability** (not every product, model or GPU exists in every region), (4) **price** (it varies by region), (5) **sustainability** (carbon-free energy percentage).", "gcp": "For UK banks, `europe-west2` (London) is the default. Check every service's availability there, including AI model availability and **ML processing location**, before committing to a design."}, {"id": "governance-and-cost--google-cloud-well-architected-framework", "domain": "governance-and-cost", "term": "Google Cloud Well-Architected Framework", "tier": "core", "related": ["Solution design", "Trade-offs"], "what": "Google's best-practice framework for designing and operating workloads. **Pillars:** **operational excellence**, **security, privacy and compliance**, **reliability**, **cost optimization**, **performance optimization**, **sustainability**. There are also **perspectives** that apply the pillars to specific contexts (for example **AI and ML**, and **financial services**).", "how": "Use the pillars as a review checklist for any design, and record trade-offs explicitly (for example \"multi-region active-active improves reliability but doubles cost and adds consistency complexity\").", "gcp": "The Professional Cloud Architect exam treats it as foundational. Bank architecture review boards ask essentially the same questions."}, {"id": "governance-and-cost--architecture-decision-records-adrs-and-trade-offs", "domain": "governance-and-cost", "term": "Architecture decision records (ADRs) and trade-offs", "tier": "working", "related": ["Well-Architected Framework"], "what": "Short documents recording a significant decision: context, options considered, the decision, consequences and trade-offs. They make the reasoning reviewable and stop old debates from restarting.", "watch": "The most valuable skill in design reviews isn't knowing every product. It's stating what each option *gives up*."}, {"id": "governance-and-cost--sustainability", "domain": "governance-and-cost", "term": "Sustainability", "tier": "aware", "related": ["Well-Architected Framework", "Regions"], "what": "Google publishes a carbon-free energy percentage per region, and offers the **Carbon Footprint** report (emissions by project, service and region; exportable to BigQuery). Region choice, utilization and rightsizing are the main levers. It increasingly appears in bank ESG reporting."}, {"id": "governance-and-cost--support-and-service-health", "domain": "governance-and-cost", "term": "Support and service health", "tier": "aware", "related": ["Incident management"], "what": "Google Cloud support tiers (Standard, Enhanced, Premium with a Technical Account Manager), **Personalized Service Health** (incidents affecting *your* projects, with alerts and APIs), and the public status dashboard. Regulated firms typically need Premium support to meet incident-response obligations, and some features (Access Approval and others) depend on it."}, {"id": "migration-and-hybrid--migration-strategies-the-7-rs", "domain": "migration-and-hybrid", "term": "Migration strategies (the \"7 Rs\")", "tier": "core", "related": ["Migration Center", "Strangler fig", "TCO"], "what": "**Rehost** (\"lift and shift\": move VMs as they are), **Replatform** (\"lift and optimize\": small changes such as moving to managed Cloud SQL or containers), **Refactor / re-architect** (redesign as cloud-native), **Repurchase** (move to SaaS), **Retire** (switch off), **Retain** (keep on-prem for now), **Relocate** (move a hypervisor estate wholesale, for example VMware → Google Cloud VMware Engine).", "how": "Choose per workload using business value, technical fit, risk, licensing, regulatory constraints and timelines. Most programmes combine several. Google's framing is **assess → plan → deploy → optimize**.", "watch": "Rehosting is fast but brings old problems with it, and VM costs can exceed on-prem without optimization."}, {"id": "migration-and-hybrid--migration-center-assess-and-plan", "domain": "migration-and-hybrid", "term": "Migration Center (assess and plan)", "tier": "working", "related": ["Migration strategies", "TCO"], "what": "Google's hub for discovering on-prem and other-cloud assets (through discovery clients or imports), mapping dependencies, producing TCO and rightsizing reports, and planning migration waves."}, {"id": "migration-and-hybrid--migrate-to-virtual-machines", "domain": "migration-and-hybrid", "term": "Migrate to Virtual Machines", "tier": "working", "related": ["Rehost", "Compute Engine"], "what": "A managed service that replicates VMs from VMware, AWS, Azure or physical servers into Compute Engine, with test clones, scheduled cut-over and rollback, using continuous block-level replication to minimize downtime."}, {"id": "migration-and-hybrid--database-migration-service-dms", "domain": "migration-and-hybrid", "term": "Database Migration Service (DMS)", "tier": "working", "related": ["Cloud SQL", "AlloyDB", "Change data capture"], "what": "Serverless database migrations with continuous replication (CDC) and minimal downtime: MySQL and PostgreSQL → Cloud SQL or AlloyDB, SQL Server → Cloud SQL, and **heterogeneous** Oracle or SQL Server → PostgreSQL / AlloyDB (with conversion workspaces, using Gemini to help convert schemas and code)."}, {"id": "migration-and-hybrid--strangler-fig-pattern", "domain": "migration-and-hybrid", "term": "Strangler fig pattern", "tier": "core", "related": ["Monolith vs microservices", "API gateway"], "what": "Modernizing a legacy system incrementally. Put a facade (an API gateway or proxy) in front of it, then route individual capabilities one by one to new services until the old system can be retired. It avoids a risky \"big bang\" rewrite.", "gcp": "Apigee or a load balancer as the routing facade, new capabilities on Cloud Run or GKE, and CDC (Datastream) to keep the new data stores in sync during the transition. It's very common for mainframe and core-banking modernization."}, {"id": "migration-and-hybrid--anti-corruption-layer", "domain": "migration-and-hybrid", "term": "Anti-corruption layer", "tier": "working", "related": ["Strangler fig", "Domain-driven design"], "what": "A translation layer between a new system and a legacy system with an awkward model, so the new code isn't shaped by legacy concepts (for example a service that converts mainframe COBOL copybook records into clean domain events)."}, {"id": "migration-and-hybrid--wave-planning-cut-over-and-rollback", "domain": "migration-and-hybrid", "term": "Wave planning, cut-over and rollback", "tier": "working", "related": ["Migration strategies", "DNS"], "what": "Grouping workloads into **waves** by dependency and risk (pilot waves first), with rehearsed **cut-over runbooks** (freeze → final sync → switch DNS or traffic → validate) and defined **rollback** criteria and steps.", "watch": "Lower DNS TTLs in advance. Data synchronization in both directions makes rollback possible, and that matters most for payments."}, {"id": "migration-and-hybrid--licensing-in-the-cloud", "domain": "migration-and-hybrid", "term": "Licensing in the cloud", "tier": "working", "related": ["Sole-tenant nodes", "Bare Metal Solution"], "what": "Commercial software licences (Windows Server, SQL Server, Oracle, RHEL, SAP) may be **pay-as-you-go** through Google images, or **BYOL** (bring your own licence). BYOL sometimes needs **sole-tenant nodes** (dedicated hosts) to meet per-core or per-socket terms. Oracle often lands on Bare Metal Solution or is migrated to PostgreSQL / AlloyDB."}, {"id": "migration-and-hybrid--hybrid-cloud", "domain": "migration-and-hybrid", "term": "Hybrid cloud", "tier": "core", "related": ["Cloud Interconnect", "Hybrid DNS", "Apigee hybrid"], "what": "Running workloads across on-prem and public cloud as one estate, with private connectivity, shared identity, consistent security policy, hybrid DNS and often consistent platforms.", "gcp": "Interconnect or VPN + Cloud Router (network), Cloud Identity / Workforce Identity Federation (identity), **GKE Enterprise / GKE on bare metal or VMware** (consistent Kubernetes on-prem), **Apigee hybrid**, **AlloyDB Omni** and **Google Distributed Cloud** (Google Cloud services on-prem or air-gapped).", "watch": "It's typical for banks to keep core ledgers on-prem or on mainframe, with cloud for digital channels, analytics and AI. Latency and data-movement design across the hybrid boundary are central."}, {"id": "migration-and-hybrid--multicloud", "domain": "migration-and-hybrid", "term": "Multicloud", "tier": "working", "related": ["Cross-Cloud Interconnect", "Exit strategy", "Containers"], "what": "Using more than one public cloud, either deliberately (best-of-breed services, concentration-risk reduction, regulatory exit planning) or through acquisitions and team choices.", "gcp": "Cross-Cloud Interconnect, HA VPN to AWS and Azure, BigQuery Omni (query data in AWS and Azure), GKE attached clusters (manage EKS and AKS as part of a fleet), Workload Identity Federation from AWS or Azure, and Terraform as a common IaC tool.", "watch": "Portability has a cost. Designing to the lowest common denominator throws away managed-service benefits. Regulators want a credible *exit plan*, not necessarily active multicloud."}, {"id": "migration-and-hybrid--mainframe-modernization", "domain": "migration-and-hybrid", "term": "Mainframe modernization", "tier": "aware", "related": ["Strangler fig", "Change data capture"], "what": "Strategies for COBOL and mainframe estates, which are very common in banking: offload data (CDC to BigQuery), wrap transactions with APIs (Apigee), refactor or rewrite with tooling (Google offers mainframe assessment, transpilation and Gemini-assisted code-understanding tools), or re-host on emulation. It's usually a long, phased programme."}, {"id": "ai-ml-and-genai--ai-vs-ml-vs-deep-learning-vs-generative-ai", "domain": "ai-ml-and-genai", "term": "AI vs ML vs deep learning vs generative AI", "tier": "core", "related": ["Foundation models", "ML lifecycle"], "what": "**AI:** systems performing tasks that need human-like intelligence. **ML:** systems that learn patterns from data instead of following hand-written rules. **Deep learning:** ML with multi-layer neural networks. **Generative AI:** models that *produce* new content (text, code, images, audio), mainly **foundation models** (large models pre-trained on broad data and adapted to many tasks). **LLMs** are text and code foundation models built on the transformer architecture.", "watch": "Classic ML (credit scoring with gradient-boosted trees, fraud classifiers) is still most production AI in banks. GenAI adds to it rather than replacing it."}, {"id": "ai-ml-and-genai--learning-types-supervised-unsupervised-reinforcement", "domain": "ai-ml-and-genai", "term": "Learning types: supervised, unsupervised, reinforcement", "tier": "working", "related": ["ML lifecycle", "Evaluation metrics"], "what": "**Supervised:** learn from labeled examples (fraud / not fraud; predict default probability), as classification or regression. **Unsupervised:** find structure without labels (clustering customer segments, anomaly detection). **Reinforcement learning:** learn by trial and reward. **Self-supervised:** how LLMs pre-train (predict the next token). **RLHF and preference tuning:** align model behaviour with human feedback."}, {"id": "ai-ml-and-genai--ml-lifecycle", "domain": "ai-ml-and-genai", "term": "ML lifecycle", "tier": "core", "related": ["MLOps", "Model monitoring", "Model risk management"], "what": "Problem framing → data collection and ingestion → **data preparation** and labeling → **feature engineering** → **training** (and hyperparameter tuning) → **evaluation** and validation → **deployment** (online or batch) → **monitoring** (performance, drift) → **retraining** → and around again. Governance runs throughout (documentation, approval, inventory).", "gcp": "Data in BigQuery and Cloud Storage → BigQuery ML or Agent Platform training (AutoML or custom) → Model Registry → endpoints or batch prediction → model monitoring → Pipelines for automation."}, {"id": "ai-ml-and-genai--training-vs-inference-online-vs-batch-prediction", "domain": "ai-ml-and-genai", "term": "Training vs inference; online vs batch prediction", "tier": "core", "related": ["GPUs and TPUs", "Endpoints"], "what": "**Training** builds the model (expensive, periodic). **Inference / serving** uses it to predict or generate (continuous, latency- and cost-sensitive). **Online prediction:** a synchronous, low-latency request per item through an endpoint (real-time fraud scoring). **Batch prediction:** asynchronous scoring of many records at once (nightly propensity scores), cheaper and higher throughput.", "gcp": "Agent Platform **endpoints** (online, autoscaling, with private endpoints through PSC), **batch prediction** jobs (also for Gemini, at reduced cost), BigQuery ML `ML.PREDICT`, Dataflow RunInference, Cloud Run or GKE for self-hosted models."}, {"id": "ai-ml-and-genai--model-evaluation-metrics", "domain": "ai-ml-and-genai", "term": "Model evaluation metrics", "tier": "working", "related": ["Supervised learning", "LLM evaluation"], "what": "Classification: **precision** (of predicted positives, how many are right), **recall** (of actual positives, how many were caught), **F1**, **ROC-AUC / PR-AUC**, a **confusion matrix**. Regression: RMSE, MAE. Always use **train / validation / test splits** (or time-based splits for financial data) to detect **overfitting**.", "watch": "Fraud and AML data is heavily imbalanced, so accuracy is meaningless. Precision and recall trade-offs map to costs (false declines vs missed fraud)."}, {"id": "ai-ml-and-genai--choosing-a-model-type-for-tabular-and-time-series-problems", "domain": "ai-ml-and-genai", "term": "Choosing a model type for tabular and time-series problems", "tier": "working", "related": ["Learning types", "BigQuery ML"], "what": "Not every problem needs an LLM. **Tabular classification and regression** (credit risk, propensity, fraud): gradient-boosted trees (XGBoost, boosted trees in BigQuery ML) are usually strong, fast and explainable. **Time-series forecasting** (cash demand, call volumes, liquidity): **ARIMA_PLUS** in BigQuery ML, or foundation forecasting models such as TimesFM. **Deep neural networks (DNNs):** unstructured data, very large datasets. **LLMs:** language understanding and generation, extraction from documents, reasoning with tools.", "watch": "Simpler models are easier to validate and explain under model risk management. Use complexity only where it buys accuracy that matters."}, {"id": "ai-ml-and-genai--feature-engineering-and-feature-stores", "domain": "ai-ml-and-genai", "term": "Feature engineering and feature stores", "tier": "working", "related": ["ML lifecycle", "Bigtable", "BigQuery"], "what": "**Features** are model inputs derived from raw data (for example \"number of transactions in the last 1 hour\", \"days since account opened\"). A **feature store** manages feature definitions and serves the *same* values to training (offline, historical, point-in-time correct) and to serving (online, low-latency), which prevents **training/serving skew**.", "gcp": "**Agent Platform Feature Store** (formerly Vertex AI Feature Store) uses BigQuery as the offline store and an online serving layer (optimized or Bigtable-backed) for low-latency lookups."}, {"id": "ai-ml-and-genai--model-registry-and-versioning", "domain": "ai-ml-and-genai", "term": "Model registry and versioning", "tier": "working", "related": ["MLOps", "Model risk management"], "what": "A central catalog of models with versions, lineage (data, code, parameters), evaluation results, aliases (for example `champion` / `challenger`) and deployment status.", "gcp": "**Model Registry** (Agent Platform) works with BigQuery ML models and custom models. It's a natural backbone for the **model inventory** that model risk management rules require."}, {"id": "ai-ml-and-genai--mlops-and-pipelines", "domain": "ai-ml-and-genai", "term": "MLOps and pipelines", "tier": "working", "related": ["CI/CD", "Model registry", "Model monitoring"], "what": "DevOps for ML: automated, reproducible pipelines for data validation → training → evaluation → registration → deployment, with **experiment tracking**, **metadata and lineage**, **continuous training** triggers and approval gates.", "gcp": "**Agent Platform Pipelines** (managed Kubeflow Pipelines / TFX), Experiments, ML Metadata, Cloud Build / Cloud Deploy for serving infrastructure. **LLMOps** extends this to prompts, evaluation datasets, RAG indexes and agent versions."}, {"id": "ai-ml-and-genai--model-monitoring-skew-and-drift", "domain": "ai-ml-and-genai", "term": "Model monitoring: skew and drift", "tier": "working", "related": ["MLOps", "Model risk management"], "what": "**Training/serving skew:** the features at serving time differ from those at training time (often a pipeline bug). **Data drift:** input distributions shift over time (customer behaviour changes). **Concept drift:** the relationship between inputs and outcome changes (fraud tactics evolve). Monitor input distributions, prediction distributions and, when labels arrive, real performance.", "gcp": "Agent Platform **Model Monitoring** (feature skew and drift detection with alerting), plus your own monitoring in BigQuery. Drift triggers investigation or retraining under the model-risk governance process."}, {"id": "ai-ml-and-genai--explainability", "domain": "ai-ml-and-genai", "term": "Explainability", "tier": "working", "related": ["Model risk management", "Consumer Duty", "UK GDPR automated decisions"], "what": "Understanding *why* a model produced an output. **Global** explanations (which features matter overall) and **local** ones (why *this* customer was declined): feature attributions such as **SHAP** and integrated gradients, counterfactuals (\"approved if income were £5k higher\"). For LLMs: citations, reasoning traces and grounding sources.", "gcp": "**Explainable AI** (feature attributions on Agent Platform predictions, BigQuery ML `ML.EXPLAIN_PREDICT`).", "watch": "In credit and other customer-impacting decisions, explainability is a regulatory expectation (fair treatment, the ability to contest decisions), not a nice-to-have."}, {"id": "ai-ml-and-genai--accelerators-and-ai-hypercomputer", "domain": "ai-ml-and-genai", "term": "Accelerators and AI Hypercomputer", "tier": "working", "related": ["GPUs and TPUs", "Quotas"], "what": "**AI Hypercomputer** is Google's umbrella term for its integrated AI infrastructure: TPUs and GPUs, high-bandwidth networking, storage, software (JAX, PyTorch/XLA, vLLM, GKE and Cluster Director), and **consumption models** (on-demand, Spot, committed use, Dynamic Workload Scheduler for flex-start and calendar reservations).", "gcp": "It matters when you train or self-host models. Hosted Gemini or partner models abstract it away."}, {"id": "ai-ml-and-genai--gemini-enterprise-agent-platform-formerly-vertex-ai", "domain": "ai-ml-and-genai", "term": "Gemini Enterprise Agent Platform (formerly Vertex AI)", "tier": "core", "related": ["Model Garden", "Agent Runtime", "Agent Search", "Endpoints"], "what": "Google Cloud's unified AI platform for building, deploying and governing ML models, GenAI apps and agents.", "how": "Main parts: **Model Garden** (Gemini, Gemma, Imagen, Veo, Chirp, plus **partner and open models** such as Anthropic Claude, Llama and Mistral, available as managed APIs or self-deployed), **Agent Studio** (low-code agent building), **Agent Development Kit (ADK)** (code-first), **Agent Runtime** (managed agent hosting, formerly Agent Engine), **Agent Search** (managed enterprise search and RAG, formerly Vertex AI Search), RAG Engine, Vector Search, **Gen AI evaluation**, prompt management, tuning, Pipelines, Feature Store, Model Registry, endpoints, Workbench (notebooks), AutoML. Enterprise controls: IAM, **VPC Service Controls**, **CMEK**, **PSC private endpoints**, regional endpoints, data residency commitments, audit logs.", "gcp": "For a bank, the platform's controls (IAM, VPC-SC, CMEK, private connectivity, logging) are what make GenAI approvable."}, {"id": "ai-ml-and-genai--gemini-gemma-and-google-s-model-family", "domain": "ai-ml-and-genai", "term": "Gemini, Gemma and Google's model family", "tier": "working", "related": ["Model Garden", "Choosing a foundation model"], "what": "**Gemini:** Google's frontier multimodal models (text, code, images, audio, video in; text and some media out), offered in tiers that trade capability against speed and cost (Pro-class for hard reasoning, Flash-class for fast and cheap, Flash-Lite for high volume), with long context windows, thinking and reasoning modes, function calling, structured output, code execution and grounding. **Gemma:** Google's open-weight models, self-hostable (on GKE, Cloud Run with GPUs, or on-prem). **Imagen / Veo:** image and video generation. **Chirp:** speech.", "watch": "Model versions retire on published schedules. Pin versions in production, track deprecation dates, and plan re-validation (a model-risk requirement)."}, {"id": "ai-ml-and-genai--ai-studio-vs-agent-platform", "domain": "ai-ml-and-genai", "term": "AI Studio vs Agent Platform", "tier": "working", "related": ["API keys", "VPC Service Controls", "Data governance for GenAI"], "what": "**Google AI Studio / Gemini Developer API:** quick prototyping with API keys, aimed at developers, with different terms and controls. **Agent Platform Gemini API:** the enterprise route, with IAM, quotas per project, VPC-SC, CMEK, regional processing, audit logs and enterprise data-governance terms.", "watch": "Banks should use the enterprise platform for anything touching real data. Most block AI Studio."}, {"id": "ai-ml-and-genai--choosing-a-foundation-model", "domain": "ai-ml-and-genai", "term": "Choosing a foundation model", "tier": "working", "related": ["Gemini", "Model Garden", "LLM evaluation"], "what": "Weigh: **task quality** (on *your* evaluation set, not public benchmarks), **latency** (time to first token, tokens per second), **cost per token**, **context window**, **modality**, **availability in your region and ML processing location**, **data governance terms**, **quota and capacity**, tool use and structured-output reliability, and **model-risk validation effort**.", "how": "Common pattern: route easy, high-volume tasks to a small, fast model, and hard reasoning to a large model. Re-evaluate when new versions arrive."}, {"id": "ai-ml-and-genai--llm-basics-tokens-context-window-and-sampling", "domain": "ai-ml-and-genai", "term": "LLM basics: tokens, context window and sampling", "tier": "core", "related": ["Prompt engineering", "Token costs", "Hallucination"], "what": "**Tokens** are sub-word units (about 4 characters of English each). Models read and write tokens, and pricing and limits are in tokens. The **context window** is the maximum input + output tokens per request (it includes system instructions, history, retrieved documents and tool results). **Sampling parameters:** **temperature** (randomness: low for factual and deterministic tasks, higher for creative ones), **top-p** (nucleus sampling: sample from the smallest set of tokens whose probability adds up to p), **top-k**, **max output tokens**, stop sequences, and safety settings.", "watch": "A long context isn't free: cost and latency grow, and models can miss information in the middle of very long contexts. Retrieval beats stuffing everything in."}, {"id": "ai-ml-and-genai--prompt-engineering", "domain": "ai-ml-and-genai", "term": "Prompt engineering", "tier": "core", "related": ["LLM basics", "Structured output", "Few-shot"], "what": "Designing inputs to get reliable outputs. **System instructions** (role, rules, tone, constraints), **zero-shot** (just instructions), **one-shot / few-shot** (include examples), **chain-of-thought** or thinking (reason step by step, now often built in as \"thinking\" modes), **role prompting**, delimiting untrusted content, specifying output format, and **prompt chaining** (break a task into steps).", "how": "Version prompts like code. Evaluate changes against a fixed test set before shipping."}, {"id": "ai-ml-and-genai--structured-output-and-json-schema", "domain": "ai-ml-and-genai", "term": "Structured output and JSON schema", "tier": "working", "related": ["Function calling", "Prompt engineering"], "what": "Constraining the model to return output matching a schema (JSON with required fields and enums), through `response_schema` / controlled generation, so downstream code can parse it reliably (for example extracting fields from a loan application)."}, {"id": "ai-ml-and-genai--embeddings", "domain": "ai-ml-and-genai", "term": "Embeddings", "tier": "core", "related": ["Vector search", "RAG", "Semantic similarity"], "what": "Dense numeric vectors (for example 768 or 3072 dimensions) that represent the *meaning* of text, images or other data. Similar meanings sit close together in vector space (measured by cosine similarity or dot product).", "gcp": "Text and multimodal **embedding models** on Agent Platform (Gemini embeddings), callable from BigQuery (`ML.GENERATE_EMBEDDING`) and AlloyDB (`embedding()` function). Used for semantic search, RAG, clustering, deduplication, recommendations and classification.", "watch": "Embeddings from different models aren't compatible. Changing the model means re-embedding the whole corpus."}, {"id": "ai-ml-and-genai--vector-search-and-approximate-nearest-neighbour-ann", "domain": "ai-ml-and-genai", "term": "Vector search and approximate nearest neighbour (ANN)", "tier": "core", "related": ["Embeddings", "RAG", "AlloyDB", "BigQuery"], "what": "Finding the vectors most similar to a query vector. Exact search compares against every vector (slow at scale). **ANN** indexes (ScaNN, HNSW, IVF) trade a little recall for big speed gains. **Hybrid search** combines vector similarity with keyword search (BM25) and metadata **filters** (for example only documents this user may see, only current policy versions).", "gcp": "**Vector Search** (formerly Vertex AI Vector Search; ScaNN-based, billions of vectors, low latency), **AlloyDB / Cloud SQL pgvector** (with ScaNN in AlloyDB, which keeps vectors next to transactional data and SQL filters), **BigQuery vector search** (`VECTOR_SEARCH`, analytics-scale), Spanner, Firestore and Memorystore vector support, plus managed RAG (Agent Search, RAG Engine)."}, {"id": "ai-ml-and-genai--retrieval-augmented-generation-rag", "domain": "ai-ml-and-genai", "term": "Retrieval-augmented generation (RAG)", "tier": "core", "related": ["Embeddings", "Vector search", "Grounding", "Chunking"], "what": "Giving the model relevant, current, private information at query time by **retrieving** it and adding it to the prompt, instead of relying on what the model memorized in training. It reduces hallucination, allows **citations**, and keeps knowledge fresh without retraining.", "how": "**Ingestion:** parse documents (PDF, HTML; layout-aware parsing with Document AI or Gemini) → **chunk** → **embed** → **index**, with metadata (source, date, access-control lists). **Query time:** rewrite or expand the query → retrieve the top-k chunks (hybrid + filters) → optionally **rerank** → build the prompt with the chunks and instructions to cite → generate → return the answer with sources. **Evaluate** retrieval (recall, precision) and generation (groundedness, relevance) separately.", "gcp": "Build it yourself (Cloud Run + AlloyDB or Vector Search + Gemini), or use **RAG Engine** (managed pipeline over your corpora), **Agent Search** (managed enterprise search with connectors and ACLs), or BigQuery-based RAG. Ingestion triggered by Eventarc on new GCS documents is a common pattern.", "watch": "Most RAG failures are retrieval failures: bad chunking, missing metadata filters, stale indexes, permissions not enforced at retrieval time."}, {"id": "ai-ml-and-genai--chunking-strategies", "domain": "ai-ml-and-genai", "term": "Chunking strategies", "tier": "working", "related": ["RAG", "Embeddings"], "what": "Splitting documents into retrievable pieces. **Fixed-size** with overlap (simple), **structure-aware** (by headings, sections, tables; best for policies and contracts), **semantic** (split where the topic changes), **hierarchical / parent-child** (retrieve small chunks, pass the larger parent section to the model). Keep metadata (document ID, section, page, effective date, classification) on every chunk."}, {"id": "ai-ml-and-genai--grounding-and-citations", "domain": "ai-ml-and-genai", "term": "Grounding and citations", "tier": "working", "related": ["RAG", "Hallucination"], "what": "Tying model outputs to verifiable sources. **Grounding with Google Search** (public web facts), **grounding with your data** (Agent Search, RAG Engine, your own retrieval), grounding with Google Maps or enterprise sources. The response includes **grounding metadata** / citations linking claims to sources, and groundedness can be checked by evaluation."}, {"id": "ai-ml-and-genai--hallucination", "domain": "ai-ml-and-genai", "term": "Hallucination", "tier": "core", "related": ["Grounding", "LLM evaluation", "Human-in-the-loop"], "what": "A model generating fluent but false or unsupported content (invented policy clauses, wrong figures, fake citations). It's inherent to how LLMs predict text.", "how": "Mitigations: RAG and grounding with citations, instructions to say \"I don't know\", constrained or structured outputs, tools for facts and calculations (don't let the model do arithmetic on balances; call a function), verification steps (a second model or rules), evaluation, and **human review** for high-stakes outputs."}, {"id": "ai-ml-and-genai--fine-tuning-vs-rag-vs-prompting", "domain": "ai-ml-and-genai", "term": "Fine-tuning vs RAG vs prompting", "tier": "core", "related": ["Prompt engineering", "RAG", "PEFT"], "what": "**Prompting:** fastest and cheapest. Try it first. **RAG:** adds *knowledge* (facts, documents, changing data). **Fine-tuning / tuning:** changes *behaviour* (style, format, domain-specific tasks, classification) using labeled examples. **Supervised fine-tuning**, **preference tuning**, **distillation** (train a small model to imitate a large one for cost and latency).", "how": "**PEFT / LoRA** (parameter-efficient fine-tuning) trains small adapter weights instead of the whole model, so it's cheaper. Agent Platform offers managed tuning for Gemini and open models.", "watch": "Fine-tuning doesn't reliably teach facts and needs re-validation with each base-model change. For knowledge, use RAG. A tuned model is also a new model for model-risk purposes."}, {"id": "ai-ml-and-genai--function-calling-and-tool-use", "domain": "ai-ml-and-genai", "term": "Function calling and tool use", "tier": "core", "related": ["Agents", "MCP", "OpenAPI"], "what": "The model is given **tool declarations** (name, description, JSON schema of parameters). Instead of answering directly, it can return a structured **function call**. *Your code* executes it (calls an API, queries a database) and returns the result, and the model continues.", "how": "The model never executes anything itself. The application decides whether and how to run each call, which is your control point for authorization, validation and logging. Tool descriptions are effectively prompts, so write them carefully.", "watch": "Every tool is an attack surface. Least-privilege tool identities, input validation, and human confirmation for consequential actions (payments, emails to customers)."}, {"id": "ai-ml-and-genai--ai-agents", "domain": "ai-ml-and-genai", "term": "AI agents", "tier": "core", "related": ["Function calling", "ADK", "Agent Runtime", "Multi-agent systems"], "what": "Systems where an LLM **decides the next step** in a loop: **reason / plan → act (call a tool) → observe the result → repeat** until the goal is met. Agents combine a model, instructions, **tools**, **memory / state**, and orchestration logic.", "how": "There's a spectrum from **deterministic workflows** (fixed steps, with an LLM at certain points; predictable and auditable) to **autonomous agents** (the LLM chooses steps; flexible, less predictable). **Multi-agent** systems split work among specialist agents (a router, a researcher, a writer), coordinated by an orchestrator or by agent-to-agent protocols.", "watch": "In regulated settings, prefer the most deterministic design that solves the problem, keep a human in the loop for consequential actions, log every step, and evaluate **trajectories** (the steps taken), not only final answers."}, {"id": "ai-ml-and-genai--agent-development-kit-adk", "domain": "ai-ml-and-genai", "term": "Agent Development Kit (ADK)", "tier": "core", "related": ["AI agents", "Agent Runtime", "A2A protocol", "MCP"], "what": "Google's open-source, code-first framework for building agents and multi-agent systems (Python, Java, Go, TypeScript). It's model-agnostic, but optimized for Gemini and Agent Platform.", "how": "**Agents:** `LlmAgent` (an LLM with instructions and tools), **workflow agents** (`SequentialAgent`, `ParallelAgent`, `LoopAgent`) for deterministic orchestration, and custom agents. **Tools:** Python functions, built-in tools (Google Search, code execution), **OpenAPI tools**, **MCP tools**, other agents used as tools, and Google Cloud integrations. **Sessions, state and memory** services, **callbacks** (before and after model or tool calls: guardrails, logging, PII redaction), **artifacts**, **evaluation** (`adk eval` against test sets, including trajectories), a dev UI, streaming (bidirectional audio and video), and **A2A** support. Deploy to **Agent Runtime**, **Cloud Run** or **GKE**. The `agents-cli` scaffolding generates FastAPI serving, A2A endpoints and deployment configuration."}, {"id": "ai-ml-and-genai--agent-runtime-formerly-agent-engine", "domain": "ai-ml-and-genai", "term": "Agent Runtime (formerly Agent Engine)", "tier": "working", "related": ["ADK", "Sessions and memory", "Cloud Run"], "what": "Managed infrastructure on Agent Platform for deploying, scaling and governing agents built with ADK, LangGraph, LangChain, CrewAI, LlamaIndex or custom code.", "how": "Provides managed **sessions** (conversation state), **Memory Bank** (long-term memory across sessions), a sandboxed **code execution** environment, built-in tracing, logging and monitoring, evaluation integration, IAM, VPC-SC and private networking options, plus agent identity.", "gcp": "Compared with Cloud Run, Agent Runtime gives you agent-specific managed services with less plumbing. Cloud Run gives full control over the container, networking and serving stack (and is where many existing FastAPI-based agent servers live)."}, {"id": "ai-ml-and-genai--sessions-state-and-memory", "domain": "ai-ml-and-genai", "term": "Sessions, state and memory", "tier": "working", "related": ["Stateless vs stateful services", "Agent Runtime"], "what": "**Session:** one conversation thread (events and messages). **State:** key/value data scoped to the session, user or app (for example the selected account, a draft in progress). **Memory:** long-term knowledge recalled across sessions (user preferences, prior cases), usually extracted and retrieved semantically.", "watch": "Memory holds personal data. Apply retention limits, access controls, the right to erasure, and don't let memory become an unmanaged copy of customer data."}, {"id": "ai-ml-and-genai--model-context-protocol-mcp", "domain": "ai-ml-and-genai", "term": "Model Context Protocol (MCP)", "tier": "core", "related": ["Function calling", "ADK", "Apigee"], "what": "An open protocol (originally from Anthropic) that standardizes how AI applications connect to tools and data. **MCP servers** expose **tools** (actions), **resources** (data) and **prompts**. **MCP clients** inside host applications (IDEs, chat apps, agents) discover and call them.", "how": "Transports: **stdio** (local processes) and **streamable HTTP** (remote servers, using SSE for streaming). Authorization for remote servers is based on **OAuth 2.1**. One MCP server can serve many agent frameworks and models, so integrations are built once.", "gcp": "Host MCP servers on **Cloud Run** (with IAM or IAP authentication), consume them from ADK (`McpToolset`), and put **Apigee** in front for governance. Google also provides MCP servers for some of its own services (for example databases through the MCP Toolbox for Databases). Check current availability.", "watch": "Third-party MCP servers are code and tool descriptions you're trusting. Tool-description poisoning and over-broad tokens are real risks. Allow-list approved servers."}, {"id": "ai-ml-and-genai--agent2agent-protocol-a2a", "domain": "ai-ml-and-genai", "term": "Agent2Agent protocol (A2A)", "tier": "core", "related": ["ADK", "MCP", "Multi-agent systems"], "what": "An open protocol (started by Google, now under the Linux Foundation) for **agents to communicate with other agents** across frameworks, vendors and organizations. MCP connects an agent to *tools*. A2A connects an agent to *other agents* that have their own reasoning.", "how": "Each agent publishes an **Agent Card** (JSON metadata at a well-known URL: name, skills, endpoint, supported auth schemes and capabilities). Clients send **messages** (made of **parts**: text, files, data) over **JSON-RPC 2.0 on HTTPS**, creating **tasks** with a lifecycle (submitted, working, input-required, completed, failed) that produce **artifacts**. It supports **streaming (SSE)** and **push notifications** for long-running tasks. Security uses standard HTTP auth (OAuth/OIDC, API keys, mTLS), declared in the card.", "gcp": "ADK agents can be exposed as A2A servers (the `agents-cli` scaffold generates the A2A adapter) and can call remote A2A agents. Agent Runtime and Cloud Run host them. In an enterprise, this enables a catalogue of team-owned agents that other agents can delegate to."}, {"id": "ai-ml-and-genai--llm-and-agent-evaluation", "domain": "ai-ml-and-genai", "term": "LLM and agent evaluation", "tier": "core", "related": ["Hallucination", "Testing types", "Model risk management"], "what": "Systematically measuring quality, safety and behaviour before and after release. **Golden datasets** (curated inputs with expected outputs or criteria), **computation-based metrics** (exact match, ROUGE, tool-call correctness), **model-based metrics / LLM-as-judge (autoraters)** with rubrics (groundedness, relevance, helpfulness, safety, instruction following), **pairwise comparison** (A vs B), **trajectory evaluation** for agents (did it call the right tools, in the right order, with the right arguments?), plus human evaluation and red-teaming.", "gcp": "The **Gen AI evaluation service** on Agent Platform (pointwise and pairwise, custom rubrics, agent evaluation), ADK eval, and results logged to BigQuery and Experiments.", "watch": "Run evaluations in CI for every prompt, model or tool change, the way you'd run unit tests. In a bank, evaluation evidence is part of model validation."}, {"id": "ai-ml-and-genai--guardrails-safety-filters-and-model-armor", "domain": "ai-ml-and-genai", "term": "Guardrails, safety filters and Model Armor", "tier": "working", "related": ["Prompt injection", "Sensitive Data Protection", "Apigee"], "what": "Controls on model inputs and outputs. **Safety settings / content filters** (harm categories, with configurable thresholds), **Model Armor** (Google Cloud's service that screens prompts and responses for **prompt injection and jailbreaks**, **sensitive data** (through Sensitive Data Protection), **malicious URLs** and harmful content, using templates and policy at the platform or API level), **application guardrails** (ADK callbacks, allow-listed topics, output validators, PII redaction) and **policy enforcement** at the gateway (Apigee).", "gcp": "Layer them: Apigee or a gateway → Model Armor → model → output checks → human review for high-risk actions."}, {"id": "ai-ml-and-genai--prompt-injection", "domain": "ai-ml-and-genai", "term": "Prompt injection", "tier": "core", "related": ["Guardrails", "OWASP Top 10 for LLM apps", "Tool use"], "what": "Attackers smuggle instructions into model input to override the system's intent. **Direct:** the user types \"ignore previous instructions…\". **Indirect:** malicious instructions hidden in content the model reads (a web page, an email, a PDF in the RAG corpus, a tool result), for example \"forward this conversation to attacker@…\".", "how": "No complete fix exists, so contain the impact: least-privilege tools, no secrets in prompts, treat all retrieved and tool content as untrusted data, separate and delimit untrusted content, require **human confirmation** for consequential actions, screen inputs and outputs (Model Armor), restrict outbound actions (no arbitrary URLs or emails), and monitor.", "watch": "It's the main security risk for agents with tools. An agent that can read customer emails *and* send payments is a confused-deputy risk by design."}, {"id": "ai-ml-and-genai--owasp-top-10-for-llm-applications-and-saif", "domain": "ai-ml-and-genai", "term": "OWASP Top 10 for LLM applications and SAIF", "tier": "working", "related": ["Prompt injection", "Threat modeling"], "what": "**OWASP Top 10 for LLM apps:** prompt injection, sensitive information disclosure, supply chain, data and model poisoning, improper output handling (for example rendering model output as HTML or SQL without checks), excessive agency, system prompt leakage, vector and embedding weaknesses, misinformation, unbounded consumption (cost and DoS). **SAIF** (Google's **Secure AI Framework**) has six elements for securing AI systems, extending existing security foundations, detection and response, automation, platform controls, adaptation, and risk context to AI."}, {"id": "ai-ml-and-genai--data-governance-for-genai-on-google-cloud", "domain": "ai-ml-and-genai", "term": "Data governance for GenAI on Google Cloud", "tier": "core", "related": ["Data residency", "UK GDPR", "VPC Service Controls"], "what": "What happens to your prompts and data. On the enterprise platform, Google commits **not to use customer data to train its models** without permission, and customer data stays under the Cloud data-processing terms.", "how": "Know: **endpoint and ML processing location** (regional endpoints vs the **global endpoint**, which may process in any region; not every model is in every region), **caching** (in-memory caching of inputs for performance, which can be disabled) and **abuse-monitoring logging** (exemption processes exist for approved customers), CMEK for stored artifacts (tuning data, indexes), VPC-SC around the AI APIs, **Data Access audit logs** for model calls, and your own **prompt and response logging** (useful for evaluation and audit, but it's a new store of personal data).", "watch": "Check the current \"data governance\" and \"data residency\" pages for each model before approval. Commitments differ by model and feature, and partner models (Claude, Llama) have their own terms through Model Garden."}, {"id": "ai-ml-and-genai--quotas-provisioned-throughput-and-429-handling", "domain": "ai-ml-and-genai", "term": "Quotas, Provisioned Throughput and 429 handling", "tier": "working", "related": ["Quotas and limits", "Retries"], "what": "Gemini on Agent Platform uses **dynamic shared quota** for many models (capacity shared across customers, so bursts can get **429 Resource Exhausted**) and offers **Provisioned Throughput** (reserved capacity in throughput units, bought for a term) for guaranteed, predictable performance.", "how": "Handle 429s with retries with backoff and jitter, client-side rate limiting, queueing (Cloud Tasks or Pub/Sub) for non-interactive work, fallback models or regions, and Provisioned Throughput for critical customer-facing paths."}, {"id": "ai-ml-and-genai--token-costs-context-caching-and-batch", "domain": "ai-ml-and-genai", "term": "Token costs, context caching and batch", "tier": "working", "related": ["FinOps", "LLM basics"], "what": "Cost = input tokens × input price + output tokens × output price (+ thinking tokens, grounding fees, tool calls). Output tokens usually cost several times more. Levers: smaller models for easy tasks, shorter prompts, retrieval instead of stuffing, **context caching** (reuse a large repeated prefix such as a policy manual at a discount; implicit and explicit caching), **batch prediction** (discounted asynchronous jobs), and response caching for repeated questions.", "watch": "Agents multiply tokens: every loop re-sends the history and tool results. Track **cost per completed task**, not per call."}, {"id": "ai-ml-and-genai--latency-for-llm-apps", "domain": "ai-ml-and-genai", "term": "Latency for LLM apps", "tier": "working", "related": ["Server-sent events", "Model choice"], "what": "**Time to first token (TTFT)** (perceived responsiveness) vs **tokens per second** (completion speed) vs end-to-end task time (agents with many steps). Improve with streaming (SSE), smaller and faster models, parallel tool calls, caching, shorter outputs, regional proximity, and fewer sequential agent steps."}, {"id": "ai-ml-and-genai--human-in-the-loop", "domain": "ai-ml-and-genai", "term": "Human-in-the-loop", "tier": "working", "related": ["AI agents", "Workflows", "Consumer Duty"], "what": "A human reviews, approves or corrects AI outputs or actions at defined points: approving a payment the agent prepared, an underwriter validating an AI-drafted credit memo, an analyst confirming a suspicious-activity narrative.", "gcp": "Workflows callbacks, ADK tool confirmations, case-management integrations. It's usually required where outcomes affect customers or regulatory filings."}, {"id": "ai-ml-and-genai--responsible-ai-fairness-bias-and-transparency", "domain": "ai-ml-and-genai", "term": "Responsible AI: fairness, bias and transparency", "tier": "working", "related": ["Explainability", "Consumer Duty", "Model risk management"], "what": "Ensuring AI systems are fair (no unjustified differences in outcomes across protected characteristics), transparent (people know when AI is used and why decisions were made), accountable (clear ownership), privacy-preserving, safe and robust.", "how": "Measure bias across groups (with care around proxies such as postcode), use representative data, document models (model cards, data sheets), check that disclosures to customers are accurate, give customers a way to contest decisions, and monitor after deployment."}, {"id": "ai-ml-and-genai--document-ai", "domain": "ai-ml-and-genai", "term": "Document AI", "tier": "working", "related": ["RAG", "KYC"], "what": "Managed document processing: OCR, layout parsing, form and table extraction, and specialized processors (identity documents, bank statements, invoices, pay slips), plus custom extractors and classifiers built on generative models.", "gcp": "Bank uses: KYC and onboarding document extraction, mortgage document processing, layout-aware parsing for RAG ingestion."}, {"id": "ai-ml-and-genai--pre-built-ai-apis", "domain": "ai-ml-and-genai", "term": "Pre-built AI APIs", "tier": "aware", "related": ["Document AI"], "what": "Task-specific APIs: **Speech-to-Text** and **Text-to-Speech** (contact-centre transcription, voice agents), **Translation**, **Natural Language** (entities, sentiment), **Vision** (labels, OCR), **Video Intelligence**. Often the cheapest, most predictable option for narrow tasks."}, {"id": "ai-ml-and-genai--gemini-enterprise-notebooklm-and-customer-engagement-suite", "domain": "ai-ml-and-genai", "term": "Gemini Enterprise, NotebookLM and Customer Engagement Suite", "tier": "aware", "related": ["Agent Search", "AI agents"], "what": "**Gemini Enterprise** (formerly Agentspace): an employee-facing platform for enterprise search across connected systems, prebuilt agents and agent creation, with access controls. **NotebookLM Enterprise:** research and summarization over your own sources. **Customer Engagement Suite:** contact-centre AI: conversational agents (voice and chat bots), Agent Assist (real-time help for human agents), Conversational Insights (analytics). These are \"buy\" options to weigh against building with ADK."}, {"id": "ai-ml-and-genai--gemini-code-assist-and-ai-assisted-engineering", "domain": "ai-ml-and-genai", "term": "Gemini Code Assist and AI-assisted engineering", "tier": "aware", "related": ["CI/CD", "Testing types"], "what": "AI coding assistance in IDEs and on the command line (Gemini Code Assist, Gemini CLI, and others), including test generation, code review and code transformation. Enterprise editions add code customization on private repositories and data-protection terms. The new exam guides include AI-assisted development."}, {"id": "uk-banking-regulation-and-risk--uk-regulators-and-who-cares-about-what", "domain": "uk-banking-regulation-and-risk", "term": "UK regulators and who cares about what", "tier": "core", "related": ["Operational resilience", "Model risk management", "UK
