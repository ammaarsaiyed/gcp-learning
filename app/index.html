n| Security after breaches | Landing zone with org policies, SCC, Chronicle/SecOps, zero trust (IAP, BeyondCorp), incident response plan, VPC-SC | Explicitly called out |\n| Plant and HQ connectivity | **Interconnect** at major sites, **Network Connectivity Center** with SD-WAN for branches and plants | Hub-and-spoke across many sites |\n\n**Trade-offs:** on-device vs cloud AI (latency, connectivity, cost, update management). Spanner vs Cloud SQL for global build-to-order inventory. Monetisation value vs privacy risk (aggregation thresholds, clean rooms).\n\n**Practice questions**\n1. Vehicles lose connectivity for hours. How do you avoid data loss? <details><summary>Answer<\/summary>Buffer on the vehicle (store-and-forward), send with sequence numbers and event timestamps, use idempotent ingestion, and handle late data with Dataflow event-time windows and watermarks.<\/details>\n2. How do you share insights with partners without exposing personal data? <details><summary>Answer<\/summary>Aggregated, de-identified datasets shared through Analytics Hub (and data clean rooms), with Sensitive Data Protection de-identification, consent checks and contractual controls.<\/details>\n3. The ERP blocks new promotions. What's the modernisation path? <details><summary>Answer<\/summary>Strangler fig: expose the needed capabilities through APIs, build new promotion and pricing services in the cloud reading ERP data through CDC, and retire ERP functions gradually.<\/details>\n\n### Case 4: Altostrat Media\n\n**In short:** a media company already on Google Cloud (GKE content platform, Cloud Storage media library, BigQuery warehouse, Cloud Run functions for transcoding and metadata), plus legacy on-prem ingestion and archival. It wants GenAI for summarisation, metadata extraction, harmful-content detection, natural-language support (24/7), personalisation and recommendations, with **auditable, explainable AI**. Priorities: **reliability and cost**, optimising storage costs, modern CI/CD with central management, hybrid Kubernetes, secure hybrid connectivity for ingestion.\n\n**Requirements → decisions**\n\n| Requirement | Design response | Why |\n|---|---|---|\n| Summaries of audio, video and documents | **Gemini** multimodal (long context for video and audio), triggered by **Eventarc** on new media in GCS, results stored in BigQuery and Firestore | Native multimodal understanding, event-driven |\n| Rich metadata (NLP and vision) | Gemini + Video Intelligence / Speech-to-Text where cheaper or more deterministic | Mix specialised APIs and LLMs by cost and accuracy |\n| Harmful content detection | Gemini safety classification + safety filters, with human review queues for borderline cases, every decision logged with rationale | \"Auditable and explainable\" means decisions with reasons and a human appeal path |\n| 24/7 natural-language support | Conversational agent (ADK or Conversational Agents) grounded in help content (Agent Search / RAG), with handoff | Cuts support load and stays grounded |\n| Personalisation and recommendations | BigQuery features + recommendation models (BigQuery ML / Agent Platform), embeddings for content similarity | Builds on the existing warehouse |\n| Optimise storage cost for a growing media library | **Autoclass** or lifecycle rules (Standard → Nearline → Coldline → Archive), with archive moved from on-prem into Archive class | Media access cools quickly, and all classes keep millisecond access |\n| Hybrid Kubernetes, central CI/CD | **GKE Enterprise fleets** (GKE on-prem plus cloud), Config Sync, **Cloud Build + Cloud Deploy**, Artifact Registry | \"Centralised management platform\" |\n| Secure, high-performance hybrid ingestion | Interconnect (or HA VPN to start), Storage Transfer Service agents for bulk moves | Large media volumes |\n| Reliability | SLOs, alerting to on-call (not email), regional GKE, multi-region buckets for key assets | Reliability is a top priority |\n| Auditable AI | Log prompts, model versions and outputs (with retention), evaluation datasets, explanations attached to moderation decisions, model cards | Explicit requirement |\n\n**Trade-offs:** Gemini for everything vs specialised APIs (flexibility vs cost and determinism). Autoclass (hands-off) vs explicit lifecycle rules (predictable). Fully automated moderation vs human review (scale vs accuracy and appeals).\n\n**Practice questions**\n1. Media is accessed heavily for 2 weeks, then rarely, but must stay instantly playable. Which storage approach? <details><summary>Answer<\/summary>Autoclass or lifecycle rules down to colder classes. All GCS classes give millisecond access, so playback still works. Weigh retrieval costs for popular back-catalogue items.<\/details>\n2. Regulators ask why a video was removed. What must the design provide? <details><summary>Answer<\/summary>A logged decision record: model version, scores and categories, rationale, any human reviewer action, and timestamps, kept for the required period, plus an appeal workflow.<\/details>\n3. How do you run consistent deployments to on-prem and cloud clusters? <details><summary>Answer<\/summary>GKE Enterprise fleets with Config Sync (GitOps), with Cloud Deploy targeting both, from the same Artifact Registry images.<\/details>\n\n---\n\n## Part 3: Make your own case studies (the best long-term practice)\n\nTake any system you work with and write a one-page \"case study\" in Google's format: **company overview → solution concept → existing technical environment → business requirements → technical requirements → executive statement**. Then design it with the loop, and have a colleague review it with the [design review checklist](../cheatsheets/solution-design-template.md). Doing this for 3–4 real systems builds more architecture skill than any course.\n"}, {"id": "04", "title": "Practice resources (and how to use each one)", "md": "# Practice resources (and how to use each one)\n\nThere's a lot of material online. Most of it is useful only if you use it **actively**: design first, then compare. Here are the sources worth your time, and the exercise that turns each into practice.\n\n## Google Cloud (official)\n\n| Resource | What it is | How to practise with it |\n|---|---|---|\n| [Cloud Architecture Center](https://docs.cloud.google.com/architecture) | Hundreds of reference architectures, design guides and deployable solutions | **Reverse-engineer kata:** read only a guide's problem statement or first paragraph, design it yourself in 20 minutes, then compare with Google's diagram. Note every difference and why they chose differently |\n| [Architecture fundamentals](https://docs.cloud.google.com/architecture/fundamentals): Enterprise foundations blueprint, landing zone design, **deployment archetypes** | How enterprise GCP estates are structured (what your bank's platform team built) | Map your bank's real landing zone to the blueprint: hierarchy, network, identity, logging. Where does it differ, and why? |\n| [Well-Architected Framework](https://docs.cloud.google.com/architecture/framework) | Pillars: operational excellence, security, reliability, cost, performance, sustainability, plus perspectives | Score one of your designs against each pillar's recommendations. Write down 3 gaps |\n| [Financial services perspective](https://docs.cloud.google.com/architecture/framework/perspectives/fsi) | WAF applied to banks, payments, insurers and markets (resilience, security, regulatory angles) | Read before any bank design review. Turn each recommendation into a review question |\n| [Generative AI architectures overview](https://docs.cloud.google.com/architecture/genai-overview) | RAG (several vector-store variants, GraphRAG), agentic RAG, single- and multi-agent systems with ADK and MCP, secure networking for RAG, CI/CD for RAG | Compare each with the [RAG lab](../practice/design-lab.md) and the [agent lab](../practice/design-lab.md). Which choices differ, and when would you pick theirs? |\n| [Architecture Center release notes](https://docs.cloud.google.com/architecture/release-notes) | What's new (new agent and AI reference architectures appear here first) | Skim monthly. Pick one new architecture a month for a kata |\n| [PCA exam guide](https://services.google.com/fh/files/misc/v6.1_pca_professional_cloud_architect_exam_guide_english.pdf) + case studies ([EHR](https://services.google.com/fh/files/misc/v6.1_pca_ehr_healthcare_case_study_english.pdf), [Cymbal](https://services.google.com/fh/files/misc/v6.1_pca_cymbal_retail_case_study_english.pdf), [KnightMotives](https://services.google.com/fh/files/misc/v6.1_pca_knightmotives_automotive_case_study_english.pdf), [Altostrat](https://services.google.com/fh/files/misc/v6.1_pca_altostrat_media_case_study_english.pdf)) | The syllabus for architects, and four realistic businesses | Design each case from scratch before reading [the analysis](03-worked-designs-and-case-studies.md). Redo one a month with a twist (a new region, a new regulation, 10× traffic) |\n| [Architecture diagramming tool](https://googlecloudcheatsheet.withgoogle.com/architecture) | Free drag-and-drop GCP diagrams with templates, linked to product descriptions | Draw every design you practise. Drawing exposes missing pieces |\n| [Google Cloud Skills Boost](https://www.cloudskillsboost.google) | Hands-on labs in temporary projects, including challenge labs | When you have time to build, choose **challenge labs** (no instructions) on networking, security and AI. They test integration, not following steps |\n| [Google SRE books](https://sre.google/books/) (free online) | How Google runs production: SLOs, alerting, incident response, release engineering | Read the chapters on SLOs, alerting on SLOs and handling overload. Then rewrite the alerting for one of your services |\n\n## Banking and AI governance (very relevant to you)\n\n| Resource | What it is | How to practise |\n|---|---|---|\n| [FINOS Common Cloud Controls](https://github.com/finos/common-cloud-controls) | An open standard of cloud controls for financial services, started by Citi with major banks and cloud providers (Google among them) | Pick a service (for example object storage) and map each CCC control to the GCP feature that implements it. That's exactly what bank cloud security teams do |\n| [FINOS AI Governance Framework](https://air-governance-framework.finos.org/) | An open catalogue of AI risks and mitigations for financial institutions, including agentic AI risks (prompt injection, memory poisoning, agent authority), mapped to OWASP, the EU AI Act, Consumer Duty and others | For each AI design you make, pick the relevant risks and name the control in your architecture. Great preparation for model risk and security reviews |\n| [OWASP GenAI Security Project / Top 10 for LLM apps](https://genai.owasp.org/) | Security risks for LLM and agent applications | Threat-model one of the [design lab](../practice/design-lab.md) agents against all ten |\n| Bank of England / PRA and FCA publications: **SS1/21** (operational resilience), **SS2/21** (outsourcing and third-party risk), **SS1/23** (model risk management), **Consumer Duty** | The actual rules behind most bank design reviews | Read the executive summaries. Then, for one of your systems, write the \"impact tolerance + mapping + testing\" paragraph and the \"model risk tier + validation\" paragraph |\n\n## General architecture skill (cloud-agnostic)\n\n| Resource | What it is | How to practise |\n|---|---|---|\n| [System Design Primer](https://github.com/donnemartin/system-design-primer) | A well-known open guide to scalability, caching, consistency, load balancing and databases, with worked designs | Do its exercises, then translate each design into GCP services. That forces you to connect generic concepts to products |\n| *Designing Data-Intensive Applications* (Martin Kleppmann) | The best book on data systems: replication, partitioning, transactions, consistency, streams | Read chapters 5–9 alongside atlas [06](../atlas/06-storage-and-databases.md) and [07](../atlas/07-data-processing-and-messaging.md). It explains *why* Spanner, Bigtable and Pub/Sub behave as they do |\n| [C4 model](https://c4model.com/) | A simple, layered way to draw architecture (context → containers → components) | Redraw one of your team's diagrams as C4 context and container diagrams |\n| [Architecture decision records](https://adr.github.io/) | Templates and practice for recording decisions | Write ADRs for the 3 biggest decisions in your current project |\n| Architectural katas (Neal Ford's kata format) | Short, realistic briefs designed in small groups, then presented and critiqued | Run one with colleagues every couple of weeks using the [design lab](../practice/design-lab.md) briefs or your own |\n| [Cloud Resume Challenge](https://cloudresumechallenge.dev/) | A single end-to-end project (with a GCP edition) that touches DNS, CDN, serverless, a database, IaC and CI/CD | When you're ready to build, it's the best \"everything together\" project |\n\n## A sustainable practice routine (about 2 hours a week)\n\n| Cadence | Activity |\n|---|---|\n| Daily, 10 min | Flashcards that are due, in the app |\n| Twice a week, 20 min | One [design lab](../app/index.html#architect) scenario or one [design review](../practice/design-reviews.md) |\n| Weekly, 45 min | **Kata:** one Architecture Center reference architecture. Design from the problem statement, then compare |\n| Fortnightly, 30 min | Walk one [journey](02-end-to-end-journeys.md) aloud, then write one for a system at work |\n| Monthly, 1 h | One PCA case study with a twist, or write a case study of a real work system |\n| Every real design at work | The [60-second checklist](01-how-to-architect.md#10-a-60-second-mental-checklist-memorise-this) + the knock-on map before the review |\n"}]};
const DAY = 86400000;

const BOX_DAYS = [0, 1, 3, 7, 16, 35];
const KEY = "gcp-field-atlas-v1";

const byId = Object.fromEntries(DATA.concepts.map(c => [c.id, c]));

const termIndex = new Map(DATA.concepts.map(c => [c.term.toLowerCase(), c.id]));

let P = freshProgress();
try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && o.v === 1) P = Object.assign(freshProgress(), o); } } catch (e) {}

const UI = { tab: "atlas", domain: DATA.domains[0].id, tier: "all", status: "all", q: "", open: {},

function md(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:]|$)/g, "$1<em>$2</em>");
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function relatedId(name) {
  const k = name.toLowerCase();
  if (termIndex.has(k)) return termIndex.get(k);
  for (const [t, id] of termIndex) if (t.startsWith(k) || k.startsWith(t)) return id;
  for (const [t, id] of termIndex) if (t.includes(k)) return id;

}

/* ---------- persistence: browser storage now, account storage when the viewer provides it ---------- */
let dbRef = null, writing = false, pending = false, saveTimer = null;
function setSync(t) { $("#sync").textContent = t; }
function touch() {
  P.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  if (dbRef) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); }
}
async function flush() {
  if (!dbRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(P))); setSync("progress: saved to your account"); }
  catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbRef = null; setSync("progress: this browser"); }
    else setSync("progress: will retry saving");
  } finally { writing = false; if (pending) { pending = false; flush(); } }
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.v === 1 && (remote.updated || 0) > (P.updated || 0)) {
      P = Object.assign(freshProgress(), JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
      render();
    }
    dbRef = ref;
    setSync("progress: saved to your account");
    if (!remote || (P.updated || 0) > (remote.updated || 0)) { if (P.updated) flush(); }
  } catch (e) { /* stay on browser storage */ }
}

/* ---------- Atlas ---------- */
function domainStats(did) {

}

  if (UI.status === "known" && !(r >= 2)) return false;
  if (UI.q) {

}

      ${c.how ? `<p><span class="lbl">How it works</span>${md(c.how)}</p>` : ""}
      ${c.gcp ? `<p><span class="lbl">On GCP</span>${md(c.gcp)}</p>` : ""}
      ${c.why ? `<p><span class="lbl">Why it matters</span>${md(c.why)}</p>` : ""}
      ${c.watch ? `<p class="watch"><span class="lbl">Watch out</span>${md(c.watch)}</p>` : ""}
      ${rel ? `<div><span class="lbl">Related</span><div class="related">${rel}</div></div>` : ""}
    </div>` : ""}
    <div class="rate" role="group" aria-label="How well do you know ${esc(c.term)}?">
      ${RATINGS.map((t, i) => `<button data-rate="${c.id}" data-v="${i}" aria-pressed="${r === i}">${t}</button>`).join("")}
    </div>
  </article>`;
}
function viewAtlas() {
  const d = domainById[UI.domain];
  const list = DATA.concepts.filter(conceptMatches);
  const doms = DATA.domains.map(x => { const s = domainStats(x.id); return `<button class="dom" data-dom="${x.id}" aria-current="${x.id === UI.domain && !UI.q}">
      <span class="n">${x.num}</span><span class="t">${esc(x.title)}</span>
      <span class="bar" title="${s.known} of ${s.total} you can explain"><span style="width:${pct(s.known, s.total)}%"></span></span></button>`; }).join("");
  const chips = (name, vals) => vals.map(([v, t]) => `<button class="chip" data-f="${name}" data-v="${v}" aria-pressed="${UI[name] === v}">${t}</button>`).join("");
  return `<div class="atlas">
    <nav class="domains" aria-label="Domains">${doms}</nav>
    <section>
      <select class="domselect" id="domselect" aria-label="Domain">${DATA.domains.map(x => `<option value="${x.id}" ${x.id === UI.domain ? "selected" : ""}>${x.num} · ${esc(x.title)}</option>`).join("")}</select>
      ${UI.q ? `<h2>Search: “${esc(UI.q)}”</h2><p class="lede">${list.length} matching concepts across all domains.</p>`
        : `<div class="eyebrow">Domain ${d.num} of ${DATA.domains.length}</div><h2>${esc(d.title)}</h2><p class="lede dom-intro">${md(d.intro)}</p>`}
      <div class="filters">
        <input type="search" id="q" placeholder="Search all ${DATA.concepts.length} concepts" value="${esc(UI.q)}" aria-label="Search concepts">
        <div class="row">${chips("tier", [["all", "All tiers"], ["core", "Core"], ["working", "Working"], ["aware", "Aware"]])}</div>
        <div class="row">${chips("status", [["all", "Any rating"], ["unrated", "Unrated"], ["gaps", "My gaps"], ["known", "Known"]])}</div>
      </div>

}

/* ---------- Flashcards (Leitner-style spaced repetition) ---------- */
function deckConcepts() {
  return DATA.concepts.filter(c => (UI.deckDomain === "all" || c.domain === UI.deckDomain)
    && (UI.deckTier === "all" || c.tier === UI.deckTier || (UI.deckTier === "core+working" && c.tier !== "aware"))
    && (!UI.deckGaps || rating(c.id) === 0 || rating(c.id) === 1));
}
function buildQueue() {
  const now = Date.now(), cs = deckConcepts();
  const due = cs.filter(c => P.srs[c.id] && P.srs[c.id].due <= now).sort((a, b) => P.srs[a.id].due - P.srs[b.id].due);
  const fresh = cs.filter(c => !P.srs[c.id]).slice(0, 15);
  UI.queue = due.concat(fresh).map(c => c.id); UI.qi = 0; UI.flipped = false; UI.done = 0;
}
function gradeCard(id, g) {
  const s = P.srs[id] || { box: 0, due: 0 }, now = Date.now();
  let box = s.box, due;
  if (g === "again") { box = 1; due = now + 10 * 60000; UI.queue.push(id); }
  else if (g === "hard") { box = Math.max(1, box); due = now + DAY; }
  else if (g === "good") { box = Math.min(5, box + 1); due = now + BOX_DAYS[box] * DAY; }
  else { box = Math.min(5, box + 2); due = now + Math.round(BOX_DAYS[box] * 1.5) * DAY; }
  P.srs[id] = { box, due };
  UI.qi++; UI.done++; UI.flipped = false;
  touch(); render();
}
function viewCards() {
  if (!UI.queue) buildQueue();
  const cs = deckConcepts(), now = Date.now();
  const dueN = cs.filter(c => P.srs[c.id] && P.srs[c.id].due <= now).length;
  const newN = cs.filter(c => !P.srs[c.id]).length;
  const learned = cs.filter(c => P.srs[c.id] && P.srs[c.id].box >= 3).length;
  const id = UI.queue[UI.qi], c = id && byId[id];
  const opt = (v, t, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${t}</option>`;
  const card = c ? `<div class="panel flash">
      <div class="row"><span class="eyebrow">${esc(domainById[c.domain].title)}</span><span class="tier ${c.tier}">${c.tier}</span><span class="muted" style="margin-left:auto;font-size:.85rem">${UI.qi + 1} of ${UI.queue.length}</span></div>
      <div class="term">${esc(c.term)}</div>
      ${UI.flipped ? `<div class="detail" style="margin:0">
          <p><span class="lbl">What</span>${md(c.what)}</p>
          ${c.how ? `<p><span class="lbl">How it works</span>${md(c.how)}</p>` : ""}
          ${c.gcp ? `<p><span class="lbl">On GCP</span>${md(c.gcp)}</p>` : ""}
          ${c.watch ? `<p class="watch"><span class="lbl">Watch out</span>${md(c.watch)}</p>` : ""}
        </div>
        <div class="grades">
          <button class="again" data-grade="again">Again<small>10 min</small></button>
          <button data-grade="hard">Hard<small>1 day</small></button>
          <button class="good" data-grade="good">Good<small>${BOX_DAYS[Math.min(5, ((P.srs[c.id] || {}).box || 0) + 1)]} days</small></button>
          <button class="easy" data-grade="easy">Easy<small>${Math.round(BOX_DAYS[Math.min(5, ((P.srs[c.id] || {}).box || 0) + 2)] * 1.5)} days</small></button>
        </div>`
      : `<p class="prompt">Say what it is, how it works, and where it shows up on GCP. Then reveal and grade yourself.</p>
         <div style="margin-top:auto"><button class="btn primary" id="flip">Reveal answer</button></div>`}
    </div>`
    : `<div class="panel empty"><h3>${UI.done ? `Session done: ${UI.done} cards reviewed.` : "Nothing due in this deck."}</h3>
       <p class="muted">${newN ? `${newN} new cards remain in this deck. Start another session to learn 15 more.` : "Change the deck filters to study more, or come back when cards fall due."}</p>
       <button class="btn primary" id="newsession">Start a session</button></div>`;
  return `<h2>Flashcards</h2><p class="lede">Spaced repetition: cards you know come back less often, and the ones you miss come back sooner. Ten minutes a day is enough.</p>
  <div class="deck">${card}
    <aside class="panel side">
      <h3>Deck</h3>
      <label class="eyebrow" for="dd">Domain</label>
      <select id="dd">${opt("all", "All domains", UI.deckDomain)}${DATA.domains.map(d => opt(d.id, d.num + " · " + esc(d.title), UI.deckDomain)).join("")}</select>
      <label class="eyebrow" for="dt">Tiers</label>
      <select id="dt">${opt("core", "Core only", UI.deckTier)}${opt("core+working", "Core + working", UI.deckTier)}${opt("all", "Everything", UI.deckTier)}</select>
      <label class="row" style="gap:6px"><input type="checkbox" id="dg" ${UI.deckGaps ? "checked" : ""}> Only concepts I rated as gaps</label>
      <div class="stat"><span>Due now</span><strong>${dueN}</strong></div>
      <div class="stat"><span>New</span><strong>${newN}</strong></div>
      <div class="stat"><span>Learned (box 3+)</span><strong>${learned} / ${cs.length}</strong></div>
      <button class="btn" id="newsession2">Restart session with these settings</button>
    </aside></div>`;
}

/* ---------- Diagrams ---------- */
const COLW = 212, ROWH = 116, NW = 168, NH = 64, PAD = 16;
function wrapLabel(s, max) {
  const words = s.split(" "), lines = []; let cur = "";
  for (const w of words) { if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}
function clip(ax, ay, bx, by) { // point where segment from rect center a to b leaves rect a
  const dx = bx - ax, dy = by - ay, hw = NW / 2 + 3, hh = NH / 2 + 3;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [ax + dx * t, ay + dy * t];
}
function drawDiagram(nodes, edges, o) {

function mdDoc(src) {

    const hm = l.match(/^(#{1,4})\s+(.*)$/);
    if (hm) { const lv = Math.min(4, hm[1].length + 1); out.push(`<h${lv}>${inlineMd(hm[2])}</h${lv}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(l)) {
      const rows = []; while (i < lines.length && isTable(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      out.push(`<div class="table-wrap"><table><thead><tr>${cells(body[0]).map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inlineMd(buf.join(" "))}</blockquote>`); continue; }
    if (/^(\s*[-*]|\s*\d+\.)\s+/.test(l)) {

      while (i < lines.length && /^(\s*[-*]|\s*\d+\.)\s+/.test(lines[i])) {

        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^(\s*[-*]|\s*\d+\.)\s+/.test(lines[i])) it += " " + lines[i++].trim();
        items.push(`<li>${inlineMd(it)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`); continue;
    }

}

    <div class="arch-list">${DATA.journeys.map(j => { const a = DATA.architectures.find(x => x.id === j.arch); return `<button class="arch-card" data-ax="journey" data-arg="${j.id}">
      <span class="lvl" style="color:var(--accent)">${j.steps.length} steps${P.journeys[j.id] ? " · done" : ""}</span><strong class="ac-title">${esc(j.title)}</strong><p>${esc(j.lesson)}</p><span class="muted" style="font-size:.85rem">On: ${esc(a.title)}</span></button>`; }).join("")}</div>`;
}
function axJourney() {
  const j = DATA.journeys.find(x => x.id === AX.id), a = DATA.architectures.find(x => x.id === j.arch);
  const st = j.steps[AX.step], hi = new Set(st.nodes), last = AX.step === j.steps.length - 1;
  return `<div class="row" style="margin-bottom:12px"><button class="btn small" data-ax="journeys">All journeys</button></div>
    <h2>${esc(j.title)}</h2><p class="lede" style="margin-bottom:10px">${esc(j.lesson)}</p>
    <figure style="margin:0"><div class="canvas">${drawDiagram(a.nodes, a.edges, { title: a.title, hi })}</div></figure>
    <div class="panel jstep">
      <div class="row"><span class="eyebrow">Step ${AX.step + 1} of ${j.steps.length}</span>
        <span class="dots">${j.steps.map((_, k) => `<button class="dot ${k === AX.step ? "cur" : k < AX.step ? "past" : ""}" data-ax="jgo" data-arg="${k}" aria-label="Step ${k + 1}"></button>`).join("")}</span></div>
      <p class="jtext">${md(st.text)}</p>
      <div class="row"><button class="btn" data-ax="jgo" data-arg="${AX.step - 1}" ${AX.step ? "" : "disabled"}>Previous</button>
        ${last ? `<button class="btn primary" data-ax="jdone">Finish journey</button>` : `<button class="btn primary" data-ax="jgo" data-arg="${AX.step + 1}">Next step</button>`}
        <span class="muted" style="font-size:.85rem">Arrow keys also work</span></div>
    </div>`;
}
function labScore(l) { let s = 0; l.steps.forEach((st, k) => { const p = AX.picks[k]; if (p !== undefined) s += GRADE[st.options[p].grade].s; }); return s; }
function axLabList() {
  return `<div class="row" style="margin-bottom:12px"><button class="btn small" data-ax="home">Architect home</button></div>
    <h2>Design lab</h2><p class="lede">Read the brief and requirements, then make each decision before looking at the feedback. The diagram fills in as you choose. Twists change the requirements, as real projects do.</p>
    <div class="arch-list">${DATA.labs.map(l => { const s = P.labs[l.id]; return `<button class="arch-card" data-ax="lab" data-arg="${l.id}">
      <span class="lvl" style="color:var(--accent)">${l.steps.length} decisions${s ? ` · best ${s.best}%` : ""}</span><strong class="ac-title">${esc(l.title)}</strong><p>${esc(l.brief)}</p></button>`; }).join("")}</div>`;
}
function axLab() {
  const l = DATA.labs.find(x => x.id === AX.id);
  const done = Object.keys(AX.picks).length === l.steps.length && AX.step >= l.steps.length;
  const slotLabel = n => {
    if (n.cat === "fixed" || n.label !== "?") return n.label;
    let lab = null;
    l.steps.forEach((st, k) => { if (st.slot === n.id) { if (AX.showRef) { if (!lab || st.kind === "step") lab = (st.options.find(o => o.grade === "best") || {}).label; } else if (AX.picks[k] !== undefined) lab = st.options[AX.picks[k]].label; } });
    return lab;
  };
  const cur = !done && l.steps[AX.step];
  const diag = drawDiagram(l.slots, l.edges, { title: l.title,
    hidden: n => !slotLabel(n), label: n => slotLabel(n) || "?",
    cls: n => [!slotLabel(n) ? "slot" : "", cur && cur.slot === n.id ? "sel" : ""].join(" ") });
  let panel;
  if (!done) {
    const st = l.steps[AX.step], picked = AX.picks[AX.step];
    panel = `<div class="panel quiz ${st.kind === "twist" ? "twist" : ""}">
      <div class="row"><span class="eyebrow">${st.kind === "twist" ? "Requirement change" : "Decision"} ${AX.step + 1} of ${l.steps.length}</span><span class="muted" style="margin-left:auto;font-size:.85rem">Score so far ${labScore(l)} / ${2 * Object.keys(AX.picks).length}</span></div>
      <h3>${esc(st.title)}</h3><p style="margin:0">${md(st.question)}</p>
      <div class="opts lab-opts">${AX.optOrder[AX.step].map(k => { const o = st.options[k];
        if (picked === undefined) return `<button class="opt" data-ax="pick" data-arg="${k}">${esc(o.label)}</button>`;
        const g = GRADE[o.grade];
        return `<div class="fb ${o.grade} ${k === picked ? "mine" : ""}"><div class="row"><strong>${esc(o.label)}</strong><span class="gchip ${o.grade}">${g.t}</span>${k === picked ? `<span class="tier" style="color:var(--ink)">your choice</span>` : ""}</div><p>${md(o.feedback)}</p></div>`;
      }).join("")}</div>
      ${picked !== undefined ? `<div><button class="btn primary" data-ax="lnext">${AX.step + 1 < l.steps.length ? "Next decision" : "See the summary"}</button></div>` : ""}
    </div>`;
  } else {
    const sc = labScore(l), max = 2 * l.steps.length, p = pct(sc, max);
    panel = `<div class="panel quiz"><div class="eyebrow">Summary</div><h3>${sc} / ${max} (${p}%)</h3>
      <p class="muted" style="margin:0">${p >= 85 ? "Strong design reasoning. Try the twists in your head with different numbers." : p >= 60 ? "A solid base. Read the feedback on the decisions marked acceptable or weak, then replay." : "Read the feedback below and the related atlas concepts, then replay this lab."}</p>
      <div class="table-wrap"><table><thead><tr><th>Decision</th><th>Your choice</th><th>Rating</th><th>Strongest option</th></tr></thead><tbody>
      ${l.steps.map((st, k) => { const o = st.options[AX.picks[k]], b = st.options.find(x => x.grade === "best"); return `<tr><td>${st.kind === "twist" ? "Twist: " : ""}${esc(st.title)}</td><td>${esc(o.label)}</td><td><span class="gchip ${o.grade}">${GRADE[o.grade].t}</span></td><td>${o.grade === "best" ? "–" : esc(b.label)}</td></tr>`; }).join("")}
      </tbody></table></div>
      <div class="row"><button class="btn" data-ax="lref">${AX.showRef ? "Show my design" : "Show the reference design"}</button><button class="btn" data-ax="lab" data-arg="${l.id}">Replay this lab</button><button class="btn primary" data-ax="labs">More labs</button></div></div>`;
  }
  return `<div class="row" style="margin-bottom:12px"><button class="btn small" data-ax="labs">All labs</button></div>
    <h2>${esc(l.title)}</h2>
    <div class="brief"><p style="margin:0">${md(l.brief)}</p><ul>${l.requirements.map(r => `<li>${md(r)}</li>`).join("")}</ul></div>
    <figure style="margin:0"><div class="canvas">${diag}</div><figcaption class="muted" style="font-size:.85rem;margin-top:6px">${done && AX.showRef ? "Reference design: the strongest option for each decision." : "Dashed boxes are decisions you haven't made yet. The highlighted box is the current decision."}</figcaption></figure>
    ${panel}`;
}
function axReviewList() {
  return `<div class="row" style="margin-bottom:12px"><button class="btn small" data-ax="home">Architect home</button></div>
    <h2>Design reviews</h2><p class="lede">You're on the architecture review board. Each proposal mixes real problems with choices that are fine. Flag only the real ones, which is harder than it sounds.</p>
    <div class="arch-list">${DATA.reviews.map(r => { const s = P.reviews[r.id]; return `<button class="arch-card" data-ax="review" data-arg="${r.id}">
      <span class="lvl" style="color:var(--c-security)">${r.issues.length} statements${s ? ` · best ${s.best}%` : ""}</span><strong class="ac-title">${esc(r.title)}</strong><p>${esc(r.design)}</p></button>`; }).join("")}</div>`;
}
function axReview() {
  const r = DATA.reviews.find(x => x.id === AX.id);
  if (!AX.order) AX.order = shuffle(r.issues.map((_, k) => k));
  const items = AX.order.map(k => {
    const it = r.issues[k], on = !!AX.checks[k];
    if (!AX.submitted) return `<label class="chk"><input type="checkbox" data-ax="chk" data-arg="${k}" ${on ? "checked" : ""}><span>${md(it.text)}</span></label>`;
    const ok = on === it.real;
    const verdict = it.real ? (on ? "Correctly flagged" : "Missed issue") : (on ? "False alarm: this is fine" : "Correctly left alone");
    return `<div class="fb ${ok ? "best" : "poor"}"><div class="row"><span class="gchip ${ok ? "best" : "poor"}">${verdict}</span></div><p><strong>${md(it.text)}</strong></p><p>${md(it.explain)}</p></div>`;
  }).join("");
  const right = r.issues.filter((it, k) => !!AX.checks[k] === it.real).length;
  return `<div class="row" style="margin-bottom:12px"><button class="btn small" data-ax="reviews">All reviews</button></div>
    <h2>${esc(r.title)}</h2><div class="brief"><span class="eyebrow">The proposal</span><p style="margin:6px 0 0">${md(r.design)}</p></div>
    <figure style="margin:0"><div class="canvas">${drawDiagram(r.nodes, r.edges, { title: r.title })}</div></figure>
    <ol class="panel flows">${r.edges.map((e, i) => `<li><b>${i + 1}</b><span>${esc(r.nodes.find(n => n.id === e.from).label)} → ${esc(r.nodes.find(n => n.id === e.to).label)} <span class="via">· ${esc(e.label)}</span></span></li>`).join("")}</ol>
    <div class="panel quiz"><div class="eyebrow">${AX.submitted ? `Result: ${right} of ${r.issues.length} judged correctly` : "Tick every statement that is a real problem you'd raise in review"}</div>
      <div class="review-items">${items}</div>
      <div class="row">${AX.submitted ? `<button class="btn" data-ax="review" data-arg="${r.id}">Try again</button><button class="btn primary" data-ax="reviews">More reviews</button>` : `<button class="btn primary" data-ax="rsubmit">Submit review</button>`}</div></div>`;
}
function viewArchitect() {
  if (AX.view === "guide") return axGuide();
  if (AX.view === "journeys") return axJourneyList();
  if (AX.view === "journey") return axJourney();
  if (AX.view === "labs") return axLabList();
  if (AX.view === "lab") return axLab();
  if (AX.view === "reviews") return axReviewList();
  if (AX.view === "review") return axReview();
  return axHome();
}
function axAction(act, arg) {
  if (act === "home" || act === "journeys" || act === "labs" || act === "reviews") { AX.view = act; }
  else if (act === "guide") { AX.view = "guide"; AX.id = arg || (DATA.guides[0] && DATA.guides[0].id); }
  else if (act === "journey") { AX.view = "journey"; AX.id = arg; AX.step = 0; }
  else if (act === "jgo") { const j = DATA.journeys.find(x => x.id === AX.id); AX.step = Math.max(0, Math.min(j.steps.length - 1, +arg)); render(); return; }
  else if (act === "jdone") { P.journeys[AX.id] = true; touch(); AX.view = "journeys"; }
  else if (act === "lab") { AX.view = "lab"; AX.id = arg; AX.step = 0; AX.picks = {}; AX.showRef = false; AX.optOrder = DATA.labs.find(x => x.id === arg).steps.map(st => shuffle(st.options.map((_, k) => k))); }
  else if (act === "pick") { AX.picks[AX.step] = +arg; render(); return; }
  else if (act === "lnext") {
    AX.step++;
    const l = DATA.labs.find(x => x.id === AX.id);
    if (AX.step >= l.steps.length) { const p = pct(labScore(l), 2 * l.steps.length); const prev = P.labs[l.id] || { best: 0, attempts: 0 }; P.labs[l.id] = { best: Math.max(prev.best, p), attempts: prev.attempts + 1 }; touch(); }
    render(); return;
  }
  else if (act === "lref") { AX.showRef = !AX.showRef; render(); return; }
  else if (act === "review") { AX.view = "review"; AX.id = arg; AX.checks = {}; AX.submitted = false; AX.order = null; }
  else if (act === "rsubmit") {
    const r = DATA.reviews.find(x => x.id === AX.id); AX.submitted = true;
    const p = pct(r.issues.filter((it, k) => !!AX.checks[k] === it.real).length, r.issues.length);
    const prev = P.reviews[r.id] || { best: 0, attempts: 0 }; P.reviews[r.id] = { best: Math.max(prev.best, p), attempts: prev.attempts + 1 }; touch();
    render(); return;
  }
  render(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ax]"); if (!t || t.tagName === "INPUT") return;
  axAction(t.dataset.ax, t.dataset.arg);
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.ax === "chk") AX.checks[e.target.dataset.arg] = e.target.checked; });
document.addEventListener("keydown", e => {
  if (UI.tab !== "architect" || AX.view !== "journey" || e.target.closest("input, select, textarea")) return;
  if (e.key === "ArrowRight") axAction("jgo", AX.step + 1); else if (e.key === "ArrowLeft") axAction("jgo", AX.step - 1);
});

/* ---------- events ---------- */
function jump(id) {
  const c = byId[id]; if (!c) return;
  UI.tab = "atlas"; UI.domain = c.domain; UI.q = ""; UI.tier = "all"; UI.status = "all"; UI.open[id] = true;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === "atlas")));
  render();
  const el = document.getElementById("c-" + id); if (el) el.scrollIntoView({ block: "start" });
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-node]"); if (!t) return;
  const d = t.dataset;
  if (d.dom) { UI.domain = d.dom; UI.q = ""; render(); window.scrollTo(0, 0); }
  else if (d.domGo) { UI.domain = d.domGo; UI.q = ""; go("atlas"); }
  else if (d.f) { UI[d.f] = d.v; render(); }
  else if (d.toggle) { UI.open[d.toggle] = !UI.open[d.toggle]; render(); }
  else if (d.rate) { const v = +d.v; if (P.ratings[d.rate] === v) delete P.ratings[d.rate]; else P.ratings[d.rate] = v; touch(); render(); }
  else if (d.jump) jump(d.jump);
  else if (t.id === "flip") { UI.flipped = true; render(); }
  else if (d.grade) gradeCard(UI.queue[UI.qi], d.grade);
  else if (t.id === "newsession" || t.id === "newsession2") { buildQueue(); render(); }
  else if (d.arch) { UI.arch = d.arch; UI.archAns = {}; UI.archSel = null; UI.optCache = {}; UI.lastPick = null; render(); window.scrollTo(0, 0); }
  else if (t.id === "backarch") { UI.arch = null; render(); }
  else if (d.amode) { UI.archMode = d.amode; render(); }
  else if (d.node && UI.tab === "diagrams") { UI.archSel = d.node; render(); const q = $(".quiz"); if (q && window.innerWidth < 860) q.scrollIntoView({ block: "nearest" }); }
  else if (d.pick !== undefined) {
    const a = DATA.architectures.find(x => x.id === UI.arch), n = a.nodes.find(x => x.id === UI.archSel);
    UI.archAns[n.id] = d.pick === n.label ? "ok" : "miss"; UI.lastPick = d.pick; recordArch(a); render();
  }
  else if (t.id === "revealall") { const a = DATA.architectures.find(x => x.id === UI.arch); a.nodes.forEach(n => { if (n.cat !== "fixed" && !UI.archAns[n.id]) UI.archAns[n.id] = "miss"; }); recordArch(a); render(); }
  else if (t.id === "resetarch") { UI.archAns = {}; UI.archSel = null; UI.optCache = {}; render(); }
  else if (d.ans !== undefined) {
    const q = DATA.scenarios.find(x => x.id === UI.scenOrder[UI.scenIdx]); const i = +d.ans;
    UI.scenPicked = i; const prev = P.scen[q.id] || { n: 0, right: 0 };
    P.scen[q.id] = { n: prev.n + 1, right: prev.right + (q.options[i].correct ? 1 : 0), last: q.options[i].correct }; touch(); render();
  }
  else if (t.id === "nextq") { UI.scenIdx++; UI.scenPicked = null; render(); }
  else if (t.id === "scenagain") { UI.scenOrder = null; render(); }
  else if (t.id === "askreset") { UI.confirmReset = true; render(); }
  else if (t.id === "noreset") { UI.confirmReset = false; render(); }
  else if (t.id === "doreset") { P = freshProgress(); UI.confirmReset = false; UI.queue = null; touch(); render(); }
});
document.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest("[data-node]");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  if (UI.tab === "cards" && !e.target.closest("input, select")) {
    if (e.key === " " && !UI.flipped && UI.queue && UI.queue[UI.qi]) { e.preventDefault(); UI.flipped = true; render(); }
    else if (UI.flipped && ["1", "2", "3", "4"].includes(e.key)) gradeCard(UI.queue[UI.qi], ["again", "hard", "good", "easy"][+e.key - 1]);
  }
});
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { UI.q = v.trim(); render(); const i = $("#q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 200); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "domselect") { UI.domain = e.target.value; UI.q = ""; render(); }
  else if (id === "dd") { UI.deckDomain = e.target.value; buildQueue(); render(); }
  else if (id === "dt") { UI.deckTier = e.target.value; buildQueue(); render(); }
  else if (id === "dg") { UI.deckGaps = e.target.checked; buildQueue(); render(); }
  else if (id === "hard") { UI.archHard = e.target.checked; render(); }
  else if (id === "sd") { UI.scenDomain = e.target.value; UI.scenOrder = null; render(); }
});

const start = (location.hash || "").slice(1);
go(["architect", "atlas", "cards", "diagrams", "scenarios", "progress"].includes(start) ? start : "architect");
if (P.updated) setSync("progress: this browser");
connect();
</script>
