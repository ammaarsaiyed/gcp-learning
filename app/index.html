GDPR"], "what": "**PRA** (Prudential Regulation Authority, part of the Bank of England): safety and soundness of banks (capital, liquidity, operational resilience, outsourcing, model risk). **FCA** (Financial Conduct Authority): conduct and consumer outcomes, market integrity (Consumer Duty, fair treatment, financial crime systems). Large banks are **dual-regulated**. **Bank of England** also oversees financial market infrastructures and, with PRA and FCA, critical third parties. **ICO** (Information Commissioner's Office): data protection (UK GDPR). **PSR** (Payment Systems Regulator): payments.", "watch": "In design reviews, \"is this material outsourcing?\", \"which important business service does it support?\", \"is this a model under our MRM policy?\" and \"have we done a DPIA?\" are the questions that most often stop a launch."}, {"id": "uk-banking-regulation-and-risk--three-lines-of-defence", "domain": "uk-banking-regulation-and-risk", "term": "Three lines of defence", "tier": "working", "related": ["Model risk management", "Separation of duties"], "what": "The standard risk-governance model. **1st line:** the business and technology teams that own and manage risks (you, building systems with controls). **2nd line:** independent risk and compliance functions that set policy and challenge the first line (operational risk, model risk, information security risk, data protection). **3rd line:** internal audit, giving independent assurance.", "why": "Your designs are reviewed by the 2nd line and audited by the 3rd. Evidence (logs, tests, approvals, IaC history) is how controls get proven."}, {"id": "uk-banking-regulation-and-risk--operational-resilience-pra-ss1-21-fca-ps21-3", "domain": "uk-banking-regulation-and-risk", "term": "Operational resilience (PRA SS1/21, FCA PS21/3)", "tier": "core", "related": ["RTO and RPO", "Disaster recovery", "Chaos engineering"], "what": "The UK framework requiring firms to identify **important business services** (IBS: services whose disruption could harm customers or market integrity, or threaten the firm's safety; for example making payments, accessing accounts), set an **impact tolerance** for each (the maximum tolerable disruption, usually a time limit), **map** the people, processes, technology, facilities and third parties behind each service, and **test** that they can stay within tolerance under **severe but plausible** scenarios. Firms had to be able to remain within tolerances by **31 March 2025**, and now must sustain and evidence it.", "how": "For engineers this means: know which IBS your system supports, design RTO and RPO and DR so the *end-to-end service* stays inside its impact tolerance, include cloud regions, zones, providers and SaaS dependencies in the mapping, and run and document DR and failover tests.", "watch": "Impact tolerances are about **the business service end to end**, not one component's SLA. A 99.99% database doesn't help if the identity provider is a single point of failure."}, {"id": "uk-banking-regulation-and-risk--outsourcing-and-third-party-risk-pra-ss2-21", "domain": "uk-banking-regulation-and-risk", "term": "Outsourcing and third-party risk (PRA SS2/21)", "tier": "core", "related": ["Critical third parties", "Exit strategy", "Shared responsibility model"], "what": "PRA expectations for outsourcing and third-party arrangements, explicitly including cloud. Key elements: **materiality assessment**, **due diligence**, contractual requirements (**access, audit and information rights** for the firm and the regulator, sub-outsourcing controls, data security and location), **data security** (classification, encryption, key management, location), **business continuity**, **concentration risk**, and **exit planning**: documented plans for both a planned (non-stressed) exit and a **stressed exit** (the provider fails or terminates suddenly), with testing where appropriate. Firms must notify the PRA of material outsourcing.", "gcp": "The controls that answer it: data location (org policies), CMEK/EKM, Access Transparency and Access Approval, audit logs, Google's audit reports and contractual financial-services addenda, multi-region DR, and portability through containers, open formats and Terraform."}, {"id": "uk-banking-regulation-and-risk--critical-third-parties-ctp-regime", "domain": "uk-banking-regulation-and-risk", "term": "Critical Third Parties (CTP) regime", "tier": "working", "related": ["Outsourcing (SS2/21)", "Concentration risk"], "what": "Under the Financial Services and Markets Act 2023, **HM Treasury** can designate third parties (for example major cloud providers) whose failure could threaten UK financial stability as **critical third parties**. The regulators (PRA, FCA, Bank of England) then oversee them *directly* against fundamental rules and operational risk and resilience requirements (rules in force from January 2025).", "watch": "Designation doesn't remove a firm's own responsibility for managing its third-party risk. You still need your own resilience and exit plans."}, {"id": "uk-banking-regulation-and-risk--concentration-risk-and-cloud-exit-strategy", "domain": "uk-banking-regulation-and-risk", "term": "Concentration risk and cloud exit strategy", "tier": "working", "related": ["Outsourcing (SS2/21)", "Multicloud", "Containers"], "what": "**Concentration risk:** too much critical activity relying on one provider (at firm level and across the sector). **Exit strategy:** a credible, tested plan to move services away from a provider, or bring them back in-house, within a reasonable time, in both stressed and planned scenarios.", "how": "Engineering levers that make exit credible: containers and Kubernetes, open data formats (Parquet, Iceberg, Avro), open-source-compatible databases (PostgreSQL), infrastructure as code, abstraction of model providers behind a gateway (for AI: being able to switch between Gemini, Claude and open models), documented data export paths, and avoiding unnecessary proprietary dependencies in the *most critical* services.", "watch": "Regulators want a *proportionate and credible* plan, not necessarily active multicloud. Over-engineering for portability has its own cost and risk."}, {"id": "uk-banking-regulation-and-risk--uk-gdpr-and-the-data-protection-act-2018", "domain": "uk-banking-regulation-and-risk", "term": "UK GDPR and the Data Protection Act 2018", "tier": "core", "related": ["Data residency", "Sensitive Data Protection", "DPIA"], "what": "The UK's data protection law. Core principles: lawfulness, fairness and transparency, **purpose limitation**, **data minimisation**, accuracy, **storage limitation**, integrity and confidentiality (security), and **accountability**. Data subject rights: access, rectification, **erasure**, restriction, portability, objection, and rights around **automated decision-making** (UK GDPR Article 22, as amended by the Data (Use and Access) Act 2025; check current rules). **International transfers** outside the UK need adequacy regulations or safeguards (for example the UK IDTA or the Addendum to EU SCCs). **Breach notification** to the ICO within **72 hours** where required.", "how": "Engineering implications: know where personal data lives (including logs, prompts, embeddings, agent memory and backups), minimise what goes into models, enforce retention, support deletion (crypto-shredding helps with backups), control transfers (region choice, global AI endpoints), and keep processing records."}, {"id": "uk-banking-regulation-and-risk--data-protection-impact-assessment-dpia", "domain": "uk-banking-regulation-and-risk", "term": "Data Protection Impact Assessment (DPIA)", "tier": "working", "related": ["UK GDPR", "Responsible AI"], "what": "A required assessment before processing that's likely to be high-risk to individuals: new technologies, large-scale profiling, automated decisions with significant effects. **Most customer-data AI and GenAI use cases need one.** It records purposes, necessity, risks and mitigations, and the data protection officer reviews it."}, {"id": "uk-banking-regulation-and-risk--model-risk-management-pra-ss1-23", "domain": "uk-banking-regulation-and-risk", "term": "Model risk management (PRA SS1/23)", "tier": "core", "related": ["Model registry", "LLM evaluation", "Explainability"], "what": "The PRA's **Model Risk Management principles for banks** (in effect since May 2024) set expectations for identifying and managing model risk, in five principles: (1) **model identification and classification** (a firm-wide **model inventory** and risk **tiering**), (2) **governance** (board oversight, an accountable SMF, policies), (3) **model development, implementation and use** (data quality, testing, documentation), (4) **independent model validation** (including ongoing performance monitoring), (5) **model risk mitigants** (for example restrictions, overrides, post-model adjustments). It applies directly to banks with internal-model approval for regulatory capital, and is widely adopted as good practice by others. It explicitly covers AI and ML models and model complexity.", "how": "For GenAI and agents, expect: inventory entries for each use case (model + prompts + retrieval + tools as a system), tiering by impact, documented evaluation and validation evidence, monitoring of performance and drift, change control for prompt, model-version and tool changes, and fallback plans."}, {"id": "uk-banking-regulation-and-risk--fca-consumer-duty", "domain": "uk-banking-regulation-and-risk", "term": "FCA Consumer Duty", "tier": "working", "related": ["Responsible AI", "Explainability", "Human-in-the-loop"], "what": "FCA rules (from July 2023) requiring firms to **deliver good outcomes for retail customers**: products and services fit for purpose, fair price and value, **consumer understanding** (clear communications), **consumer support** (no unreasonable barriers), and attention to **vulnerable customers**. Firms must monitor and evidence outcomes.", "why": "Customer-facing AI (chatbots, decisions, personalized communications) must produce outcomes that are accurate, fair, understandable and easy to escalate to a human. Poor AI outcomes are a conduct risk."}, {"id": "uk-banking-regulation-and-risk--senior-managers-and-certification-regime-sm-cr", "domain": "uk-banking-regulation-and-risk", "term": "Senior Managers and Certification Regime (SM&CR)", "tier": "working", "related": ["Model risk management", "Three lines of defence"], "what": "Individual accountability: named **Senior Management Function** holders are personally responsible for areas of the business (including technology, operations and, in practice, AI use and model risk). That's why governance sign-off on cloud and AI systems is taken seriously and documented carefully."}, {"id": "uk-banking-regulation-and-risk--ai-regulation-landscape-uk-and-eu", "domain": "uk-banking-regulation-and-risk", "term": "AI regulation landscape (UK and EU)", "tier": "working", "related": ["Model risk management", "Consumer Duty", "Responsible AI"], "what": "**UK:** a principles-based, regulator-led approach (safety, transparency, fairness, accountability, contestability), applied through existing rules (Consumer Duty, SM&CR, SS1/23, UK GDPR, equality law). The FCA and the Bank of England run AI initiatives (for example supervised AI testing). **EU AI Act:** risk-based regulation with obligations phasing in. **Creditworthiness assessment and credit scoring of individuals is \"high-risk\"**. It matters for UK banks with EU operations or EU customers. Timelines have been subject to change, so check them.", "watch": "Bank internal AI policies often go further than law: approved-model lists, use-case risk tiering, mandatory evaluation, human oversight rules, bans on certain data in prompts."}, {"id": "uk-banking-regulation-and-risk--dora-eu-digital-operational-resilience-act", "domain": "uk-banking-regulation-and-risk", "term": "DORA (EU Digital Operational Resilience Act)", "tier": "aware", "related": ["Operational resilience", "Outsourcing"], "what": "EU regulation (applying from January 2025) on ICT risk management, incident reporting, resilience testing (including threat-led pen testing), and ICT third-party risk for **EU** financial entities. It affects UK groups with EU-regulated subsidiaries and is conceptually similar to the UK framework."}, {"id": "uk-banking-regulation-and-risk--pci-dss", "domain": "uk-banking-regulation-and-risk", "term": "PCI DSS", "tier": "working", "related": ["Tokenisation", "Network segmentation", "Cloud HSM"], "what": "The Payment Card Industry Data Security Standard (v4.x) for anyone storing, processing or transmitting cardholder data: network segmentation, encryption, key management, access control, logging and monitoring, vulnerability management, regular testing.", "how": "The biggest lever is **scope reduction**: tokenize card numbers early so most systems never see them, and isolate the cardholder data environment (separate projects, VPC-SC, strict firewalls). Google Cloud is a PCI DSS-validated provider for in-scope services, and you're responsible for your part."}, {"id": "uk-banking-regulation-and-risk--bcbs-239-risk-data-aggregation-and-reporting", "domain": "uk-banking-regulation-and-risk", "term": "BCBS 239 (risk data aggregation and reporting)", "tier": "aware", "related": ["Dataplex", "Data quality"], "what": "Basel Committee principles for risk data: accuracy, integrity, completeness, timeliness and adaptability of risk data aggregation and reporting, with strong data governance and architecture. In practice: lineage, data quality controls, reconciliation, and clear data ownership for regulatory reporting pipelines."}, {"id": "uk-banking-regulation-and-risk--record-keeping-audit-trails-and-retention", "domain": "uk-banking-regulation-and-risk", "term": "Record keeping, audit trails and retention", "tier": "working", "related": ["Cloud Audit Logs", "Bucket lock", "Log sinks"], "what": "Regulators expect firms to keep records (communications, transactions, decisions, system changes) for defined periods, often 5–7+ years depending on the rule, in a form that can't be altered undetected, and to retrieve them on request.", "gcp": "Locked log buckets and retention, Cloud Storage **bucket lock / retention policies** (WORM), BigQuery with controlled access, CMEK, centralized logging projects, IaC history in git, and Cloud Deploy and Cloud Build audit trails. For AI: retain prompts, responses, model versions and retrieved sources where they support decisions or customer communications (and balance that against data minimisation)."}, {"id": "uk-banking-regulation-and-risk--data-classification", "domain": "uk-banking-regulation-and-risk", "term": "Data classification", "tier": "working", "related": ["Sensitive Data Protection", "Organization Policy", "VPC Service Controls"], "what": "Labelling data by sensitivity (for example Public / Internal / Confidential / Highly Confidential or Restricted), with each class mapped to required controls: encryption and key type, location, access approval, logging, whether it may be used in AI prompts, whether it may leave the perimeter.", "gcp": "Implemented through project and dataset segregation, Sensitive Data Protection discovery, Dataplex and BigQuery policy tags, labels and tags, VPC-SC perimeters per classification, and org policies."}, {"id": "uk-banking-regulation-and-risk--customer-data-in-llm-prompts", "domain": "uk-banking-regulation-and-risk", "term": "Customer data in LLM prompts", "tier": "core", "related": ["Data governance for GenAI", "Sensitive Data Protection", "DPIA"], "what": "The practical question behind most bank GenAI reviews: \"what personal or confidential data reaches the model, where is it processed, is it stored, and who can see it?\"", "how": "A typical control set: an approved enterprise platform only (Agent Platform with the right terms), regional processing where required, VPC-SC + private connectivity, **PII minimisation and redaction** before prompting (Sensitive Data Protection, Model Armor), no customer data in model training without explicit approval, controlled prompt and response logging (with retention limits and access controls), a DPIA, model-risk inventory and evaluation, human review for customer-impacting outputs."}, {"id": "uk-banking-regulation-and-risk--fraud-aml-and-financial-crime-systems", "domain": "uk-banking-regulation-and-risk", "term": "Fraud, AML and financial crime systems", "tier": "aware", "related": ["Bigtable", "Dataflow", "Model monitoring"], "what": "High-volume, low-latency ML (transaction fraud scoring, mule detection, AML transaction monitoring, sanctions screening) with strict explainability, auditability and tuning governance. GenAI increasingly assists investigators (case summaries, SAR narrative drafting) with human review.", "gcp": "Streaming features (Pub/Sub → Dataflow → Bigtable or Feature Store), models served on endpoints, BigQuery for investigation analytics. Google also offers an **AML AI** product for transaction monitoring."}, {"id": "uk-banking-regulation-and-risk--open-banking-and-fapi", "domain": "uk-banking-regulation-and-risk", "term": "Open Banking and FAPI", "tier": "aware", "related": ["OAuth 2.0", "mTLS", "Apigee"], "what": "UK Open Banking (from the CMA order and PSD2) requires standardized, secure APIs letting authorized third parties access account data and initiate payments with customer consent. It uses the **FAPI** (Financial-grade API) security profile: OAuth 2.0 / OIDC hardened with **mTLS** or private-key JWT client authentication, signed request objects, and certificate-bound tokens.", "gcp": "Apigee (with mTLS on the load balancer and OAuth/FAPI policies) is a common platform for these APIs."}, {"id": "uk-banking-regulation-and-risk--cbest-and-threat-led-penetration-testing", "domain": "uk-banking-regulation-and-risk", "term": "CBEST and threat-led penetration testing", "tier": "aware", "related": ["Penetration testing", "Operational resilience"], "what": "The Bank of England's intelligence-led red-teaming framework for systemically important firms. Real-world threat actors' tactics are simulated against live production systems, which can include cloud environments and identities."}], "architectures": [{"id": "serverless-starter", "title": "Static site and API (serverless starter)", "level": "starter", "context": "A small internal web tool. A static frontend, a JSON API, a document database, a custom domain with HTTPS. Low, spiky traffic, so it should cost almost nothing when idle.", "nodes": [{"id": "users", "label": "Staff browsers", "cat": "fixed", "col": 0, "row": 1, "why": "The clients."}, {"id": "dns", "label": "Cloud DNS", "cat": "network", "col": 1, "row": 1, "why": "Authoritative DNS for the tool's domain, pointing at the load balancer's anycast IP."}, {"id": "lb", "label": "Global external Application Load Balancer", "cat": "network", "col": 2, "row": 1, "why": "One HTTPS front door with a managed certificate. A URL map sends `/api/*` to Cloud Run and everything else to the bucket."}, {"id": "cdn", "label": "Cloud CDN", "cat": "network", "col": 2, "row": 0, "why": "Caches the static assets at Google's edge, which cuts latency and egress."}, {"id": "bucket", "label": "Cloud Storage", "cat": "data", "col": 4, "row": 0, "why": "A backend bucket holding the built frontend (HTML/JS/CSS). Object storage is the cheapest way to serve static files."}, {"id": "run", "label": "Cloud Run", "cat": "compute", "col": 4, "row": 2, "why": "Runs the API container behind a serverless NEG. Scales to zero, so it's nearly free when idle."}, {"id": "db", "label": "Firestore", "cat": "data", "col": 6, "row": 2, "why": "A serverless document database with no capacity to manage, which suits a small app's JSON records."}], "edges": [{"from": "users", "to": "dns", "label": "resolve name"}, {"from": "users", "to": "lb", "label": "HTTPS"}, {"from": "lb", "to": "cdn", "label": "cache static"}, {"from": "cdn", "to": "bucket", "label": "backend bucket"}, {"from": "lb", "to": "run", "label": "/api/* (serverless NEG)"}, {"from": "run", "to": "db", "label": "client library + service account"}]}, {"id": "rag-policy-assistant", "title": "Internal policy assistant (RAG)", "level": "core", "context": "Colleagues ask questions about internal policies (around 20k PDFs) and get answers with citations. Staff only. Documents are Confidential. Answers must cite the policy section. New policy versions arrive daily.", "nodes": [{"id": "staff", "label": "Colleagues (managed devices)", "cat": "fixed", "col": 0, "row": 1, "why": "The users, signing in with corporate identity."}, {"id": "iap", "label": "Identity-Aware Proxy", "cat": "identity", "col": 1, "row": 1, "why": "Authenticates staff with the corporate IdP and checks IAM and device context before any request reaches the app. No VPN needed."}, {"id": "app", "label": "Cloud Run", "cat": "compute", "col": 2, "row": 1, "why": "Hosts the chat UI and the ADK agent that orchestrates retrieval and generation. Stateless, so it scales on demand."}, {"id": "armor", "label": "Model Armor", "cat": "security", "col": 3, "row": 0, "why": "Screens prompts and responses for prompt injection, jailbreaks and sensitive data before and after the model call."}, {"id": "llm", "label": "Gemini on Agent Platform", "cat": "ai", "col": 4, "row": 0, "why": "Generates the grounded answer from the retrieved chunks, through the enterprise endpoint (IAM, VPC-SC, regional processing)."}, {"id": "vec", "label": "AlloyDB (pgvector + ScaNN)", "cat": "data", "col": 4, "row": 2, "why": "Stores chunk embeddings next to metadata (policy ID, version, effective date, access group), so a single SQL query does vector search plus permission and version filters."}, {"id": "docs", "label": "Cloud Storage", "cat": "data", "col": 0, "row": 3, "why": "Landing bucket for policy PDFs (CMEK, uniform access, versioning)."}, {"id": "trig", "label": "Eventarc", "cat": "integration", "col": 1, "row": 3, "why": "Fires on object-finalize, so a new document version triggers re-indexing with no polling."}, {"id": "ingest", "label": "Cloud Run jobs", "cat": "compute", "col": 2, "row": 3, "why": "The ingestion pipeline: layout-aware parsing, structure-aware chunking, embedding, and an upsert into AlloyDB."}, {"id": "emb", "label": "Embeddings model (Agent Platform)", "cat": "ai", "col": 3, "row": 3, "why": "Turns each chunk (and each query) into a vector. The same model must be used for both."}, {"id": "obs", "label": "Cloud Trace + Cloud Logging", "cat": "ops", "col": 3, "row": 2, "why": "One trace per question (retrieval span, model span) and structured logs for evaluation and audit. The logs are PII-controlled."}], "edges": [{"from": "staff", "to": "iap", "label": "HTTPS (SSO)"}, {"from": "iap", "to": "app", "label": "signed JWT header"}, {"from": "app", "to": "armor", "label": "screen prompt"}, {"from": "armor", "to": "llm", "label": "generate (grounded)"}, {"from": "app", "to": "vec", "label": "similarity + ACL filter"}, {"from": "app", "to": "obs", "label": "spans, logs"}, {"from": "docs", "to": "trig", "label": "object finalized"}, {"from": "trig", "to": "ingest", "label": "start job"}, {"from": "ingest", "to": "emb", "label": "embed chunks"}, {"from": "ingest", "to": "vec", "label": "upsert vectors"}]}, {"id": "mobile-banking-api", "title": "Mobile banking API (serverless, customer-facing)", "level": "core", "context": "The mobile app needs balances, transactions and payee management. Spiky load (payday, salary mornings), strict security, APIs shared with partners later. Account data is mastered in a cloud-native ledger database.", "nodes": [{"id": "app", "label": "Mobile app", "cat": "fixed", "col": 0, "row": 1, "why": "Customer devices."}, {"id": "armor", "label": "Cloud Armor", "cat": "security", "col": 1, "row": 0, "why": "WAF (OWASP rules), rate limiting and L7 DDoS protection at Google's edge, before traffic reaches the gateway."}, {"id": "lb", "label": "Global external Application Load Balancer", "cat": "network", "col": 1, "row": 1, "why": "Anycast IP, TLS 1.2+ (SSL policy), and the attachment point for Cloud Armor."}, {"id": "apigee", "label": "Apigee", "cat": "integration", "col": 2, "row": 1, "why": "API management: OAuth token validation, per-app quotas and spike arrest, threat protection, analytics, and API products ready for partner exposure later."}, {"id": "bff", "label": "Cloud Run", "cat": "compute", "col": 3, "row": 1, "why": "A backend-for-frontend that aggregates calls for mobile screens. Autoscales for payday spikes."}, {"id": "cache", "label": "Memorystore", "cat": "data", "col": 4, "row": 0, "why": "Caches read-heavy, slow-changing data (payee lists, product info) to protect the database at peaks."}, {"id": "ledger", "label": "Spanner", "cat": "data", "col": 4, "row": 2, "why": "A strongly consistent, horizontally scalable relational database for accounts and transactions, with 99.99%+ availability."}, {"id": "events", "label": "Pub/Sub", "cat": "integration", "col": 5, "row": 1, "why": "Publishes \"payee added\" and \"payment made\" events so notifications and fraud checks don't slow the user's request."}, {"id": "notify", "label": "Cloud Run functions", "cat": "compute", "col": 6, "row": 1, "why": "Consumes events and sends push notifications. Decoupled and independently scalable."}], "edges": [{"from": "app", "to": "lb", "label": "HTTPS"}, {"from": "lb", "to": "armor", "label": "security policy"}, {"from": "lb", "to": "apigee", "label": "PSC / internal routing"}, {"from": "apigee", "to": "bff", "label": "verified request"}, {"from": "bff", "to": "cache", "label": "cache-aside reads"}, {"from": "bff", "to": "ledger", "label": "read/write txns"}, {"from": "bff", "to": "events", "label": "publish event"}, {"from": "events", "to": "notify", "label": "push subscription"}]}, {"id": "hybrid-landing-zone", "title": "Hybrid landing zone (bank network)", "level": "core", "context": "The bank's on-prem data centres must reach GCP workloads privately, with high availability. A central network team controls networking, and app teams deploy in their own projects. Internet egress must be controlled, and Google APIs reached privately.", "nodes": [{"id": "dc", "label": "On-prem data centres", "cat": "fixed", "col": 0, "row": 1, "why": "The existing estate (core banking, AD, DNS)."}, {"id": "ic", "label": "Dedicated Interconnect", "cat": "network", "col": 1, "row": 1, "why": "Private 10/100G circuits in London colocation facilities. Four connections across two metros give the 99.99% topology."}, {"id": "router", "label": "Cloud Router", "cat": "network", "col": 2, "row": 1, "why": "BGP sessions with on-prem routers over the VLAN attachments. It learns on-prem prefixes and advertises cloud subnets dynamically."}, {"id": "host", "label": "Shared VPC host project", "cat": "network", "col": 3, "row": 1, "why": "Central network team owns subnets, routes and firewalls. App teams get Network User on specific subnets only (separation of duties)."}, {"id": "svc", "label": "Service projects", "cat": "compute", "col": 4, "row": 2, "why": "App teams' projects, with workloads attached to the shared subnets. IAM and billing stay per app."}, {"id": "fw", "label": "Hierarchical firewall policies", "cat": "security", "col": 3, "row": 0, "why": "Org- or folder-level rules app teams can't override (for example deny SSH from the internet, allow the scanner range)."}, {"id": "dns", "label": "Cloud DNS", "cat": "network", "col": 2, "row": 3, "why": "Forwarding zones to on-prem DNS for corp names, an inbound policy so on-prem can resolve cloud private zones, and private zones for googleapis.com."}, {"id": "psc", "label": "Private Service Connect endpoint", "cat": "network", "col": 4, "row": 0, "why": "Private IP for Google APIs (Gemini, BigQuery, Cloud Storage), reachable from on-prem over the Interconnect and inside the VPC-SC perimeter."}, {"id": "swp", "label": "Secure Web Proxy", "cat": "security", "col": 5, "row": 1, "why": "Explicit egress proxy that allows only approved external hostnames, with full request logging."}, {"id": "nat", "label": "Cloud NAT", "cat": "network", "col": 6, "row": 1, "why": "Outbound internet with fixed IPs for the proxied traffic. Nothing inbound."}], "edges": [{"from": "dc", "to": "ic", "label": "private circuits"}, {"from": "ic", "to": "router", "label": "VLAN attachments (BGP)"}, {"from": "router", "to": "host", "label": "dynamic routes"}, {"from": "host", "to": "svc", "label": "shared subnets"}, {"from": "fw", "to": "host", "label": "enforced on VPC"}, {"from": "dc", "to": "dns", "label": "DNS forwarding"}, {"from": "host", "to": "psc", "label": "private API access"}, {"from": "svc", "to": "swp", "label": "egress via proxy"}, {"from": "swp", "to": "nat", "label": "to internet"}]}, {"id": "realtime-fraud", "title": "Real-time card fraud scoring", "level": "advanced", "context": "Card authorisations must be scored for fraud in under 100 ms. Features like \"spend in the last 10 minutes\" must be fresh. Decisions are stored for analytics, model monitoring and investigator review.", "nodes": [{"id": "switch", "label": "Card authorisation switch (on-prem)", "cat": "fixed", "col": 0, "row": 1, "why": "The payment switch asking \"approve or decline?\"."}, {"id": "api", "label": "Cloud Run (scoring service)", "cat": "compute", "col": 1, "row": 1, "why": "A low-latency synchronous API, reached privately over Interconnect, that fetches features, calls the model and returns a decision within the latency budget. Min instances avoid cold starts."}, {"id": "feat", "label": "Bigtable", "cat": "data", "col": 2, "row": 0, "why": "Single-digit-millisecond key lookups of per-card features (row key = card hash). The online feature store."}, {"id": "model", "label": "Agent Platform endpoint", "cat": "ai", "col": 2, "row": 2, "why": "Serves the fraud model (for example a gradient-boosted tree) online, autoscaling, privately through PSC."}, {"id": "bus", "label": "Pub/Sub", "cat": "integration", "col": 3, "row": 1, "why": "Each transaction and decision is published as an event, which decouples analytics and feature updates from the hot path."}, {"id": "flow", "label": "Dataflow (streaming)", "cat": "compute", "col": 4, "row": 0, "why": "Computes windowed aggregates (spend per card over 10 minutes and 24 hours) from the event stream and writes them back to Bigtable."}, {"id": "bq", "label": "BigQuery", "cat": "data", "col": 4, "row": 2, "why": "All decisions and features for analytics, model retraining, monitoring and investigations."}, {"id": "mon", "label": "Model Monitoring", "cat": "ai", "col": 5, "row": 2, "why": "Detects feature drift and skew against the training baseline, and alerts model risk owners."}, {"id": "looker", "label": "Looker", "cat": "ops", "col": 5, "row": 1, "why": "Dashboards for fraud ops (decline rates, alert volumes, false positives)."}], "edges": [{"from": "switch", "to": "api", "label": "score request (<100ms)"}, {"from": "api", "to": "feat", "label": "get features"}, {"from": "api", "to": "model", "label": "predict"}, {"from": "api", "to": "bus", "label": "publish decision"}, {"from": "bus", "to": "flow", "label": "stream events"}, {"from": "flow", "to": "feat", "label": "update aggregates"}, {"from": "bus", "to": "bq", "label": "BigQuery subscription"}, {"from": "bq", "to": "mon", "label": "baseline vs live"}, {"from": "bq", "to": "looker", "label": "dashboards"}]}, {"id": "cdc-lakehouse", "title": "Core banking CDC to a governed lakehouse", "level": "core", "context": "An on-prem core banking database (Oracle) must feed near-real-time analytics and ML without loading the source system. Data includes PII. Analysts need curated, governed datasets with lineage for regulatory reporting.", "nodes": [{"id": "core", "label": "Core banking DB (on-prem Oracle)", "cat": "fixed", "col": 0, "row": 1, "why": "The system of record."}, {"id": "ds", "label": "Datastream", "cat": "integration", "col": 1, "row": 1, "why": "Serverless change data capture from Oracle redo logs. Low impact on the source, near real time."}, {"id": "raw", "label": "BigQuery (raw / bronze)", "cat": "data", "col": 2, "row": 1, "why": "Datastream writes changes straight into BigQuery replica tables."}, {"id": "sdp", "label": "Sensitive Data Protection", "cat": "security", "col": 3, "row": 0, "why": "Discovers and classifies PII columns, and de-identifies or tokenizes them for wider-access layers."}, {"id": "dform", "label": "Dataform", "cat": "integration", "col": 3, "row": 1, "why": "Version-controlled SQL transformations (bronze → silver → gold) with assertions as data-quality tests."}, {"id": "gold", "label": "BigQuery (curated / gold)", "cat": "data", "col": 4, "row": 1, "why": "Modelled, documented datasets. Policy tags give column-level security, and row-level security applies by region or business unit."}, {"id": "plex", "label": "Dataplex Universal Catalog", "cat": "ops", "col": 4, "row": 0, "why": "Catalog, business glossary, column-level lineage and data-quality scans, which back BCBS 239-style \"where did this number come from?\" evidence."}, {"id": "looker", "label": "Looker", "cat": "ops", "col": 5, "row": 1, "why": "A governed semantic layer and dashboards for regulatory and management reporting."}, {"id": "bqml", "label": "BigQuery ML", "cat": "ai", "col": 5, "row": 2, "why": "Trains and runs models in SQL directly on curated data (for example churn or propensity)."}], "edges": [{"from": "core", "to": "ds", "label": "redo log CDC"}, {"from": "ds", "to": "raw", "label": "stream changes"}, {"from": "raw", "to": "dform", "label": "transform"}, {"from": "sdp", "to": "raw", "label": "scan + classify"}, {"from": "dform", "to": "gold", "label": "publish curated"}, {"from": "plex", "to": "gold", "label": "catalog, lineage, DQ"}, {"from": "gold", "to": "looker", "label": "semantic model"}, {"from": "gold", "to": "bqml", "label": "train / predict"}]}, {"id": "agentic-servicing", "title": "Agentic customer-service assistant (tools, MCP, A2A)", "level": "advanced", "context": "A chat assistant in the banking app helps customers with card controls, statements and simple disputes. It must take real actions only with confirmation, delegate mortgage questions to the mortgage team's agent, and hand off to a human.", "nodes": [{"id": "cust", "label": "Customer (in app chat)", "cat": "fixed", "col": 0, "row": 1, "why": "An authenticated customer session."}, {"id": "gw", "label": "Apigee", "cat": "integration", "col": 1, "row": 1, "why": "The AI gateway: validates the customer token, enforces token quotas per channel, logs every model and tool call."}, {"id": "agent", "label": "Agent Runtime (ADK orchestrator)", "cat": "ai", "col": 2, "row": 1, "why": "Hosts the ADK agent with managed sessions and memory. It plans, calls tools and asks for confirmation before actions."}, {"id": "llm", "label": "Gemini on Agent Platform", "cat": "ai", "col": 3, "row": 0, "why": "Reasoning and tool selection for the orchestrator."}, {"id": "armor", "label": "Model Armor", "cat": "security", "col": 2, "row": 0, "why": "Screens inputs and outputs for prompt injection (including from tool results) and PII leakage."}, {"id": "mcp", "label": "MCP server on Cloud Run", "cat": "compute", "col": 3, "row": 2, "why": "Exposes approved banking tools (freeze card, get statement) through MCP with narrow schemas, and calls internal APIs under its own least-privilege service account."}, {"id": "core", "label": "Card and account APIs (on-prem)", "cat": "fixed", "col": 4, "row": 2, "why": "Existing systems of record, reached privately."}, {"id": "a2a", "label": "Mortgage agent (A2A)", "cat": "ai", "col": 4, "row": 1, "why": "Owned by another team, it publishes an Agent Card. The orchestrator delegates mortgage tasks over the A2A protocol instead of reimplementing them."}, {"id": "human", "label": "Contact-centre handoff (Customer Engagement Suite)", "cat": "integration", "col": 5, "row": 1, "why": "Escalates to a human agent with the conversation summary when confidence is low or the customer asks."}, {"id": "trace", "label": "Cloud Trace + BigQuery eval logs", "cat": "ops", "col": 5, "row": 0, "why": "Trajectory traces (each model and tool step) feed offline evaluation and audit."}], "edges": [{"from": "cust", "to": "gw", "label": "chat message"}, {"from": "gw", "to": "agent", "label": "authorised request"}, {"from": "agent", "to": "armor", "label": "screen in/out"}, {"from": "agent", "to": "llm", "label": "plan / respond"}, {"from": "agent", "to": "mcp", "label": "tool call (after confirm)"}, {"from": "mcp", "to": "core", "label": "private API call"}, {"from": "agent", "to": "a2a", "label": "delegate task (A2A)"}, {"from": "agent", "to": "human", "label": "escalate"}, {"from": "agent", "to": "trace", "label": "spans"}]}, {"id": "three-tier-ha", "title": "Three-tier lift-and-shift with high availability", "level": "starter", "context": "A Java web application on 12 on-prem VMs with MySQL has to move within 3 months, with minimal code change and 99.9% availability. Patches need internet access. Admins need SSH.", "nodes": [{"id": "users", "label": "Users", "cat": "fixed", "col": 0, "row": 1, "why": "Internet users."}, {"id": "armor", "label": "Cloud Armor", "cat": "security", "col": 1, "row": 0, "why": "WAF at the edge."}, {"id": "elb", "label": "Global external Application Load Balancer", "cat": "network", "col": 1, "row": 1, "why": "HTTPS front door with health checks."}, {"id": "web", "label": "Regional managed instance group (web)", "cat": "compute", "col": 2, "row": 1, "why": "Web tier VMs spread across 3 zones, with autoscaling and autohealing, from a hardened instance template."}, {"id": "ilb", "label": "Internal Application Load Balancer", "cat": "network", "col": 3, "row": 1, "why": "Private L7 load balancing from the web tier to the app tier."}, {"id": "appt", "label": "Regional managed instance group (app)", "cat": "compute", "col": 4, "row": 1, "why": "The application tier, also multi-zone."}, {"id": "sql", "label": "Cloud SQL for MySQL (HA)", "cat": "data", "col": 5, "row": 1, "why": "Managed MySQL with a synchronous standby in another zone (automatic failover), automated backups and PITR. Migrated with Database Migration Service."}, {"id": "replica", "label": "Cross-region read replica", "cat": "data", "col": 5, "row": 2, "why": "Asynchronous replica in a second region, promoted for disaster recovery."}, {"id": "nat", "label": "Cloud NAT", "cat": "network", "col": 3, "row": 2, "why": "Outbound access for OS patches. The VMs have no external IPs."}, {"id": "iap", "label": "IAP TCP forwarding", "cat": "identity", "col": 2, "row": 2, "why": "Admin SSH by IAM identity with no bastion or public IPs (OS Login)."}], "edges": [{"from": "users", "to": "elb", "label": "HTTPS"}, {"from": "elb", "to": "armor", "label": "policy"}, {"from": "elb", "to": "web", "label": "backend service"}, {"from": "web", "to": "ilb", "label": "internal HTTP"}, {"from": "ilb", "to": "appt", "label": "backend service"}, {"from": "appt", "to": "sql", "label": "private IP"}, {"from": "sql", "to": "replica", "label": "async replication"}, {"from": "web", "to": "nat", "label": "patches out"}, {"from": "iap", "to": "web", "label": "SSH (IAM)"}]}, {"id": "secure-data-science", "title": "Secure data science environment", "level": "advanced", "context": "Data scientists analyse customer data for models. Data must stay in the UK and inside the bank's projects. Exfiltration to personal projects or the internet must be impossible even with valid credentials. Access only from bank-managed devices. Every data read must be auditable.", "nodes": [{"id": "ds", "label": "Data scientists (managed devices)", "cat": "fixed", "col": 0, "row": 1, "why": "Users on bank laptops."}, {"id": "acm", "label": "Access Context Manager", "cat": "identity", "col": 1, "row": 0, "why": "Defines an access level: bank-managed device + corporate IP ranges. The perimeter admits only matching requests."}, {"id": "vpcsc", "label": "VPC Service Controls perimeter", "cat": "security", "col": 1, "row": 1, "why": "Wraps the analytics projects. API calls crossing the perimeter boundary are blocked, which stops copying data out even with valid IAM."}, {"id": "wb", "label": "Agent Platform Workbench", "cat": "compute", "col": 2, "row": 1, "why": "Managed notebooks in a private VPC (no public IP), running as a per-user or per-team service account."}, {"id": "bq", "label": "BigQuery", "cat": "data", "col": 3, "row": 1, "why": "Customer datasets in the London region, with column-level policy tags (PII masked for most roles) and row-level security."}, {"id": "gcs", "label": "Cloud Storage", "cat": "data", "col": 3, "row": 2, "why": "Model artifacts and extracts, with CMEK and uniform access."}, {"id": "kms", "label": "Cloud KMS (CMEK)", "cat": "security", "col": 4, "row": 0, "why": "Bank-controlled keys (HSM-backed) for BigQuery and Cloud Storage. Revoking a key makes the data unreadable."}, {"id": "logs", "label": "Cloud Audit Logs (Data Access)", "cat": "ops", "col": 4, "row": 2, "why": "Data Access logs enabled for BigQuery and Cloud Storage, routed by an aggregated sink to a locked central logging project."}, {"id": "orgp", "label": "Organization Policy", "cat": "security", "col": 2, "row": 0, "why": "Resource locations limited to UK, no external IPs, no service account keys, domain-restricted sharing."}], "edges": [{"from": "ds", "to": "acm", "label": "request context"}, {"from": "acm", "to": "vpcsc", "label": "access level"}, {"from": "vpcsc", "to": "wb", "label": "allowed ingress"}, {"from": "wb", "to": "bq", "label": "query (restricted VIP)"}, {"from": "wb", "to": "gcs", "label": "read/write"}, {"from": "kms", "to": "bq", "label": "wraps keys"}, {"from": "kms", "to": "gcs", "label": "wraps keys"}, {"from": "bq", "to": "logs", "label": "data access events"}, {"from": "orgp", "to": "wb", "label": "guardrails"}]}, {"id": "secure-cicd", "title": "Secure software supply chain (CI/CD)", "level": "core", "context": "Teams deploy containers to GKE and Cloud Run. The bank requires no long-lived credentials, build provenance, vulnerability gates, approval before production, and an audit trail of every deployment.", "nodes": [{"id": "dev", "label": "Developer pull request", "cat": "fixed", "col": 0, "row": 1, "why": "A code change, reviewed in the git platform."}, {"id": "gh", "label": "GitHub", "cat": "fixed", "col": 1, "row": 1, "why": "Source control with branch protection."}, {"id": "wif", "label": "Workload Identity Federation", "cat": "identity", "col": 1, "row": 0, "why": "Pipelines authenticate to GCP with short-lived federated tokens restricted to the bank's repos and branches. No service account keys."}, {"id": "build", "label": "Cloud Build (private pool)", "cat": "compute", "col": 2, "row": 1, "why": "Builds and tests inside the bank's VPC (no public internet), and emits SLSA provenance."}, {"id": "ar", "label": "Artifact Registry", "cat": "data", "col": 3, "row": 1, "why": "Stores images by digest, with remote repositories proxying approved public dependencies."}, {"id": "scan", "label": "Artifact Analysis", "cat": "security", "col": 3, "row": 0, "why": "Scans images for CVEs on push and continuously. Critical findings block promotion."}, {"id": "binauthz", "label": "Binary Authorization", "cat": "security", "col": 4, "row": 0, "why": "Admission policy: only images with valid build provenance and attestations from the bank's pipeline can run."}, {"id": "deploy", "label": "Cloud Deploy", "cat": "ops", "col": 4, "row": 1, "why": "Promotes the same image digest dev → test → prod, with approvals, canary strategy and full audit history."}, {"id": "prod", "label": "GKE / Cloud Run (prod)", "cat": "compute", "col": 5, "row": 1, "why": "Runtime targets. Deployments happen only through the pipeline's service account."}, {"id": "sm", "label": "Secret Manager", "cat": "security", "col": 5, "row": 2, "why": "Runtime secrets are injected at deploy time, never built into images."}], "edges": [{"from": "dev", "to": "gh", "label": "merge"}, {"from": "gh", "to": "build", "label": "trigger"}, {"from": "wif", "to": "build", "label": "federated auth"}, {"from": "build", "to": "ar", "label": "push image + provenance"}, {"from": "ar", "to": "scan", "label": "scan"}, {"from": "ar", "to": "deploy", "label": "release by digest"}, {"from": "deploy", "to": "prod", "label": "canary / promote"}, {"from": "binauthz", "to": "prod", "label": "admission check"}, {"from": "sm", "to": "prod", "label": "inject secrets"}]}, {"id": "kyc-onboarding", "title": "KYC document onboarding (event-driven)", "level": "core", "context": "New customers upload ID documents and proof of address. Extract the fields, check consistency, create a case, and route uncertain cases to a human reviewer within hours. Every step must be auditable and retryable.", "nodes": [{"id": "cust", "label": "Customer (web/app)", "cat": "fixed", "col": 0, "row": 1, "why": "Uploads documents."}, {"id": "surl", "label": "Signed URL upload", "cat": "identity", "col": 1, "row": 1, "why": "The app issues a short-lived signed URL, so the browser uploads straight to the bucket and files never pass through the API servers."}, {"id": "gcs", "label": "Cloud Storage", "cat": "data", "col": 2, "row": 1, "why": "Uploaded documents in a CMEK bucket with retention policies."}, {"id": "evt", "label": "Eventarc", "cat": "integration", "col": 3, "row": 1, "why": "The object-finalize event starts processing."}, {"id": "wf", "label": "Workflows", "cat": "integration", "col": 4, "row": 1, "why": "Orchestrates the steps with retries and error handling, and waits on a callback for human review when needed (it can wait for days)."}, {"id": "docai", "label": "Document AI", "cat": "ai", "col": 4, "row": 0, "why": "ID document and proof-of-address processors extract structured fields with confidence scores."}, {"id": "gem", "label": "Gemini on Agent Platform", "cat": "ai", "col": 5, "row": 0, "why": "Cross-checks the extracted fields (name and address consistency), summarises discrepancies and drafts the reviewer note."}, {"id": "fs", "label": "Firestore", "cat": "data", "col": 5, "row": 2, "why": "The case record (status, extracted fields, decisions) for the onboarding app and the reviewers."}, {"id": "tasks", "label": "Cloud Tasks", "cat": "integration", "col": 4, "row": 2, "why": "A rate-limited queue that pushes uncertain cases to the case-management system without overloading it."}, {"id": "bus", "label": "Pub/Sub", "cat": "integration", "col": 6, "row": 1, "why": "Publishes \"kyc.completed\" for downstream account opening and analytics."}], "edges": [{"from": "cust", "to": "surl", "label": "get upload URL"}, {"from": "surl", "to": "gcs", "label": "PUT document"}, {"from": "gcs", "to": "evt", "label": "finalized"}, {"from": "evt", "to": "wf", "label": "start execution"}, {"from": "wf", "to": "docai", "label": "extract"}, {"from": "wf", "to": "gem", "label": "verify + summarise"}, {"from": "wf", "to": "fs", "label": "update case"}, {"from": "wf", "to": "tasks", "label": "queue review"}, {"from": "wf", "to": "bus", "label": "publish outcome"}]}, {"id": "active-active-payments", "title": "Multi-region active-active payments API", "level": "advanced", "context": "A payment-initiation API with an impact tolerance of 15 minutes, so it must survive a full region outage with no data loss. Writes must be strongly consistent. Regulatory policy allows the EU region as a pair for this service.", "nodes": [{"id": "clients", "label": "Payment initiators", "cat": "fixed", "col": 0, "row": 1, "why": "Apps and partners."}, {"id": "dns", "label": "Cloud DNS", "cat": "network", "col": 1, "row": 0, "why": "Public name for the API."}, {"id": "lb", "label": "Global external Application Load Balancer", "cat": "network", "col": 1, "row": 1, "why": "A single anycast IP that routes to the nearest healthy region and fails over automatically when a region's backends fail health checks."}, {"id": "runa", "label": "Cloud Run (europe-west2)", "cat": "compute", "col": 2, "row": 0, "why": "Region A API instances (serverless NEG)."}, {"id": "runb", "label": "Cloud Run (europe-west1)", "cat": "compute", "col": 2, "row": 2, "why": "Region B API instances, serving live traffic too (active-active, not standby)."}, {"id": "spanner", "label": "Spanner (multi-region config)", "cat": "data", "col": 4, "row": 1, "why": "Synchronous Paxos replication across regions gives RPO 0 and strongly consistent writes from both regions. It's the piece that makes active-active safe for money."}, {"id": "idem", "label": "Idempotency key store (in Spanner)", "cat": "data", "col": 4, "row": 0, "why": "Stores idempotency keys transactionally with each payment, so client retries after a failover never double-pay."}, {"id": "bus", "label": "Pub/Sub", "cat": "integration", "col": 5, "row": 1, "why": "A global topic for payment events to downstream systems, with a message storage policy restricting regions."}], "edges": [{"from": "clients", "to": "dns", "label": "resolve"}, {"from": "clients", "to": "lb", "label": "HTTPS"}, {"from": "lb", "to": "runa", "label": "nearest healthy"}, {"from": "lb", "to": "runb", "label": "nearest healthy"}, {"from": "runa", "to": "spanner", "label": "read/write txn"}, {"from": "runb", "to": "spanner", "label": "read/write txn"}, {"from": "runa", "to": "idem", "label": "check key"}, {"from": "spanner", "to": "bus", "label": "change stream → events"}]}, {"id": "central-logging-secops", "title": "Central logging and security operations", "level": "core", "context": "Hundreds of projects. The SOC needs every audit and security log centrally, tamper-resistant, kept for 7 years, searchable, and fed to the SIEM. Platform teams need alerting on SLOs and security findings.", "nodes": [{"id": "projects", "label": "All projects (org)", "cat": "fixed", "col": 0, "row": 1, "why": "Every workload project emits logs."}, {"id": "sink", "label": "Aggregated log sink (org level)", "cat": "ops", "col": 1, "row": 1, "why": "One org-level sink captures audit logs from all child projects. Teams can't bypass it."}, {"id": "bucket", "label": "Locked log bucket (logging project)", "cat": "data", "col": 2, "row": 1, "why": "Central log bucket with locked retention and restricted access, and Log Analytics enabled for SQL queries."}, {"id": "bq", "label": "BigQuery (linked dataset)", "cat": "data", "col": 3, "row": 2, "why": "SQL analytics over logs for investigations and audit evidence."}, {"id": "ps", "label": "Pub/Sub", "cat": "integration", "col": 3, "row": 0, "why": "Streams logs in near real time to the SIEM."}, {"id": "siem", "label": "Google Security Operations / SIEM", "cat": "fixed", "col": 4, "row": 0, "why": "The SOC's detection and response platform."}, {"id": "scc", "label": "Security Command Center", "cat": "security", "col": 1, "row": 3, "why": "Misconfiguration and threat findings across the org, exported through Pub/Sub to the SIEM."}, {"id": "mon", "label": "Cloud Monitoring (alerting)", "cat": "ops", "col": 4, "row": 2, "why": "SLO burn-rate alerts and log-based metrics (for example break-glass account use) → notification channels."}, {"id": "pager", "label": "PagerDuty / on-call", "cat": "fixed", "col": 5, "row": 2, "why": "On-call engineers."}], "edges": [{"from": "projects", "to": "sink", "label": "audit + app logs"}, {"from": "sink", "to": "bucket", "label": "route"}, {"from": "bucket", "to": "bq", "label": "linked dataset"}, {"from": "sink", "to": "ps", "label": "route (SIEM filter)"}, {"from": "ps", "to": "siem", "label": "stream"}, {"from": "scc", "to": "ps", "label": "findings"}, {"from": "projects", "to": "mon", "label": "metrics"}, {"from": "mon", "to": "pager", "label": "page"}]}, {"id": "private-gemini-onprem", "title": "Private Gemini access from on-premises apps", "level": "advanced", "context": "Existing on-prem applications want to call Gemini for summarisation. Traffic must not use the public internet, calls must stay inside the bank's VPC-SC perimeter, and DNS must resolve the Google API names to private addresses.", "nodes": [{"id": "app", "label": "On-prem application", "cat": "fixed", "col": 0, "row": 1, "why": "An existing service in the data centre."}, {"id": "odns", "label": "On-prem DNS", "cat": "fixed", "col": 0, "row": 2, "why": "The corporate resolvers."}, {"id": "ic", "label": "Cloud Interconnect", "cat": "network", "col": 1, "row": 1, "why": "Private connectivity into the hub VPC."}, {"id": "cr", "label": "Cloud Router", "cat": "network", "col": 2, "row": 1, "why": "Advertises the PSC endpoint IP to on-prem over BGP."}, {"id": "inbound", "label": "Cloud DNS inbound server policy", "cat": "network", "col": 1, "row": 2, "why": "An IP in the VPC that on-prem DNS forwards googleapis.com queries to."}, {"id": "pzone", "label": "Cloud DNS private zone (googleapis.com)", "cat": "network", "col": 2, "row": 2, "why": "Maps aiplatform.googleapis.com (and others) to the private endpoint IP."}, {"id": "psc", "label": "Private Service Connect endpoint (Google APIs)", "cat": "network", "col": 3, "row": 1, "why": "An internal IP in the hub VPC that fronts Google APIs, set to the VPC-SC-compatible bundle."}, {"id": "perim", "label": "VPC Service Controls perimeter", "cat": "security", "col": 4, "row": 0, "why": "The AI project sits inside the perimeter. Ingress rules admit the on-prem path (access level on source ranges) and the service account."}, {"id": "gem", "label": "Gemini on Agent Platform", "cat": "ai", "col": 4, "row": 1, "why": "The regional model endpoint, called with IAM-authenticated requests."}], "edges": [{"from": "app", "to": "ic", "label": "HTTPS to private IP"}, {"from": "odns", "to": "inbound", "label": "forward googleapis.com"}, {"from": "inbound", "to": "pzone", "label": "resolve"}, {"from": "ic", "to": "cr", "label": "BGP routes"}, {"from": "cr", "to": "psc", "label": "route to endpoint"}, {"from": "psc", "to": "gem", "label": "API call"}, {"from": "perim", "to": "gem", "label": "protects"}]}, {"id": "gke-mesh-platform", "title": "GKE microservices platform with a service mesh", "level": "advanced", "context": "40 microservices from several teams. A shared platform with mTLS between services, per-service identity, GitOps deployments, Prometheus metrics and private databases.", "nodes": [{"id": "users", "label": "Users", "cat": "fixed", "col": 0, "row": 1, "why": "Clients."}, {"id": "gw", "label": "GKE Gateway (external Application Load Balancer)", "cat": "network", "col": 1, "row": 1, "why": "The Gateway API provisions the external load balancer. App teams own their HTTPRoutes."}, {"id": "gke", "label": "GKE Autopilot (regional)", "cat": "compute", "col": 2, "row": 1, "why": "Google-managed nodes across 3 zones. Teams deploy into namespaces."}, {"id": "mesh", "label": "Cloud Service Mesh", "cat": "security", "col": 2, "row": 0, "why": "Automatic mTLS, authorization policies (\"only payments may call ledger\"), retries and timeouts, and golden-signal telemetry."}, {"id": "wi", "label": "Workload Identity Federation for GKE", "cat": "identity", "col": 3, "row": 0, "why": "Each Kubernetes service account maps to an IAM principal, so Pods call Google APIs without keys."}, {"id": "sql", "label": "Cloud SQL (private IP)", "cat": "data", "col": 3, "row": 2, "why": "Relational data reached through the Cloud SQL Auth Proxy sidecar with IAM authentication."}, {"id": "redis", "label": "Memorystore", "cat": "data", "col": 4, "row": 2, "why": "Shared cache and session store."}, {"id": "sync", "label": "Config Sync (GitOps)", "cat": "ops", "col": 1, "row": 3, "why": "Reconciles cluster configuration and policies from git. Policy Controller blocks non-compliant manifests."}, {"id": "prom", "label": "Managed Service for Prometheus", "cat": "ops", "col": 4, "row": 1, "why": "Scrapes and stores Prometheus metrics without running Prometheus servers, queried with PromQL in Cloud Monitoring."}], "edges": [{"from": "users", "to": "gw", "label": "HTTPS"}, {"from": "gw", "to": "gke", "label": "HTTPRoute → Pods (NEG)"}, {"from": "mesh", "to": "gke", "label": "mTLS sidecars"}, {"from": "wi", "to": "gke", "label": "pod identity"}, {"from": "gke", "to": "sql", "label": "Auth Proxy"}, {"from": "gke", "to": "redis", "label": "cache"}, {"from": "sync", "to": "gke", "label": "desired state"}, {"from": "gke", "to": "prom", "label": "metrics"}]}, {"id": "credit-risk-mlops", "title": "Credit-risk model pipeline under model risk management", "level": "advanced", "context": "A probability-of-default model retrained monthly on bureau and account data. The model risk policy requires reproducible training, independent validation before use, explainability for adverse decisions, and drift monitoring.", "nodes": [{"id": "bq", "label": "BigQuery (feature tables)", "cat": "data", "col": 0, "row": 1, "why": "Curated, point-in-time-correct training data."}, {"id": "fs", "label": "Agent Platform Feature Store", "cat": "data", "col": 1, "row": 0, "why": "Shared feature definitions served consistently to training and scoring."}, {"id": "comp", "label": "Cloud Composer", "cat": "integration", "col": 0, "row": 3, "why": "A monthly schedule that orchestrates data refresh and triggers the pipeline."}, {"id": "pipe", "label": "Agent Platform Pipelines", "cat": "ai", "col": 1, "row": 1, "why": "A reproducible, versioned pipeline: data validation → train → evaluate → register, with lineage recorded in ML Metadata."}, {"id": "reg", "label": "Model Registry", "cat": "ai", "col": 2, "row": 1, "why": "The model inventory entry with version, metrics and lineage. Aliases (`challenger` / `champion`) are switched only after validation sign-off."}, {"id": "val", "label": "Independent validation (2nd line)", "cat": "fixed", "col": 2, "row": 3, "why": "Model validators review the evidence and approve or reject."}, {"id": "batch", "label": "Batch prediction", "cat": "ai", "col": 3, "row": 1, "why": "Monthly scoring of the whole book, written back to BigQuery."}, {"id": "xai", "label": "Explainable AI", "cat": "ai", "col": 3, "row": 0, "why": "Feature attributions per prediction give reason codes for adverse-action explanations."}, {"id": "mon", "label": "Model Monitoring", "cat": "ai", "col": 4, "row": 2, "why": "Tracks drift in feature and score distributions, and triggers review when thresholds are breached."}, {"id": "out", "label": "BigQuery (scores) + Looker", "cat": "ops", "col": 4, "row": 1, "why": "Scores and monitoring dashboards for risk committees."}], "edges": [{"from": "comp", "to": "pipe", "label": "trigger monthly"}, {"from": "bq", "to": "pipe", "label": "training data"}, {"from": "fs", "to": "pipe", "label": "features"}, {"from": "pipe", "to": "reg", "label": "register version"}, {"from": "reg", "to": "val", "label": "evidence pack"}, {"from": "reg", "to": "batch", "label": "approved model"}, {"from": "batch", "to": "xai", "label": "attributions"}, {"from": "batch", "to": "out", "label": "scores"}, {"from": "out", "to": "mon", "label": "drift checks"}]}, {"id": "open-banking", "title": "Open Banking API platform (FAPI)", "level": "advanced", "context": "Licensed third-party providers (TPPs) access account information and initiate payments with customer consent. FAPI security: mTLS client certificates, OAuth 2.0 with signed requests. The regulator expects high availability and full audit.", "nodes": [{"id": "tpp", "label": "Third-party provider", "cat": "fixed", "col": 0, "row": 1, "why": "A fintech app with eIDAS or OBIE certificates."}, {"id": "lb", "label": "External Application Load Balancer (mTLS)", "cat": "network", "col": 1, "row": 1, "why": "Requires and validates client certificates against a trust store of approved CAs (frontend mTLS). Cloud Armor rules apply too."}, {"id": "apigee", "label": "Apigee", "cat": "integration", "col": 2, "row": 1, "why": "The FAPI profile: OAuth 2.0 authorization server, certificate-bound tokens, consent checks, per-TPP quotas, analytics and the TPP developer portal."}, {"id": "consent", "label": "Cloud Run (consent service)", "cat": "compute", "col": 3, "row": 0, "why": "Manages customer consents (scopes, expiry, revocation) and the customer-facing consent journey."}, {"id": "cdb", "label": "Cloud SQL (consents)", "cat": "data", "col": 4, "row": 0, "why": "The relational consent store with an HA configuration and PITR."}, {"id": "idp", "label": "Bank customer identity provider", "cat": "fixed", "col": 3, "row": 2, "why": "Authenticates customers with strong customer authentication during consent."}, {"id": "core", "label": "Account and payment APIs (on-prem)", "cat": "fixed", "col": 4, "row": 1, "why": "Systems of record behind private connectivity."}, {"id": "hsm", "label": "Cloud HSM (via Cloud KMS)", "cat": "security", "col": 2, "row": 0, "why": "HSM-protected keys for signing tokens and responses (FIPS 140-2 Level 3)."}, {"id": "audit", "label": "Cloud Audit Logs + Apigee analytics", "cat": "ops", "col": 5, "row": 1, "why": "Every TPP call and consent change, retained for the regulator."}], "edges": [{"from": "tpp", "to": "lb", "label": "mTLS"}, {"from": "lb", "to": "apigee", "label": "verified client cert"}, {"from": "apigee", "to": "consent", "label": "consent check"}, {"from": "consent", "to": "cdb", "label": "read/write"}, {"from": "consent", "to": "idp", "label": "SCA redirect"}, {"from": "apigee", "to": "core", "label": "private call"}, {"from": "hsm", "to": "apigee", "label": "sign tokens"}, {"from": "apigee", "to": "audit", "label": "logs"}]}, {"id": "controlled-egress", "title": "Egress-controlled call to an external payment scheme", "level": "core", "context": "A private service must call a payment scheme's API over the internet. The scheme allow-lists source IPs and requires mTLS. Security requires that this service can reach only that hostname and that every outbound request is logged.", "nodes": [{"id": "svc", "label": "Cloud Run (payments adapter)", "cat": "compute", "col": 0, "row": 1, "why": "A private service (internal ingress only) with no direct internet route."}, {"id": "dve", "label": "Direct VPC egress", "cat": "network", "col": 1, "row": 1, "why": "Sends all of the service's outbound traffic into the VPC, so network controls apply."}, {"id": "swp", "label": "Secure Web Proxy", "cat": "security", "col": 2, "row": 1, "why": "An explicit proxy policy that allows only the scheme's hostname for this service's identity, and logs every request."}, {"id": "nat", "label": "Cloud NAT (manual static IPs)", "cat": "network", "col": 3, "row": 1, "why": "Fixed, reserved public IPs that the scheme allow-lists."}, {"id": "scheme", "label": "Payment scheme API", "cat": "fixed", "col": 4, "row": 1, "why": "An external partner over the internet."}, {"id": "cert", "label": "Secret Manager (client certificate)", "cat": "security", "col": 1, "row": 0, "why": "Holds the mTLS client certificate and key for the scheme connection, with access audited and rotation tracked."}, {"id": "fwp", "label": "Firewall policy (egress deny)", "cat": "security", "col": 2, "row": 2, "why": "Denies all other egress from the subnet, so the proxy is the only way out."}], "edges": [{"from": "svc", "to": "dve", "label": "all egress"}, {"from": "dve", "to": "swp", "label": "via proxy"}, {"from": "swp", "to": "nat", "label": "allowed host only"}, {"from": "nat", "to": "scheme", "label": "mTLS from static IP"}, {"from": "cert", "to": "svc", "label": "mount client cert"}, {"from": "fwp", "to": "dve", "label": "default deny egress"}]}], "scenarios": [{"id": "q1", "domain": "networking", "q": "A VM with no external IP must download OS patches from the internet and also read objects from Cloud Storage. Nothing on the internet should be able to start a connection to it. What do you configure?", "options": [{"text": "An external IP plus a firewall rule denying all ingress", "correct": false}, {"text": "Cloud NAT for the patches, and Private Google Access on the subnet for Cloud Storage", "correct": true}, {"text": "VPC Network Peering with a Google-managed VPC", "correct": false}, {"text": "A Serverless VPC Access connector", "correct": false}], "explain": "Cloud NAT gives outbound-only internet access. Private Google Access lets internal-only VMs reach Google APIs. An external IP adds attack surface even with firewall rules, and the other two options solve different problems."}, {"id": "q2", "domain": "networking", "q": "VPC A is peered with VPC B, and VPC B is peered with VPC C. A workload in A can't reach C. Why?", "options": [{"text": "Peering needs a Cloud Router", "correct": false}, {"text": "Firewall rules in B block transit", "correct": false}, {"text": "VPC Network Peering is not transitive", "correct": true}, {"text": "The subnets overlap", "correct": false}], "explain": "Peering only exchanges routes between the two directly peered VPCs. To get transitivity, use Network Connectivity Center, a Shared VPC design, or VPN or appliances in a hub."}, {"id": "q3", "domain": "networking", "q": "Users worldwide reach an HTTPS app that runs in two regions. You want one IP address, automatic failover between regions, and WAF protection. Which design?", "options": [{"text": "Two regional external Application Load Balancers with DNS round robin", "correct": false}, {"text": "A global external Application Load Balancer with backends in both regions and Cloud Armor", "correct": true}, {"text": "A passthrough Network Load Balancer per region", "correct": false}, {"text": "Cloud DNS geolocation routing straight to VM IPs", "correct": false}], "explain": "The global external Application Load Balancer uses one anycast IP, routes to the nearest healthy backend and fails over between regions. Cloud Armor attaches to its backend services."}, {"id": "q4", "domain": "networking", "q": "A TCP service must see the real client IP address and handle UDP traffic as well. Which load balancer?", "options": [{"text": "Global external Application Load Balancer", "correct": false}, {"text": "Proxy Network Load Balancer", "correct": false}, {"text": "Passthrough Network Load Balancer", "correct": true}, {"text": "Internal Application Load Balancer", "correct": false}], "explain": "Passthrough load balancers forward packets without proxying them, so the client IP is preserved and UDP works. Proxy load balancers terminate the connection, so the backend sees the proxy's IP."}, {"id": "q5", "domain": "networking", "q": "On-prem servers must call BigQuery privately over your Interconnect. They resolve `bigquery.googleapis.com` to public IPs and the traffic goes out through the internet. What's missing?", "options": [{"text": "A Cloud NAT gateway", "correct": false}, {"text": "DNS that maps googleapis.com to a Private Service Connect endpoint (or private/restricted VIP), with that IP advertised to on-prem over BGP", "correct": true}, {"text": "VPC Network Peering to BigQuery", "correct": false}, {"text": "An external IP on a proxy VM", "correct": false}], "explain": "Private API access from on-prem needs two things: routing (advertise the private IP range through Cloud Router) and DNS (a private zone or forwarding so the API names resolve to that IP)."}, {"id": "q6", "domain": "networking", "q": "Calls to an on-prem API over HA VPN work for small requests, but large responses hang. Over Interconnect, everything works. What's the most likely cause?", "options": [{"text": "An IAM permission", "correct": false}, {"text": "MTU mismatch: encapsulation overhead means large packets are dropped", "correct": true}, {"text": "The Cloud NAT port allocation", "correct": false}, {"text": "DNS TTL", "correct": false}], "explain": "Tunnels add headers, which reduces the usable MTU. If path MTU discovery or MSS clamping fails, large packets get dropped. This is the classic \"small works, big hangs\" symptom."}, {"id": "q7", "domain": "networking", "q": "Which statement about GCP VPC firewall rules is true?", "options": [{"text": "They are stateless, so you need rules in both directions", "correct": false}, {"text": "They are enforced by a central firewall appliance per VPC", "correct": false}, {"text": "They are stateful and enforced at each VM's virtual NIC", "correct": true}, {"text": "They can filter traffic by URL path", "correct": false}], "explain": "VPC firewall rules are stateful (replies are allowed automatically) and distributed by Andromeda to every host. URL filtering is L7: Cloud Armor, Secure Web Proxy or NGFW Enterprise."}, {"id": "q8", "domain": "networking", "q": "Your load balancer marks every backend VM as unhealthy, but the app works when you test it from inside the VPC. Most likely fix?", "options": [{"text": "Allow ingress from the health-check ranges 35.191.0.0/16 and 130.211.0.0/22", "correct": true}, {"text": "Add an external IP to each VM", "correct": false}, {"text": "Enable Private Google Access", "correct": false}, {"text": "Switch to a passthrough load balancer", "correct": false}], "explain": "Google's health-check probes come from these ranges. If the firewall doesn't allow them, the probes fail and the load balancer sends no traffic."}, {"id": "q9", "domain": "networking", "q": "Security requires that a private workload can call only `api.paymentscheme.com` on the internet, with every request logged. Cloud NAT is already configured. What else do you add?", "options": [{"text": "A Cloud Armor policy", "correct": false}, {"text": "Secure Web Proxy with a host allow-list, plus firewall rules denying other egress", "correct": true}, {"text": "VPC Service Controls", "correct": false}, {"text": "An IAM deny policy", "correct": false}], "explain": "Cloud NAT can't filter by hostname. Secure Web Proxy is a managed explicit forward proxy with host or URL policies and logging. VPC-SC controls Google API access, not general internet egress."}, {"id": "q10", "domain": "identity", "q": "A Cloud Run service returns 401 when another Cloud Run service calls it with an OAuth access token. What should the caller send?", "options": [{"text": "An API key", "correct": false}, {"text": "A Google-signed ID token whose audience is the target service's URL", "correct": true}, {"text": "The service account's JSON key", "correct": false}, {"text": "No token: make the service public instead", "correct": false}], "explain": "Private Cloud Run and IAP-protected backends authenticate callers with OIDC ID tokens (audience = the service URL). Access tokens are for calling Google APIs. The caller's service account also needs `roles/run.invoker`."}, {"id": "q11", "domain": "identity", "q": "GitHub Actions must deploy to GCP. Security bans service account keys. What do you use?", "options": [{"text": "A user account's refresh token stored as a GitHub secret", "correct": false}, {"text": "Workload Identity Federation with a pool trusting GitHub's OIDC issuer and an attribute condition restricting the repo and branch", "correct": true}, {"text": "An API key with a deploy scope", "correct": false}, {"text": "OS Login", "correct": false}], "explain": "WIF exchanges GitHub's short-lived OIDC token for Google credentials. The attribute condition is the security boundary. Without it, any GitHub repo could authenticate."}, {"id": "q12", "domain": "identity", "q": "A user is granted Editor on a folder. You remove their project-level Viewer binding on one project under that folder. What can they do in that project?", "options": [{"text": "Nothing: they have no project binding", "correct": false}, {"text": "Only Viewer actions", "correct": false}, {"text": "Editor actions, because inherited allow policies still apply", "correct": true}, {"text": "It depends on the org policy", "correct": false}], "explain": "Allow policies are inherited and additive. To block them, remove the folder grant or use an IAM deny policy."}, {"id": "q13", "domain": "identity", "q": "Engineers occasionally need Owner on production for incident fixes. Audit says no standing privileged access. Best approach?", "options": [{"text": "Give the on-call group permanent Owner", "correct": false}, {"text": "Share one break-glass account's password", "correct": false}, {"text": "Privileged Access Manager entitlements with approval, justification and automatic expiry", "correct": true}, {"text": "A custom role with all permissions", "correct": false}], "explain": "PAM gives just-in-time, time-bound, approved and audited elevation. Break-glass accounts still exist for true emergencies, but they aren't the routine path."}, {"id": "q14", "domain": "identity", "q": "Which of these can be used to enforce security policy (in firewall policies or IAM conditions)?", "options": [{"text": "Labels", "correct": false}, {"text": "Network tags", "correct": false}, {"text": "Secure Tags (Resource Manager tags)", "correct": true}, {"text": "Resource descriptions", "correct": false}], "explain": "Secure Tags are governed by IAM and supported in firewall policies, IAM conditions and org policy conditions. Labels are for cost and organization. Network tags can be changed by anyone who can edit the VM."}, {"id": "q15", "domain": "identity", "q": "An internal web tool needs to be reachable by employees only, with SSO and a requirement that devices be bank-managed, without a VPN. What do you use?", "options": [{"text": "Cloud Armor with an IP allow-list", "correct": false}, {"text": "Identity-Aware Proxy with an access level from Access Context Manager", "correct": true}, {"text": "VPC Service Controls", "correct": false}, {"text": "A Cloud VPN client", "correct": false}], "explain": "IAP authenticates users and checks IAM plus context (device and IP access levels) before forwarding requests. It's zero-trust access without a VPN."}, {"id": "q16", "domain": "identity", "q": "Your code runs on Cloud Run and on developers' laptops, using Google client libraries, with no credentials in code. How do the libraries find credentials in each place?", "options": [{"text": "They read a key file baked into the image", "correct": false}, {"text": "Application Default Credentials: the metadata server (the attached service account) on Cloud Run, and the user's ADC login file on laptops", "correct": true}, {"text": "They prompt for a password", "correct": false}, {"text": "They use the project's API key", "correct": false}], "explain": "ADC checks the GOOGLE_APPLICATION_CREDENTIALS env var, then the local gcloud ADC file, then the metadata server. The same code works in both environments."}, {"id": "q17", "domain": "security", "q": "A data scientist with legitimate read access to a customer dataset copies it to a BigQuery dataset in their personal project. Which control would have blocked this?", "options": [{"text": "An IAM deny policy on the personal project", "correct": false}, {"text": "A VPC Service Controls perimeter around the bank's data projects", "correct": true}, {"text": "CMEK on the dataset", "correct": false}, {"text": "Cloud Armor", "correct": false}], "explain": "VPC-SC blocks API operations that move data across the perimeter, even when the caller's IAM allows them. That's the exfiltration control. CMEK controls who can decrypt, not where copies go."}, {"id": "q18", "domain": "security", "q": "The CISO asks: \"If we lose trust in a service's data handling, can we make all its stored data unreadable immediately?\" Which capability answers this?", "options": [{"text": "Default encryption at rest", "correct": false}, {"text": "CMEK (or Cloud EKM): disable or destroy the key version in Cloud KMS or the external key manager", "correct": true}, {"text": "Object versioning", "correct": false}, {"text": "Bucket lock", "correct": false}], "explain": "With customer-managed keys, revoking the key makes the data cryptographically inaccessible. Default encryption uses Google-managed keys you can't revoke."}, {"id": "q19", "domain": "security", "q": "Which is true of Cloud Audit Logs?", "options": [{"text": "All log types are on by default", "correct": false}, {"text": "Admin Activity logs are always on. Data Access logs are off by default except for BigQuery", "correct": true}, {"text": "Data Access logs can't be exported", "correct": false}, {"text": "Audit logs are only kept for 7 days", "correct": false}], "explain": "Admin Activity (and System Event) logs are always written. Data Access logs must be enabled per service (BigQuery is on by default) and can be expensive."}, {"id": "q20", "domain": "security", "q": "You must prove that only images built by your pipeline, with no critical CVEs, can run on GKE and Cloud Run in production. Which combination?", "options": [{"text": "Cloud Armor + Artifact Registry", "correct": false}, {"text": "Artifact Analysis scanning + Cloud Build provenance + a Binary Authorization policy", "correct": true}, {"text": "VPC Service Controls + IAM", "correct": false}, {"text": "Secret Manager + KMS", "correct": false}], "explain": "Binary Authorization enforces at deploy time that images have the required attestations or provenance. Scanning provides the CVE gate in the pipeline."}, {"id": "q21", "domain": "security", "q": "Which org policy constraint stops resources being created outside UK regions?", "options": [{"text": "iam.allowedPolicyMemberDomains", "correct": false}, {"text": "gcp.resourceLocations", "correct": true}, {"text": "compute.vmExternalIpAccess", "correct": false}, {"text": "constraints/storage.uniformBucketLevelAccess", "correct": false}], "explain": "`gcp.resourceLocations` limits where location-bound resources can be created. Domain-restricted sharing (`iam.allowedPolicyMemberDomains`) limits who can be granted access."}, {"id": "q22", "domain": "security", "q": "Before sending customer complaint text to an LLM for summarisation, the DPO requires that names, account numbers and card numbers be removed or tokenised. Which service is designed for this?", "options": [{"text": "Cloud KMS", "correct": false}, {"text": "Sensitive Data Protection (de-identification with infoTypes)", "correct": true}, {"text": "Secret Manager", "correct": false}, {"text": "Security Command Center", "correct": false}], "explain": "Sensitive Data Protection detects infoTypes and de-identifies them (masking, tokenisation, format-preserving encryption). Model Armor can also screen prompts for sensitive data at the model boundary."}, {"id": "q23", "domain": "compute", "q": "A containerized REST API has unpredictable, spiky traffic. There's no ops team, and it should cost nearly nothing at night. Where should it run?", "options": [{"text": "Compute Engine with a large VM", "correct": false}, {"text": "GKE Standard", "correct": false}, {"text": "Cloud Run", "correct": true}, {"text": "App Engine flexible", "correct": false}], "explain": "Cloud Run scales to zero, scales out quickly for spikes, and needs no infrastructure management."}, {"id": "q24", "domain": "compute", "q": "A Cloud Run service calling an LLM spends most of each request waiting on network I/O. It needs too many instances and costs too much. What change helps most?", "options": [{"text": "Lower concurrency to 1", "correct": false}, {"text": "Use async I/O and raise concurrency per instance", "correct": true}, {"text": "Switch to instance-based billing", "correct": false}, {"text": "Add more memory", "correct": false}], "explain": "I/O-bound work lets one instance serve many concurrent requests. Concurrency 1 is for CPU-bound or non-thread-safe code."}, {"id": "q25", "domain": "compute", "q": "Which workload is a poor fit for Spot VMs?", "options": [{"text": "CI build runners", "correct": false}, {"text": "Batch risk simulations with checkpointing", "correct": false}, {"text": "The primary database of a payments system", "correct": true}, {"text": "Stateless GKE batch node pools", "correct": false}], "explain": "Spot capacity can be reclaimed with 30 seconds' notice. Never run state you can't lose suddenl
