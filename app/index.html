te content, cache modes, and invalidation by path. Media CDN is built for large-scale streaming."}, {"id": "gcp-networking--cloud-armor", "domain": "gcp-networking", "term": "Cloud Armor", "tier": "core", "related": ["DDoS", "WAF", "Cloud Load Balancing"], "what": "Google's WAF and DDoS protection, enforced at Google's edge on external load balancers (and some internal ones).", "how": "Security policies are attached to backend services. Rules match on IP or CIDR, geography, headers and request attributes (in a CEL-like language) and **preconfigured WAF rules** (based on the OWASP Core Rule Set: SQL injection, cross-site scripting, local and remote file inclusion…). Other features: **rate limiting** (throttle or ban), **Adaptive Protection** (machine-learning detection of L7 DDoS, with suggested rules), **bot management** (reCAPTCHA), **edge security policies** (for CDN or bucket content), threat-intelligence lists, and *preview mode* to test rules before enforcing them.", "watch": "Cloud Armor protects things *behind a load balancer*. A VM with a public IP isn't covered."}, {"id": "gcp-networking--cloud-dns", "domain": "gcp-networking", "term": "Cloud DNS", "tier": "core", "related": ["DNS", "Hybrid DNS", "Private Service Connect"], "what": "Managed authoritative DNS with a 100% availability SLA. **Public zones** answer the internet. **Private zones** are visible only to the VPCs you authorize.", "how": "It also provides **forwarding zones** (send queries for `corp.bank.co.uk` to on-prem DNS servers), **peering zones** (resolve using another VPC's DNS view, the usual pattern with Shared VPC and hub networks), **inbound server policies** (an IP in your VPC that on-prem servers can forward queries to), **response policies** (override answers), **routing policies** (weighted, geolocation, failover with health checks), **DNSSEC** and **cross-project binding**.", "watch": "**Split-horizon** = the same name resolves to different answers inside and outside the network. Very common with private endpoints."}, {"id": "gcp-networking--hybrid-dns", "domain": "gcp-networking", "term": "Hybrid DNS", "tier": "working", "related": ["Cloud DNS", "Cloud Interconnect", "Private Google Access"], "what": "Making names resolve correctly in both directions between on-prem and GCP.", "how": "Cloud → on-prem: Cloud DNS **forwarding zones** to on-prem resolvers. On-prem → cloud: on-prem servers forward to a Cloud DNS **inbound server policy** IP. For private API access from on-prem, create private zones for `googleapis.com` that map to the `private` or `restricted` VIPs or to PSC endpoints, and advertise those IPs over BGP.", "watch": "Hybrid DNS is the most common reason \"PSC or PGA works from cloud VMs but not from on-prem\"."}, {"id": "gcp-networking--secure-web-proxy", "domain": "gcp-networking", "term": "Secure Web Proxy", "tier": "working", "related": ["Forward proxy", "Cloud NAT", "Egress control"], "what": "A managed, cloud-native **explicit forward proxy** for *egress* web traffic from workloads.", "how": "Policies allow or deny by source (secure tags, service accounts, IPs) and by destination host or URL, with optional **TLS inspection** using Certificate Authority Service. It logs every request.", "gcp": "It's the bank answer to \"servers may only call these approved external APIs (payment schemes, a market-data vendor)\". Cloud NAT alone can't filter by hostname."}, {"id": "gcp-networking--cloud-ids-and-packet-mirroring", "domain": "gcp-networking", "term": "Cloud IDS and Packet Mirroring", "tier": "aware", "related": ["Cloud NGFW", "VPC Flow Logs"], "what": "**Packet Mirroring** clones VM traffic to collectors for inspection. **Cloud IDS** is a managed intrusion *detection* service (Palo Alto threat signatures) that uses mirrored traffic and raises alerts but doesn't block. For in-line prevention, use Cloud NGFW Enterprise."}, {"id": "gcp-networking--vpc-flow-logs-and-firewall-rules-logging", "domain": "gcp-networking", "term": "VPC Flow Logs and Firewall Rules Logging", "tier": "working", "related": ["Network Intelligence Center", "Cloud Logging"], "what": "**VPC Flow Logs** sample network flows (5-tuple, bytes, packets, latency) per subnet or VM for troubleshooting, forensics and cost analysis. **Firewall Rules Logging** records which rule allowed or denied a connection.", "watch": "Both can generate a lot of log volume and cost. Tune the sampling rate and aggregation interval."}, {"id": "gcp-networking--network-intelligence-center", "domain": "gcp-networking", "term": "Network Intelligence Center", "tier": "working", "related": ["VPC Flow Logs", "ICMP and ping"], "what": "GCP's network diagnostics suite. **Connectivity Tests** (configuration analysis: \"why can't A reach B?\", naming the blocking route or firewall rule), **Network Topology** (a visual map with traffic), **Performance Dashboard** (packet loss and latency), **Firewall Insights** (shadowed, unused and overly permissive rules), **Network Analyzer** (detects misconfigurations automatically) and **Flow Analyzer**."}, {"id": "gcp-networking--gke-networking", "domain": "gcp-networking", "term": "GKE networking", "tier": "working", "related": ["Subnet secondary ranges", "Kubernetes Services", "Gateway API"], "what": "How Kubernetes networking maps onto a VPC. **VPC-native clusters** give Pods real VPC IPs from secondary ranges (alias IPs), so Pods are routable and reachable through firewall rules, peering and load balancers.", "how": "Plan three ranges: nodes (primary), Pods (secondary, usually large), Services (secondary). **Private clusters** have nodes with internal IPs only. The control plane is reached through a private endpoint (or a DNS-based endpoint) plus **authorized networks**. **GKE Dataplane V2** (eBPF, based on Cilium) enforces **network policies** and gives visibility. **Container-native load balancing** sends traffic straight to Pod IPs through NEGs. **Gateway API** is the modern way to configure GKE load balancers (it replaces Ingress).\nEgress from Pods to non-cluster destinations is **SNAT'd to the node IP** unless the **IP masquerade agent** config excludes the destination ranges (important when on-prem firewalls expect Pod IPs). In-cluster DNS is **kube-dns** (with **NodeLocal DNSCache** for performance) or **Cloud DNS for GKE**. **external-dns** can publish Service and Ingress names into Cloud DNS.", "watch": "IP exhaustion of the Pod range is a classic GKE scaling failure. Fixes are additional Pod ranges, smaller max-Pods-per-node, or non-RFC 1918 ranges."}, {"id": "gcp-networking--network-egress-costs", "domain": "gcp-networking", "term": "Network egress costs", "tier": "working", "related": ["Ingress and egress", "CDN", "Regions and zones"], "what": "Data *into* Google Cloud is free. Data *out* is billed: to the internet (per GB, tiered), between regions, and between zones (a small per-GB charge). Traffic within a zone over internal IPs is free. Interconnect egress is cheaper than internet egress.", "watch": "Chatty cross-region designs, streaming data across regions and serving big files without a CDN are hidden cost drivers. A single-region design with a cross-region DR copy usually costs far less than active-active."}, {"id": "gcp-networking--ip-address-planning-ipam", "domain": "gcp-networking", "term": "IP address planning (IPAM)", "tier": "working", "related": ["CIDR and subnetting", "GKE networking", "Private NAT"], "what": "Allocating non-overlapping ranges across on-prem, every VPC and every environment, with room to grow.", "gcp": "Use custom-mode VPCs, reserve large blocks per environment and region, keep GKE Pod ranges separate, use **internal ranges** resources to reserve space, and use Private NAT or PSC where overlaps can't be avoided. Banks usually get ranges from a central network team. Ask early."}, {"id": "identity-and-access--authentication-vs-authorization", "domain": "identity-and-access", "term": "Authentication vs authorization", "tier": "core", "related": ["IAM", "OAuth 2.0", "OpenID Connect"], "what": "**Authentication (authn)** proves *who you are*: passwords, keys, certificates, tokens, MFA. **Authorization (authz)** decides *what you may do*: roles, policies, ACLs.", "how": "Typically: authenticate once → receive a token → present the token on each call → the resource server checks the token, then checks policy.", "gcp": "Google identities authenticate through Google Sign-In or a federated IdP. Workloads authenticate with service account credentials. **IAM** handles authorization.", "watch": "HTTP **401** means \"not authenticated\" (missing or bad credentials). **403** means \"authenticated but not allowed\"."}, {"id": "identity-and-access--identity-provider-idp-and-single-sign-on-sso", "domain": "identity-and-access", "term": "Identity provider (IdP) and single sign-on (SSO)", "tier": "core", "related": ["SAML 2.0", "OpenID Connect", "Cloud Identity"], "what": "An **IdP** is the system of record that authenticates users (Microsoft Entra ID, Okta, Ping, Google). **SSO** lets users sign in once at the IdP and access many apps that trust it.", "gcp": "Banks usually keep Entra ID or Okta as the IdP. **Cloud Identity** holds the Google-side user and group objects (synced with **Google Cloud Directory Sync**, GCDS, or SCIM provisioning), and sign-in is federated back to the corporate IdP through SAML or OIDC. **Workforce Identity Federation** can skip the Google user objects altogether."}, {"id": "identity-and-access--saml-2-0", "domain": "identity-and-access", "term": "SAML 2.0", "tier": "working", "related": ["IdP and SSO", "OpenID Connect"], "what": "An XML-based standard for enterprise SSO. The IdP sends a signed **assertion** about the user to the **service provider (SP)**, usually through the browser.", "how": "The user hits the SP → is redirected to the IdP → authenticates → the IdP posts a signed SAML response back → the SP validates the signature and creates a session.", "gcp": "Used for SSO from corporate IdPs into Cloud Identity / Workspace, and as one option for Workforce Identity Federation."}, {"id": "identity-and-access--oauth-2-0", "domain": "identity-and-access", "term": "OAuth 2.0", "tier": "core", "related": ["OpenID Connect", "Access tokens", "Service accounts", "Apigee"], "what": "A framework for **delegated authorization**: a *client* app gets an **access token** to call a *resource server* on behalf of a *resource owner* (a user) or as itself, without handling the user's password.", "how": "Roles: resource owner, client, **authorization server** (issues tokens), resource server (the API). Grant types (flows): **authorization code + PKCE** (user-facing apps; the user consents in the browser and the client exchanges a short-lived code for tokens), **client credentials** (machine-to-machine, no user), **device code** (TVs and CLIs), plus **refresh tokens** for new access tokens without re-prompting. Tokens carry **scopes** (permission categories).", "gcp": "Google APIs accept OAuth 2.0 access tokens. Service accounts effectively use a client-credentials-style flow (signed JWT assertion → access token). Apigee acts as an OAuth authorization server for your own APIs. **FAPI** (the Financial-grade API profile) hardens OAuth for Open Banking.", "watch": "OAuth is *authorization*. Signing in users is OIDC, which is built on top of it."}, {"id": "identity-and-access--openid-connect-oidc", "domain": "identity-and-access", "term": "OpenID Connect (OIDC)", "tier": "core", "related": ["OAuth 2.0", "JWT", "ID token"], "what": "An identity layer on top of OAuth 2.0 that tells the client *who the user is*, through an **ID token** (a JWT).", "how": "Same flows as OAuth, with the `openid` scope. The ID token holds claims like `sub` (subject id), `email`, `iss` (issuer), `aud` (the intended client), `exp`. Discovery documents (`/.well-known/openid-configuration`) and **JWKS** endpoints publish the signing keys.", "gcp": "Google issues OIDC ID tokens to service accounts and users. Cloud Run, Cloud Run functions and IAP verify them. Workload Identity Federation accepts OIDC tokens from external IdPs (GitHub Actions, Azure, Kubernetes, GitLab)."}, {"id": "identity-and-access--jwt-json-web-token", "domain": "identity-and-access", "term": "JWT (JSON Web Token)", "tier": "core", "related": ["OpenID Connect", "OAuth 2.0", "IAP"], "what": "A compact token format: `base64url(header).base64url(payload).signature`. The payload holds **claims** (`iss`, `sub`, `aud`, `exp`, `iat`, plus custom claims).", "how": "It's **signed, not encrypted** by default: anyone can read the claims, but nobody can change them without breaking the signature. Verifiers check the signature with the issuer's public key (from JWKS), then check `exp`, `iss`, and that **`aud` matches themselves**.", "gcp": "IAP adds a signed JWT header (`x-goog-iap-jwt-assertion`) that backends should verify. Cloud Run ID tokens are JWTs with `aud` = the service URL.", "watch": "Skipping the `aud` check lets a token minted for service A be replayed against service B. Never put secrets in a JWT payload."}, {"id": "identity-and-access--access-tokens-id-tokens-and-refresh-tokens", "domain": "identity-and-access", "term": "Access tokens, ID tokens and refresh tokens", "tier": "core", "related": ["OAuth 2.0", "OpenID Connect", "Service account impersonation"], "what": "An **access token** authorizes calls to an API (for Google APIs it's usually opaque and lasts about 1 hour). An **ID token** asserts identity to a specific audience (a JWT). A **refresh token** is a long-lived credential used to get new access tokens.", "gcp": "You call Google APIs (Storage, BigQuery, Gemini) with an **access token** (`gcloud auth print-access-token`). You call **private Cloud Run services or IAP-protected apps** with an **ID token** whose audience is that service (`gcloud auth print-identity-token --audiences=URL`).", "watch": "Using the wrong token type for the target is the classic cause of \"401 from my Cloud Run service\"."}, {"id": "identity-and-access--api-keys", "domain": "identity-and-access", "term": "API keys", "tier": "working", "related": ["OAuth 2.0", "Apigee"], "what": "A simple string that identifies a *project or app*, not a principal. Used for quota and billing attribution on some Google APIs (Maps, some AI APIs through AI Studio).", "gcp": "Restrict keys by API and by caller (IP, referrer, app). Many enterprise APIs don't accept API keys at all, because they need IAM. In Apigee, API keys identify consumer apps, often combined with OAuth.", "watch": "An API key isn't strong authentication. Leaked keys are a common incident. Prefer IAM-based authentication."}, {"id": "identity-and-access--multi-factor-authentication-mfa-2-step-verification", "domain": "identity-and-access", "term": "Multi-factor authentication (MFA / 2-Step Verification)", "tier": "working", "related": ["IdP and SSO", "Zero trust"], "what": "Requiring two or more factors: something you know, have, or are. **Phishing-resistant** MFA (FIDO2 / WebAuthn security keys, passkeys) beats SMS and one-time codes.", "gcp": "Enforced through Cloud Identity 2SV or the federated IdP. Banks require MFA for all console and CLI access, and hardware keys for super admins and privileged roles."}, {"id": "identity-and-access--cloud-identity-google-workspace-and-super-admins", "domain": "identity-and-access", "term": "Cloud Identity, Google Workspace and super admins", "tier": "core", "related": ["IdP and SSO", "Organization"], "what": "**Cloud Identity** is Google's identity-as-a-service (users, groups, devices) without Workspace apps. Your GCP **Organization** resource is tied to a Cloud Identity or Workspace domain.", "how": "Users and groups are created manually, synced from AD/LDAP with **GCDS**, or provisioned through SCIM from Entra ID or Okta. **Super administrators** control the domain itself and can grant themselves anything in GCP.", "watch": "Keep a small number of super admins, with hardware MFA and no day-to-day use, and use separate break-glass accounts."}, {"id": "identity-and-access--workforce-identity-federation", "domain": "identity-and-access", "term": "Workforce Identity Federation", "tier": "working", "related": ["IdP and SSO", "Workload Identity Federation"], "what": "Lets *human users* from an external IdP (Entra ID, Okta, any OIDC or SAML IdP) access the GCP console and APIs **without** Google accounts in Cloud Identity.", "how": "You configure a workforce pool and provider. IdP attributes (groups, department) map to Google attributes. IAM grants use `principalSet://iam.googleapis.com/locations/global/workforcePools/POOL/group/GROUP`.", "watch": "Not every Google Cloud product supports workforce identities. Check before you choose it over synced Cloud Identity."}, {"id": "identity-and-access--principals", "domain": "identity-and-access", "term": "Principals", "tier": "core", "related": ["IAM roles", "Service accounts", "Groups"], "what": "The \"who\" in an IAM binding: `user:` (Google account), `group:` (Google group, **preferred**), `serviceAccount:`, `domain:` (everyone in a Cloud Identity / Workspace domain), `principal://` and `principalSet://` (federated identities from workforce or workload pools), `allAuthenticatedUsers` (any Google account, which is almost always wrong), and `allUsers` (anyone, so public).", "gcp": "The org policy **Domain Restricted Sharing** (`iam.allowedPolicyMemberDomains`) blocks granting access to identities outside your domains, including `allUsers`. Banks enforce it, with narrow exceptions."}, {"id": "identity-and-access--iam-roles-basic-predefined-and-custom", "domain": "identity-and-access", "term": "IAM roles: basic, predefined and custom", "tier": "core", "related": ["Principals", "IAM policy inheritance", "Least privilege"], "what": "A role is a collection of **permissions** (`service.resource.verb`, for example `bigquery.tables.getData`). **Basic roles** (Owner, Editor, Viewer) are broad and pre-date IAM, so avoid them in production. **Predefined roles** are curated per service by Google (`roles/storage.objectViewer`, `roles/aiplatform.user`). **Custom roles** are your own bundles, at org or project level, and you maintain them as services add permissions.", "how": "Permissions are fine-grained. Roles are what you grant. You can't grant a permission directly.", "watch": "Editor has thousands of permissions, so \"Editor on the project\" fails every least-privilege review."}, {"id": "identity-and-access--iam-policies-and-inheritance", "domain": "identity-and-access", "term": "IAM policies and inheritance", "tier": "core", "related": ["Resource hierarchy", "IAM deny policies", "Organization Policy"], "what": "An **allow policy** is attached to a resource (org, folder, project, or individual resource such as a bucket, topic, secret or BigQuery dataset) and holds **bindings**: role → list of principals, with an optional condition.", "how": "Effective access on a resource = the union of its own policy and every ancestor's. **Allow policies can only add.** You can't remove inherited access lower down; you'd need a **deny policy** or to remove it at the source. Policies are versioned and use etags for safe concurrent edits.", "watch": "Granting at the org or folder level is powerful and dangerous. A single folder-level BigQuery Admin grant covers hundreds of projects."}, {"id": "identity-and-access--iam-conditions", "domain": "identity-and-access", "term": "IAM Conditions", "tier": "working", "related": ["IAM policies", "Secure Tags", "Privileged Access Manager"], "what": "**CEL** expressions attached to a binding that must evaluate to true for the grant to apply.", "how": "They can match on request time (temporary access, business hours), resource name or type (only buckets starting with `prj-ml-`), resource **tags** (only resources tagged `env=dev`), and some request attributes.", "gcp": "\"Give the contractor access until Friday\" and \"this team can only act on resources tagged with their cost centre\" are condition use cases. Not every service and role supports conditions."}, {"id": "identity-and-access--iam-deny-policies", "domain": "identity-and-access", "term": "IAM deny policies", "tier": "working", "related": ["IAM policies", "Organization Policy"], "what": "Policies that explicitly **deny** specific permissions to principals, evaluated **before** allow policies. A deny always wins.", "how": "Attached at org, folder or project level, with exception principals (for example \"deny `iam.serviceAccountKeys.create` to everyone except the security group\").", "gcp": "Used for hard guardrails that no amount of allow grants can override."}, {"id": "identity-and-access--principal-access-boundary-pab", "domain": "identity-and-access", "term": "Principal access boundary (PAB)", "tier": "aware", "related": ["IAM deny policies", "VPC Service Controls"], "what": "Policies that limit *which resources* a principal is eligible to access at all (for example \"these identities can only ever access resources in our organization\"), whatever allow policies elsewhere say. A defence against cross-org data access."}, {"id": "identity-and-access--service-accounts", "domain": "identity-and-access", "term": "Service accounts", "tier": "core", "related": ["Application Default Credentials", "Service account impersonation", "Workload Identity Federation"], "what": "Non-human identities for workloads (`name@project.iam.gserviceaccount.com`). A service account is both a **principal** (it can be granted roles) and a **resource** (people can be granted the right to *use* or *impersonate* it).", "how": "Kinds: **user-managed** (you create them, one per workload), **default service accounts** (Compute Engine's `PROJECT_NUMBER-compute@…`, App Engine's), and **service agents** (Google-managed identities that services use to act in your project, `service-PROJECT_NUMBER@gcp-sa-SERVICE.iam.gserviceaccount.com`). You *attach* a service account to a VM, Cloud Run service, GKE workload or Cloud Build job. Deploying with a service account requires `iam.serviceAccountUser` on it, which is what stops privilege escalation.", "watch": "Default service accounts often have Editor. Banks disable automatic grants (`iam.automaticIamGrantsForDefaultServiceAccounts`) and require a dedicated, least-privilege service account per workload."}, {"id": "identity-and-access--service-account-keys", "domain": "identity-and-access", "term": "Service account keys", "tier": "core", "related": ["Service accounts", "Workload Identity Federation", "Organization Policy"], "what": "Downloadable JSON private keys that let anything, anywhere, act as the service account until the key is revoked.", "how": "They're long-lived (no expiry by default), easily copied into git, laptops and CI variables, and hard to audit.", "gcp": "Banks enforce the `iam.disableServiceAccountKeyCreation` and `iam.disableServiceAccountKeyUpload` org policies. The replacements are: attached service accounts (GCP workloads), **Workload Identity Federation** (external workloads) and **impersonation** (humans)."}, {"id": "identity-and-access--application-default-credentials-adc", "domain": "identity-and-access", "term": "Application Default Credentials (ADC)", "tier": "core", "related": ["Service accounts", "Metadata server", "Client libraries"], "what": "The lookup strategy Google client libraries use to find credentials automatically, so code never contains them.", "how": "In order: (1) the `GOOGLE_APPLICATION_CREDENTIALS` env var (a credential file: a key, an external-account config for WIF, or impersonation config); (2) the user's ADC file from `gcloud auth application-default login`; (3) the **metadata server** of the environment (the attached service account on GCE, GKE, Cloud Run and so on).", "gcp": "The same code runs on your laptop (your user credentials) and in Cloud Run (its service account) without changes."}, {"id": "identity-and-access--metadata-server", "domain": "identity-and-access", "term": "Metadata server", "tier": "working", "related": ["Application Default Credentials", "Service accounts"], "what": "An internal endpoint (`metadata.google.internal` / `169.254.169.254`) available to every VM, GKE node or Pod and serverless instance. It serves instance metadata and **short-lived access and ID tokens** for the attached service account.", "how": "Requests must include the header `Metadata-Flavor: Google`, which is a defence against some SSRF attacks.", "watch": "**SSRF** (server-side request forgery) bugs that let an attacker make the app fetch arbitrary URLs can leak tokens from the metadata server. Least-privilege service accounts limit the damage."}, {"id": "identity-and-access--service-account-impersonation-and-short-lived-credentials", "domain": "identity-and-access", "term": "Service account impersonation and short-lived credentials", "tier": "core", "related": ["Service accounts", "Privileged Access Manager", "Separation of duties"], "what": "A principal with `roles/iam.serviceAccountTokenCreator` on a service account can mint **short-lived** access tokens, ID tokens or signed JWTs *as* that service account, through the **IAM Service Account Credentials API**. No key needed.", "how": "`gcloud … --impersonate-service-account=SA`, or Terraform's `impersonate_service_account`. Tokens expire (about 1 hour by default). Audit logs record both the caller and the impersonated service account.", "gcp": "The standard pattern: humans hold almost no direct roles, and impersonate a deployment service account for privileged actions. That gives traceability and an easy revocation point."}, {"id": "identity-and-access--workload-identity-federation", "domain": "identity-and-access", "term": "Workload Identity Federation", "tier": "core", "related": ["Service account keys", "OpenID Connect", "Security Token Service"], "what": "Lets workloads *outside* Google Cloud (GitHub Actions, GitLab, Azure, AWS, on-prem Kubernetes, any OIDC or SAML IdP) access GCP **without service account keys**.", "how": "The external workload gets a token from its own IdP (for example GitHub's OIDC token for a workflow run) → Google's **Security Token Service** exchanges it for a federated token, checking the **workload identity pool / provider** configuration, its attribute mappings and its **attribute conditions** (for example `assertion.repository == 'bank/payments-api'`) → it optionally impersonates a service account, or uses direct resource access → calls the Google APIs.", "watch": "Attribute conditions are the security boundary. A pool that trusts \"any GitHub repo\" means anyone on GitHub. Always restrict to your org, repo and branch."}, {"id": "identity-and-access--workload-identity-federation-for-gke", "domain": "identity-and-access", "term": "Workload Identity Federation for GKE", "tier": "core", "related": ["Workload Identity Federation", "Kubernetes service accounts"], "what": "Maps a **Kubernetes service account** (namespace/name) to an IAM principal, so Pods get Google credentials from the GKE metadata server without keys.", "how": "You grant IAM roles directly to `principal://…/subject/ns/NAMESPACE/sa/KSA`, or bind the Kubernetes service account to impersonate a Google service account. Each workload gets its own identity instead of sharing the node's service account."}, {"id": "identity-and-access--identity-aware-proxy-iap", "domain": "identity-and-access", "term": "Identity-Aware Proxy (IAP)", "tier": "core", "related": ["Zero trust", "Context-aware access", "JWT"], "what": "A Google-managed reverse proxy that authenticates users and checks IAM **before** a request reaches your app (HTTPS) or VM (TCP).", "how": "**IAP for web apps** works on Application Load Balancer backends, App Engine and Cloud Run: users sign in with Google or a federated identity, IAP checks `roles/iap.httpsResourceAccessor` plus context-aware access levels, then forwards the request with a signed JWT header. **IAP TCP forwarding** handles SSH, RDP and other TCP to VMs without public IPs or bastions (firewall source `35.235.240.0/20`).", "gcp": "It's the fastest way to put an internal tool (for example an internal GenAI app for staff) behind corporate identity with no VPN. The backend should still verify the IAP JWT."}, {"id": "identity-and-access--zero-trust-and-beyondcorp", "domain": "identity-and-access", "term": "Zero trust and BeyondCorp", "tier": "core", "related": ["IAP", "Context-aware access", "mTLS"], "what": "A security model where **network location grants no trust**. Every request is authenticated, authorized and evaluated in context (user, device state, location, risk), at every hop.", "how": "It replaces \"on the corporate network = trusted\" with per-request identity-aware access, strong device identity, mTLS between services and least privilege. **BeyondCorp** is Google's internal implementation. **Chrome Enterprise Premium** (formerly BeyondCorp Enterprise) is the product.", "gcp": "IAP + Access Context Manager (users), service mesh mTLS + authorization policies (services), VPC-SC (data access), short-lived credentials."}, {"id": "identity-and-access--access-context-manager-and-access-levels", "domain": "identity-and-access", "term": "Access Context Manager and access levels", "tier": "working", "related": ["VPC Service Controls", "Context-aware access", "IAP"], "what": "Defines **access levels**: named conditions on request context such as source IP ranges, device policy (corporate-managed, encrypted, OS version; needs endpoint verification), geography and identity.", "gcp": "Access levels are used by **VPC Service Controls** (allowing access into a perimeter from approved contexts) and by **IAP / context-aware access** (allowing an app only from managed devices)."}, {"id": "identity-and-access--context-aware-access", "domain": "identity-and-access", "term": "Context-aware access", "tier": "working", "related": ["IAP", "Access Context Manager", "Zero trust"], "what": "Applying access levels to user access to the Google Cloud console and APIs, IAP-protected apps and Workspace, for example \"the console only from bank-managed devices on the corporate network\"."}, {"id": "identity-and-access--privileged-access-manager-pam", "domain": "identity-and-access", "term": "Privileged Access Manager (PAM)", "tier": "working", "related": ["Least privilege", "IAM Conditions", "Break-glass access"], "what": "**Just-in-time (JIT)**, time-bound privilege elevation. Users request an *entitlement* (a set of roles on a resource), optionally with justification and approval, and the grant expires automatically.", "gcp": "It replaces standing admin access (\"Owner forever\") with \"Owner for 2 hours after approval, fully audited\". It's a strong control for production access in regulated firms."}, {"id": "identity-and-access--least-privilege-separation-of-duties-and-break-glass-access", "domain": "identity-and-access", "term": "Least privilege, separation of duties and break-glass access", "tier": "core", "related": ["IAM roles", "Privileged Access Manager", "Policy Intelligence"], "what": "**Least privilege:** grant only the permissions needed, at the narrowest scope, for the shortest time. **Separation of duties (SoD):** no single person can complete a sensitive action end to end (for example the developer who writes code can't approve its prod deployment; the key admin can't read the data the key protects). **Break-glass:** emergency high-privilege access that is tightly controlled, alerted on and reviewed.", "gcp": "Separate the *KMS admin* and *KMS encrypter/decrypter* roles, separate the *network admin* (host project) from *app deployers* (service projects), require deployments through a pipeline service account, keep break-glass accounts with hardware keys and alert on every use through log-based alerts."}, {"id": "identity-and-access--policy-intelligence-recommender-analyzer-troubleshooter", "domain": "identity-and-access", "term": "Policy Intelligence (Recommender, Analyzer, Troubleshooter)", "tier": "working", "related": ["Least privilege", "IAM policies"], "what": "Tools to understand and shrink access. The **IAM role recommender** suggests removing permissions unused for 90 days. **Policy Analyzer** answers \"who can access this resource?\" and \"what can this principal access?\". **Policy Troubleshooter** explains why a specific access attempt was allowed or denied (allow, deny and PAB policies, conditions)."}, {"id": "identity-and-access--rbac-vs-abac", "domain": "identity-and-access", "term": "RBAC vs ABAC", "tier": "working", "related": ["IAM roles", "IAM Conditions"], "what": "**Role-based access control** grants permissions through roles assigned to identities. **Attribute-based access control** decides from attributes of the user, the resource and the context.", "gcp": "IAM is mainly RBAC, with ABAC added through **IAM Conditions** and **tags**. Kubernetes has its own RBAC (Roles and RoleBindings) for in-cluster access, which works alongside IAM."}, {"id": "identity-and-access--os-login", "domain": "identity-and-access", "term": "OS Login", "tier": "working", "related": ["IAP", "Service accounts"], "what": "Manages SSH access to Linux VMs through **IAM** (`roles/compute.osLogin` / `osAdminLogin`) instead of SSH keys in metadata. It supports 2FA and gives audit logs tied to identities.", "gcp": "Often enforced by org policy (`compute.requireOsLogin`). Combined with IAP TCP forwarding: no public IPs, no key sprawl, every session attributable."}, {"id": "identity-and-access--identity-platform-customer-identity", "domain": "identity-and-access", "term": "Identity Platform (customer identity)", "tier": "working", "related": ["OAuth 2.0", "OpenID Connect"], "what": "Customer identity and access management (CIAM) for *your app's end users*, not employees: sign-up and sign-in, social and enterprise IdPs, MFA, multi-tenancy, built on Firebase Authentication.", "watch": "Don't confuse it with Cloud Identity (employees and admins). Large banks usually have their own customer identity stack, but Identity Platform appears in greenfield designs."}, {"id": "identity-and-access--groups-and-access-reviews", "domain": "identity-and-access", "term": "Groups and access reviews", "tier": "working", "related": ["Principals", "Least privilege"], "what": "Grant roles to **groups** that map to job functions (`gcp-payments-dev@bank.com`), never to individuals. Then joiners, movers and leavers are handled by the identity team through group membership, and periodic **access reviews** look at groups, not thousands of bindings."}, {"id": "security-and-compliance--cia-triad", "domain": "security-and-compliance", "term": "CIA triad", "tier": "core", "related": ["Defense in depth", "Threat modeling"], "what": "The three security goals. **Confidentiality** (only authorized parties see data), **Integrity** (data isn't altered undetected), **Availability** (systems and data are usable when needed).", "how": "Every control serves at least one of them. Encryption and IAM serve confidentiality. Hashing, signatures and audit logs serve integrity. Redundancy and DDoS protection serve availability. Operational resilience regulation is largely about availability."}, {"id": "security-and-compliance--shared-responsibility-model", "domain": "security-and-compliance", "term": "Shared responsibility model", "tier": "core", "related": ["Compliance certifications", "Outsourcing (PRA SS2/21)"], "what": "Security duties are split between the cloud provider and the customer, and the split moves with the service model.", "how": "Google always secures the physical infrastructure, hardware, hypervisor and global network. For **IaaS** (Compute Engine) you own the OS, patching, apps, data, IAM and network configuration. For **PaaS / serverless** (Cloud Run, BigQuery) Google also handles the OS and runtime, and you own the code, data, IAM and configuration. For **SaaS**, mostly data and access. Google describes this as \"shared fate\": providing secure defaults, blueprints and guidance as well.", "watch": "**Your data, identities and configuration are always your responsibility.** Most cloud breaches are customer misconfigurations: public buckets, over-broad IAM, leaked keys."}, {"id": "security-and-compliance--defense-in-depth", "domain": "security-and-compliance", "term": "Defense in depth", "tier": "core", "related": ["Zero trust", "VPC Service Controls", "Organization Policy"], "what": "Layered, independent controls, so one failure doesn't mean a breach.", "gcp": "A typical stack: org policies (guardrails) → IAM least privilege + PAM (identity) → private networking + firewall policies + VPC-SC (network and data perimeter) → CMEK + Sensitive Data Protection (data) → Binary Authorization + vulnerability scanning (supply chain) → Cloud Armor (edge) → audit logs + Security Command Center (detection) → incident response."}, {"id": "security-and-compliance--threat-modeling", "domain": "security-and-compliance", "term": "Threat modeling", "tier": "working", "related": ["Defense in depth", "OWASP Top 10 for LLM apps"], "what": "Systematically asking \"what can go wrong?\" for a design. A common framework is **STRIDE**: **S**poofing (identity), **T**ampering (integrity), **R**epudiation (deniability → logs), **I**nformation disclosure, **D**enial of service, **E**levation of privilege.", "how": "Draw the data-flow diagram, mark the **trust boundaries** (where data crosses between zones, services or organizations), list threats at each crossing, and map each one to a control.", "gcp": "Bank architecture boards expect this. Trust boundaries in GCP designs: internet → load balancer, VPC → Google APIs (VPC-SC), project → project, your org → a third-party SaaS or model provider, user prompt → LLM → tools."}, {"id": "security-and-compliance--symmetric-vs-asymmetric-cryptography", "domain": "security-and-compliance", "term": "Symmetric vs asymmetric cryptography", "tier": "core", "related": ["TLS handshake", "Envelope encryption", "Digital signatures"], "what": "**Symmetric:** the same secret key encrypts and decrypts (for example AES-256-GCM). It's fast and used for bulk data. **Asymmetric:** a key pair (public and private; RSA, ECC/ECDSA, Ed25519). Data encrypted with the public key can only be decrypted with the private key, and signatures made with the private key are verified with the public key. It's slow, and used for key exchange, signatures and identity.", "how": "Real systems combine the two. Asymmetric crypto authenticates and agrees on a symmetric session key (TLS), or wraps a symmetric key (envelope encryption).", "gcp": "Cloud KMS supports symmetric keys (encrypt/decrypt), asymmetric signing keys, asymmetric decryption keys and MAC keys. Post-quantum signature algorithms are appearing too."}, {"id": "security-and-compliance--hashing-hmac-and-digital-signatures", "domain": "security-and-compliance", "term": "Hashing, HMAC and digital signatures", "tier": "core", "related": ["Symmetric vs asymmetric cryptography", "JWT", "Webhooks"], "what": "A **hash** (for example SHA-256) is a one-way, fixed-size fingerprint: any change to the input changes the hash. An **HMAC** is a hash keyed with a shared secret, proving integrity *and* that the sender knows the secret. A **digital signature** is a hash signed with a private key, proving integrity *and* origin, verifiable by anyone with the public key, and the signer can't deny it later.", "gcp": "Object checksums (CRC32C / MD5) in Cloud Storage, HMAC-signed webhooks, signed URLs (signatures), Binary Authorization attestations (signatures), JWTs (signatures).", "watch": "Store passwords with slow, salted hashes (bcrypt, scrypt, Argon2), never with plain SHA-256."}, {"id": "security-and-compliance--encryption-at-rest-default", "domain": "security-and-compliance", "term": "Encryption at rest (default)", "tier": "core", "related": ["Envelope encryption", "CMEK", "Cloud KMS"], "what": "All customer data stored in Google Cloud is encrypted at rest by default with AES-256, with no configuration, using Google-managed keys.", "how": "Data is split into chunks, each encrypted with a **data encryption key (DEK)**. DEKs are wrapped by **key encryption keys (KEKs)** held in Google's internal key management service, which is itself protected by a root key in hardware.", "watch": "\"Is it encrypted at rest?\" always has the answer yes. The real bank question is \"**who controls the key**, and can we revoke access?\". That's CMEK, Cloud HSM and EKM."}, {"id": "security-and-compliance--envelope-encryption", "domain": "security-and-compliance", "term": "Envelope encryption", "tier": "core", "related": ["Cloud KMS", "CMEK"], "what": "Encrypting data with a DEK, then encrypting (wrapping) the DEK with a KEK held in a key management service.", "how": "The encrypted data and the wrapped DEK are stored together. To read, you ask KMS to unwrap the DEK (an authorized, audited call), then decrypt locally. You get speed (bulk crypto happens locally), central control (the KEK never leaves KMS), and cheap rotation (re-wrap the DEKs, not the data).", "gcp": "It's how CMEK works across services. You can do it yourself in apps with KMS and Tink."}, {"id": "security-and-compliance--encryption-in-transit", "domain": "security-and-compliance", "term": "Encryption in transit", "tier": "core", "related": ["TLS", "mTLS", "Cloud Interconnect"], "what": "Protecting data as it moves.", "gcp": "User → Google: TLS to Google Front Ends. Between Google services: ALTS (mutual authentication + encryption). VM ↔ VM traffic inside Google's network: encrypted at the network layer when it leaves physical boundaries Google controls, plus your own TLS or mTLS if policy requires it. Hybrid: HA VPN (IPsec), MACsec on Interconnect, or application TLS.", "watch": "Banks typically mandate TLS 1.2+ end to end, including load balancer → backend. Plan backend certificates or a service mesh."}, {"id": "security-and-compliance--confidential-computing-encryption-in-use", "domain": "security-and-compliance", "term": "Confidential Computing (encryption in use)", "tier": "working", "related": ["Encryption at rest", "CIA triad"], "what": "Keeps data encrypted **in memory while being processed**, using hardware-based trusted execution environments (AMD SEV / SEV-SNP, Intel TDX, NVIDIA confidential GPUs), with remote **attestation** proving the environment's integrity.", "gcp": "Confidential VMs, Confidential GKE Nodes, Confidential Dataproc and **Confidential Space** (multi-party computation, where parties combine sensitive data without seeing each other's raw data, for example cross-bank fraud analytics)."}, {"id": "security-and-compliance--cloud-kms", "domain": "security-and-compliance", "term": "Cloud KMS", "tier": "core", "related": ["Envelope encryption", "CMEK", "Cloud HSM", "Cloud EKM"], "what": "Managed key management: create, rotate, disable and destroy cryptographic keys, and use them through API calls that are fully audited.", "how": "Hierarchy: **key ring** (a location-bound grouping) → **key** (with a purpose and rotation schedule) → **key versions** (the actual key material, one of which is primary). **Protection levels:** SOFTWARE, **HSM** (Cloud HSM, FIPS 140-2 Level 3 validated), **EXTERNAL** / EXTERNAL_VPC (Cloud EKM). Destroying a key version has a scheduled waiting period. IAM separates *admins* (`cloudkms.admin`: manage keys, can't use them) from *users* (`cloudkms.cryptoKeyEncrypterDecrypter`). **Autokey** automates CMEK key creation per resource. **Key import** lets you bring key material generated in your own HSM (wrapped for import), when policy requires keys to originate outside Google.", "watch": "Key rings and keys **can't be deleted** (only key versions can be destroyed), and the key's location must match the resource's location for CMEK."}, {"id": "security-and-compliance--cmek-customer-managed-encryption-keys", "domain": "security-and-compliance", "term": "CMEK (customer-managed encryption keys)", "tier": "core", "related": ["Cloud KMS", "Envelope encryption", "Crypto-shredding"], "what": "Services (BigQuery, Cloud Storage, Cloud SQL, AlloyDB, Spanner, Pub/Sub, GKE disks, the AI platform's resources, and many more) use **your Cloud KMS key** as the KEK for your data, instead of a Google-internal key.", "how": "You grant the *service agent* of each service `cryptoKeyEncrypterDecrypter` on your key. You control rotation, and **disabling or destroying the key makes the data unreadable**. All key use appears in audit logs. The org policy `gcp.restrictNonCmekServices` can force CMEK on chosen services.", "watch": "If you lose or destroy the key, the data is gone for good. Plan key lifecycle and break-glass access carefully."}, {"id": "security-and-compliance--csek-customer-supplied-encryption-keys", "domain": "security-and-compliance", "term": "CSEK (customer-supplied encryption keys)", "tier": "aware", "related": ["CMEK"], "what": "You supply raw key material with each API call (Cloud Storage and Compute Engine disks only). Google doesn't store the key. It's rarely used now: operationally painful, with CMEK/EKM preferred."}, {"id": "security-and-compliance--cloud-hsm", "domain": "security-and-compliance", "term": "Cloud HSM", "tier": "working", "related": ["Cloud KMS", "Cloud EKM"], "what": "Hardware security modules managed by Google, behind the Cloud KMS API (protection level HSM). Keys never leave the HSM in plaintext. FIPS 140-2 Level 3 validated. It's commonly required for payment and regulated workloads."}, {"id": "security-and-compliance--cloud-ekm-and-key-access-justifications", "domain": "security-and-compliance", "term": "Cloud EKM and Key Access Justifications", "tier": "working", "related": ["Cloud KMS", "Data sovereignty", "Access Approval"], "what": "**Cloud External Key Manager** uses keys that stay in a **third-party key manager outside Google** (Thales, Fortanix, Entrust and others), reached over the internet or a VPC. **Key Access Justifications (KAJ)** attach a reason code to every key-unwrap request, so your external key manager can approve or deny by policy (for example \"deny any request with justification 'Google-initiated access'\").", "gcp": "The strongest sovereignty posture: Google can't decrypt without your external system saying yes. The cost is extra latency and an availability dependency on the key manager."}, {"id": "security-and-compliance--key-rotation-and-crypto-shredding", "domain": "security-and-compliance", "term": "Key rotation and crypto-shredding", "tier": "working", "related": ["Cloud KMS", "Right to erasure"], "what": "**Rotation:** periodically creating a new primary key version, so new data uses new keys and the impact of any compromise is limited. Old versions stay available to decrypt old data. **Crypto-shredding:** destroying a key so all data encrypted under it becomes permanently unreadable, which is a way to \"delete\" data from backups and logs you can't otherwise purge.", "gcp": "KMS supports automatic rotation schedules for symmetric keys. Some services re-encrypt with the new version only on rewrite."}, {"id": "security-and-compliance--secret-manager", "domain": "security-and-compliance", "term": "Secret Manager", "tier": "core", "related": ["Cloud KMS", "Cloud Run", "Service accounts"], "what": "Managed storage for API keys, passwords, certificates and connection strings, as versioned **secrets** with per-secret IAM.", "how": "Each secret has versions (enable, disable, destroy). **Replication policy** is *automatic* (Google chooses) or *user-managed* (you pin regions, which matters for residency). There are also regional secrets, CMEK support, rotation *notifications* through Pub/Sub (you implement the rotation logic), expiry, and audit logs of every access. Cloud Run and GKE mount secrets as env vars or files. Workloads read them with `secretmanager.secretAccessor`.", "watch": "Pin versions in production deployments. Never bake secrets into images, env files committed to git, or Terraform state in plaintext."}, {"id": "security-and-compliance--certificate-authority-service", "domain": "security-and-compliance", "term": "Certificate Authority Service", "tier": "aware", "related": ["Certificates and PKI", "mTLS", "Secure Web Proxy"], "what": "A managed private CA (with HSM-backed CA keys) for issuing internal certificates at scale: service mesh, mTLS, devices, Secure Web Proxy TLS inspection."}, {"id": "security-and-compliance--vpc-service-controls-service-perimeters", "domain": "security-and-compliance", "term": "VPC Service Controls (service perimeters)", "tier": "core", "related": ["Network perimeter", "Access Context Manager", "Private Google Access", "Data exfiltration"], "what": "A **service perimeter** around a set of projects that controls access to **Google-managed APIs** (BigQuery, Cloud Storage, the AI platform, Spanner, Secret Manager, …). Requests that cross the perimeter are blocked, **even if IAM would allow them**. It's the main data-exfiltration control on GCP.", "how": "You list the **protected projects** and **restricted services**. Inside the perimeter, resources talk freely. A call from outside to a protected API is denied unless it matches an **access level** (IP, device) or an **ingress rule**. A call from inside to a resource *outside* (for example copying a BigQuery table into a personal project) is denied unless an **egress rule** allows it. Ingress and egress rules specify identities, source and destination projects, services and even methods. **Perimeter bridges** link perimeters. **Dry-run mode** logs violations without blocking. For VMs and on-prem traffic, route API calls to `restricted.googleapis.com` so only VPC-SC-supported APIs are reachable.", "gcp": "It's the answer to: \"a data scientist with valid credentials copies customer data to a bucket in their own project\", \"a stolen token is used from the internet\", \"a compromised VM sends data to an attacker's project\".", "watch": "It doesn't filter ordinary internet traffic (that's firewalls and Secure Web Proxy), and it doesn't replace IAM. Rollout breaks things in surprising ways (Cloud Build, Logging sinks, cross-project pipelines), so always start in dry-run."}, {"id": "security-and-compliance--organization-policy-service", "domain": "security-and-compliance", "term": "Organization Policy Service", "tier": "core", "related": ["IAM vs Org Policy", "Resource hierarchy", "Data residency"], "what": "Centralized **constraints** on what configurations are allowed, inherited down the hierarchy, whatever IAM says.", "how": "Constraints are **boolean** (enforce on or off) or **list** (allow or deny values). Policies can inherit, merge or replace the parent's. **Custom constraints** use CEL on resource fields. **Dry-run** shows impact before enforcing. **Custom organization policies** constrain any supported resource field with CEL (for example \"GKE clusters must enable Binary Authorization\"). Bank staples: `gcp.resourceLocations` (for example `in:europe-west2-locations`), `iam.allowedPolicyMemberDomains` (domain-restricted sharing), `iam.disableServiceAccountKeyCreation`, `compute.vmExternalIpAccess`, `compute.requireOsLogin`, `storage.publicAccessPrevention`, `storage.uniformBucketLevelAccess`, `sql.restrictPublicIp`, `gcp.restrictNonCmekServices`, `compute.restrictVpcPeering`, `run.allowedIngress`.", "watch": "Org policies apply to *new* configuration changes. They don't automatically fix existing violations, so pair them with Security Command Center findings."}, {"id": "security-and-compliance--security-command-center-scc", "domain": "security-and-compliance", "term": "Security Command Center (SCC)", "tier": "core", "related": ["Cloud Audit Logs", "Cloud Asset Inventory"], "what": "GCP's security and risk platform: asset inventory, **misconfiguration findings** (Security Health Analytics: public buckets, open firewall rules, keys in use, MFA gaps…), **threat detection** (Event Threat Detection on logs, Container Threat Detection, VM Threat Detection), Web Security Scanner, **posture management** (deploy and check policy sets against benchmarks such as CIS), attack path simulation, AI protection, and compliance reporting. It comes in Standard, Premium and Enterprise tiers.", "gcp": "Banks enable it at the org level and route findings to the SOC's SIEM (often Google Security Operations or Splunk) through Pub/Sub."}, {"id": "security-and-compliance--cloud-audit-logs", "domain": "security-and-compliance", "term": "Cloud Audit Logs", "tier": "core", "related": ["Cloud Logging", "Log sinks", "Non-repudiation"], "what": "Immutable records of \"who did what, where, when\". **Admin Activity** (configuration changes; always on, free, kept 400 days), **Data Access** (reading data or metadata, and writing data; **off by default except for BigQuery**, can be high volume and costs money), **System Event** (Google-initiated changes such as live migration; always on), **Policy Denied** (VPC-SC and other policy violations).", "how": "Each entry records the principal (`protoPayload.authenticationInfo.principalEmail`, including the impersonation chain), the method, the resource, the caller IP and user agent, and the status. They're stored in the `_Required` (locked) and `_Default` log buckets.", "gcp": "Banks enable Data Access logs for sensitive services (BigQuery, Cloud Storage, KMS, Secret Manager, the AI platform), route them through **aggregated sinks** to a central, locked logging project, and keep them for the retention their regulator requires."}, {"id": "security-and-compliance--log-sinks-aggregated-sinks-and-siem-integration", "domain": "security-and-compliance", "term": "Log sinks, aggregated sinks and SIEM integration", "tier": "working", "related": ["Cloud Audit Logs", "Cloud Logging", "Security Command Center"], "what": "A **sink** routes matching logs to a destination: a log bucket, BigQuery, Cloud Storage, Pub/Sub, or another project. **Aggregated sinks** at the org or folder level capture logs from every child project.", "gcp": "The pattern is an org-level aggregated sink → a central logging project (with a bucket lock or locked retention, and restricted access) + Pub/Sub → SIEM. **Google Security Operations** (formerly Chronicle) is Google's SIEM/SOAR."}, {"id": "security-and-compliance--access-transparency-and-access-approval", "domain": "security-and-compliance", "term": "Access Transparency and Access Approval", "tier": "working", "related": ["Cloud Audit Logs", "Cloud EKM", "Outsourcing (PRA SS2/21)"], "what": "**Access Transparency** gives near-real-time logs of actions *Google personnel* take on your content (for example a support engineer accessing data during a case), with a justification. **Access Approval** requires **your explicit approval** before Google personnel can access your content for supported services.", "gcp": "Both answer the outsourcing-risk question \"how do we know and control when the provider accesses our data?\". They typically need a qualifying support or Assured Workloads tier."}, {"id": "security-and-compliance--assured-workloads", "domain": "security-and-compliance", "term": "Assured Workloads", "tier": "working", "related": ["Data residency", "Organization Policy", "Access Approval"], "what": "A way to create folders pre-configured for a compliance regime. It applies org policies (allowed locations, allowed services), personnel and support controls (for example access only by staff in certain locations), key management requirements and monitoring for drift.", "gcp": "Regimes include US (FedRAMP, IL), EU (EU Data Boundary, sovereign controls) and others. Check what's currently offered for UK requirements. Many UK banks build equivalent controls themselves with org policies, CMEK/EKM and Access Approval."}, {"id": "security-and-compliance--data-residency-vs-data-sovereignty", "domain": "security-and-compliance", "term": "Data residency vs data sovereignty", "tier": "core", "related": ["Organization Policy", "Cloud EKM", "UK GDPR"], "what": "**Residency:** *where* data is physically stored and processed (for example only in UK regions). **Sovereignty:** *whose laws and control* the data is subject to, which covers residency **plus** who can access it (provider staff, foreign legal orders) and who controls the keys.", "how": "Residency tools: `gcp.resourceLocations` org policy, regional resources, user-managed replication for secrets, and regional AI endpoints with a matching ML processing location. Sovereignty tools add: CMEK/EKM with Key Access Justifications, Access Approval, Assured Workloads, and partner-operated sovereign clouds.", "watch": "Some services are *global* (IAM, parts of Cloud Logging metadata, some AI model endpoints). Check each service's data-location docs, because \"the region is London\" doesn't automatically mean every byte stays in London."}, {"id": "security-and-compliance--sensitive-data-protection-cloud-dlp", "domain": "security-and-compliance", "term": "Sensitive Data Protection (Cloud DLP)", "tier": "core", "related": ["Tokenisation and pseudonymisation", "UK GDPR", "Model Armor"], "what": "Discovers, classifies and de-identifies sensitive data: PII, financial data (card numbers, IBANs, sort codes), credentials and so on.", "how": "**Inspection** uses 150+ built-in **infoTypes** plus custom ones (regex, dictionaries) with likelihood scores. **De-identification** offers masking, redaction, bucketing, date shifting, **tokenisation / pseudonymisation** (deterministic encryption, **format-preserving encryption**, cryptographic hashing), with re-identification possible when the key is held. **Discovery** continuously profiles BigQuery, Cloud Storage and Cloud SQL and tags sensitivity levels.", "gcp": "Typical bank and AI use: redact PII from prompts and logs before they reach an LLM or analytics, tokenize customer IDs in the data lake, and find \"shadow\" PII in buckets."}, {"id": "security-and-compliance--tokenisation-and-pseudonymisation", "domain": "security-and-compliance", "term": "Tokenisation and pseudonymisation", "tier": "working", "related": ["Sensitive Data Protection", "PCI DSS", "UK GDPR"], "what": "Replacing a sensitive value with a non-sensitive substitute (a token). The mapping is held securely (vault-based) or derived cryptographically (vaultless, for example FPE). Pseudonymised data is still personal data under UK GDPR if it can be re-identified, but its risk is reduced.", "why": "It shrinks **PCI DSS scope** (systems that only see tokens hold no cardholder data) and allows analytics and ML on de-risked data."}, {"id": "security-and-compliance--shielded-vms", "domain": "security-and-compliance", "term": "Shielded VMs", "tier": "aware", "related": ["Compute Engine", "Confidential Computing"], "what": "VMs with verified boot integrity: **Secure Boot** (only signed bootloaders and kernels), a **vTPM** and **integrity monitoring** (alerts if the boot measurements change). On by default for most images."}, {"id": "security-and-compliance--binary-authorization", "domain": "security-and-compliance", "term": "Binary Authorization", "tier": "working", "related": ["Software supply chain security", "Cloud Build", "GKE", "Cloud Run"], "what": "A deploy-time policy check that only allows **trusted container images** to run on GKE or Cloud Run, for example images built by your Cloud Build pipeline, scanned with no critical CVEs and signed (**attested**) by approvers.", "how": "Policies require attestations (signatures by attestors using KMS keys) or check build provenance. It supports dry-run and break-glass."}, {"id": "security-and-compliance--software-supply-chain-security-slsa-sbom-artifact-analysis", "domain": "security-and-compliance", "term": "Software supply chain security (SLSA, SBOM, Artifact Analysis)", "tier": "working", "related": ["Binary Authorization", "CI/CD", "Artifact Registry"], "what": "Securing everything between source code and running software. **SLSA** (Supply-chain Levels for Software Artifacts) is a framework of levels for build integrity and **provenance** (a signed record of how and where an artifact was built). An **SBOM** (Software Bill of Materials) lists every component and dependency.", "gcp": "Cloud Build generates SLSA provenance. **Artifact Analysis** scans images in Artifact Registry for OS and language-package CVEs (on push and continuously). Binary Authorization enforces provenance and attestations. **Assured Open Source Software** provides Google-vetted packages."}, {"id": "security-and-compliance--vulnerability-management", "domain": "security-and-compliance", "term": "Vulnerability management", "tier": "working", "related": ["Software supply chain security", "Security Command Center"], "what": "Finding, prioritizing and fixing weaknesses (CVEs, scored by CVSS) in OS packages, libraries and images, within defined SLAs.", "gcp": "Artifact Analysis (images), VM Manager (OS patch compliance and patch jobs), GKE auto-upgrades and release channels, SCC findings, Web Security Scanner (web app vulnerabilities like XSS)."}, {"id": "security-and-compliance--incident-response", "domain": "security-and-compliance", "term": "Incident response", "tier": "working", "related": ["Cloud Audit Logs", "Security Command Center", "Break-glass access"], "what": "The process of detecting, containing, eradicating and recovering from security incidents, then learning from them.", "gcp": "Contain by revoking access (disable a service account, remove IAM bindings, disable or rotate keys), isolate VMs (firewall tags), and snapshot disks for forensics. Investigate with audit logs and Log Analytics. Run tested playbooks. Banks also have regulatory notification duties (for example to the ICO within 72 hours for personal data breaches, plus PRA/FCA notifications for material incidents)."}, {"id": "security-and-compliance--compliance-certifications-and-attestations", "domain": "security-and-compliance", "term": "Compliance certifications and attestations", "tier": "working", "related": ["Shared responsibility model", "PCI DSS"], "what": "Independent audits showing the provider's controls: **ISO 27001** (information security management), 27017 (cloud security), 27018 (cloud privacy), **SOC 1/2/3** (controls reports), **PCI DSS** (card data), plus regional and sector schemes.", "gcp": "The **Compliance Reports Manager** gives you Google's reports. They cover *Google's* side of the shared responsibility model. You still have to evidence your own controls for your workloads."}, {"id": "security-and-compliance--penetration-testing-on-gcp", "domain": "security-and-compliance", "term": "Penetration testing on GCP", "tier": "aware", "related": ["Incident response", "CBEST"], "what": "You may pen-test *your own* GCP resources without notifying Google, within the Acceptable Use Policy and Terms of Service (no attacks on Google's infrastructure or other customers, no DoS testing)."}, {"id": "compute-and-containers--virtualization-and-the-hypervisor", "domain": "compute-and-containers", "term": "Virtualization and the hypervisor", "tier": "working", "related": ["Compute Engine", "Containers"], "what": "A **hypervisor** runs several isolated virtual machines on one physical host, each with its own kernel and OS. It gives strong isolation, and VMs boot in tens of seconds.", "gcp": "Compute Engine runs on a KVM-based hypervisor with hardware offload (Titanium). **Live migration** moves running VMs between hosts during maintenance without rebooting them (except GPU and some specialized VMs, which stop for maintenance)."}, {"id": "compute-and-containers--compute-engine-vms", "domain": "compute-and-containers", "term": "Compute Engine (VMs)", "tier": "core", "related": ["Machine families", "Persistent Disk", "Managed Instance Groups"], "what": "IaaS virtual machines. You choose CPU, memory, disk, image, network and service account, and you own the OS and everything above it.", "how": "Zonal resource. Key settings: machine type, boot image, disks, network interfaces (multi-NIC for appliances), service account + access scopes, metadata (startup scripts, OS Login), availability policy (live migrate or terminate on maintenance, automatic restart), **sole-tenant nodes** (dedicated hosts for licensing or isolation), reservations.", "gcp": "Use it for lift-and-shift, commercial software that needs a VM, licensing-bound workloads, special hardware, or anything needing kernel or OS control."}, {"id": "compute-and-containers--machine-families", "domain": "compute-and-containers", "term": "Machine families", "tier": "working", "related": ["Compute Engine", "GPUs and TPUs"], "what": "Families tuned for different workloads. **General purpose:** E2 (cost-optimised), N2/N2D/N4 (balanced), C4A/T2A (Arm). **Compute-optimised:** C3/C4, H3. **Memory-optimised:** M3/M4 (SAP HANA, huge in-memory DBs). **Accelerator-optimised:** A3/A4 (NVIDIA H100/H200/B200), G2 (L4 GPUs). **Storage-optimised:** Z3. **Custom machine types** let you pick exact vCPU and memory (E2/N-series).", "watch": "Not every family is in every zone. Check availability in europe-west2 early for GPUs."}, {"id": "compute-and-containers--persistent-disk-hyperdisk-and-local-ssd", "domain": "compute-and-containers", "term": "Persistent Disk, Hyperdisk and Local SSD", "tier": "working", "related": ["Block storage", "Snapshots"], "what": "Block storage for VMs. **Persistent Disk** (pd-standard, pd-balanced, pd-ssd) is durable, network-attached, zonal or **regional** (synchronously replicated across two zones for HA). **Hyperdisk** is the newer generation, with performance (IOPS and throughput) provisioned separately from capacity. **Local SSD** is physically attached, very fast, and **ephemeral**: the data is lost when the VM stops or is deleted.", "watch": "Never keep anything you can't lose on Local SSD."}, {"id": "compute-and-containers--images-snapshots-machine-images-and-instance-templates", "domain": "compute-and-containers", "term": "Images, snapshots, machine images and instance templates", "tier": "working", "related": ["Compute Engine", "Managed Instance Groups", "Backup and PITR"], "what": "**Image:** a bootable disk template (public images, or your own \"golden\" hardened images, often built with Packer). **Snapshot:** an incremental, point-in-time backup of a disk, stored regionally or multi-regionally, and schedulable. **Machine image:** a whole VM (config + all disks) for cloning or backup. **Instance template:** an immutable VM configuration used by MIGs.", "gcp": "Banks typically maintain hardened golden images (CIS benchmarks), restrict which images can be used with the org policy `compute.trustedImageProjects`, and use snapshot schedules for backups."}, {"id": "compute-and-containers--managed-instance-groups-migs", "domain": "compute-and-containers", "term": "Managed Instance Groups (MIGs)", "tier": "core", "related": ["Autoscaling", "Health checks", "Cloud Load Balancing"], "what": "A fleet of identical VMs created from an instance template and managed as one.", "how": "**Autoscaling** (on CPU, load-balancer serving capacity, Cloud Monitoring metrics, or schedules), **autohealing** (recreates VMs that fail an application health check), **rolling updates** and canaries (`max surge` / `max unavailable`), **regional MIGs** (spread across zones for HA), stateful MIGs (keep disks and IPs for stateful apps).", "gcp": "The VM equivalent of a Kubernetes Deployment. It's the backbone of lift-and-shift HA designs behind load balancers."}, {"id": "compute-and-containers--spot-vms", "domain": "compute-and-containers", "term": "Spot VMs", "tier": "core", "related": ["Pricing models", "Batch", "GKE node pools"], "what": "Spare capacity at a large discount (often 60–91% off) that Google can **reclaim at any time**, with a 30-second warning. No minimum or maximum runtime. (Preemptible VMs were the older version, limited to 24 hours.)", "gcp": "Good for fault-tolerant batch work, CI runners, stateless GKE node pools, rendering, and some ML training with checkpointing. Never for databases or anything that can't tolerate sudden loss."}, {"id": "compute-and-containers--gpus-and-tpus", "domain": "compute-and-containers", "term": "GPUs and TPUs", "tier": "working", "related": ["Machine families", "AI Hypercomputer", "Training vs inference"], "what": "**GPUs** (NVIDIA L4, A100, H100/H200, B200…) are general accelerators for ML training and inference, graphics and simulation. **TPUs** are Google's custom ML accelerators (v5e, v5p, v6e Trillium and newer), very efficient for large-scale training and serving, especially with JAX or TensorFlow and increasingly PyTorch.", "how": "Attached to VMs, GKE node pools, Cloud Run (GPUs), and the AI platform's training and prediction. Capacity is scarce: use **reservations**, **Dynamic Workload Scheduler** (queue for capacity, flex-start) or committed use.", "watch": "Most bank GenAI work *consumes* hosted models (Gemini, Claude through Model Garden) and needs no GPUs. GPUs matter when you self-host open models or fine-tune."}, {"id": "compute-and-containers--containers", "domain": "compute-and-containers", "term": "Containers", "tier": "core", "related": ["Container images", "Kubernetes", "Cloud Run"], "what": "A process (or a few) isolated using kernel features: **namespaces** (its own view of processes, network and filesystem) and **cgroups** (CPU and memory limits), packaged with everything it needs to run. They share the host kernel, so they're lighter and start faster than VMs, but isolation is weaker.", "how": "Build once, run anywhere: the same image runs on a laptop, Cloud Run, GKE or another cloud, which is why containers count as a portability and exit-strategy lever.", "gcp": "Cloud Run adds a gVisor sandbox (gen1) or a microVM (gen2 execution environment) for stronger isolation. GKE Sandbox (gVisor) is available for untrusted workloads."}, {"id": "compute-and-containers--container-images-and-registries", "domain": "compute-and-containers", "term": "Container images and registries", "tier": "core", "related": ["Artifact Registry", "Binary Authorization", "Software supply chain security"], "what": "An image is a stack of read-only **layers** plus metadata (entrypoint, env), following the **OCI** standard. It's referenced by **tag** (`:v1.2`, mutable) or **digest** (`@sha256:…`, immutable).", "gcp": "**Artifact Registry** stores container images and language packages (Maven, npm, Python, Go, apt/yum), regional or multi-regional, with IAM, vulnerability scanning, cleanup policies, and remote/virtual repositories (proxy and cache public registries such as Docker Hub and PyPI, important for controlled egress in banks).", "watch": "Deploy by **digest** for reproducibility. Tags can be moved to point at different content."}, {"id": "compute-and-containers--kubernetes-architecture", "domain": "compute-and-containers", "term": "Kubernetes architecture", "tier": "core", "related": ["GKE", "Pods", "Deployments", "Services"], "what": "An open-source system for running containers across a cluster of machines, using **declarative desired state** and continuous reconciliation.", "how": "**Control plane:** the **API server** (everything goes through it), **etcd** (the state store), the **scheduler** (places Pods on nodes), **controllers** (loops that drive actual state towards desired state). **Nodes:** the **kubelet** (runs Pods), a container runtime (containerd), kube-proxy or eBPF (Service networking). You `kubectl apply` YAML manifests and controllers make it so.", "gcp": "GKE runs the control plane for you (and, in Autopilot, the nodes too)."}, {"id": "compute-and-containers--pods-replicasets-and-deployments", "domain": "compute-and-containers", "term": "Pods, ReplicaSets and Deployments", "tier": "core", "related": ["Kubernetes architecture", "Services", "Autoscaling"], "what": "A **Pod** is the smallest deployable unit: one or more containers sharing a network namespace (one IP) and volumes, scheduled together. A **ReplicaSet** keeps N identical Pods running. A **Deployment** manages ReplicaSets to give declarative **rolling updates** and rollbacks.", "watch": "Pods are disposable. They get new IPs when recreated, which is why Services exist."}, {"id": "compute-and-containers--kubernetes-services", "domain": "compute-and-containers", "term": "Kubernetes Services", "tier": "core", "related": ["Pods", "GKE networking", "Service discovery"], "what": "A stable virtual IP and DNS name in front of a changing set of Pods (selected by labels).", "how": "Types: **ClusterIP** (internal only, the default), **NodePort** (a port on every node), **LoadBalancer** (provisions a cloud load balancer; on GKE an L4 passthrough NLB, internal or external), **Headless** (no virtual IP; DNS returns the Pod IPs, used with StatefulSets).", "gcp": "For HTTP(S), use **Gateway API** or Ingress on top of Services, which provisions Application Load Balancers with container-native NEGs."}, {"id": "compute-and-containers--ingress-and-gateway-api", "domain": "compute-and-containers", "term": "Ingress and Gateway API", "tier": "working", "related": ["Kubernetes Services", "Cloud Load Balancing", "Ingress and egress"], "what": "Kubernetes APIs for **L7 routing into the cluster**. **Ingress** is the older, limited API. **Gateway API** is the newer, role-oriented one: *GatewayClass* (infrastructure provider), *Gateway* (owned by the platform team), *HTTPRoute* (owned by app teams), with traffic splitting, header matching and cross-namespace routing.", "gcp": "The GKE Gateway controller provisions global or regional, external or internal Application Load Balancers from Gateway resources. It supports multi-cluster Gateways for multi-region."}, {"id": "compute-and-containers--statefulsets-daemonsets-jobs-and-cronjobs", "domain": "compute-and-containers", "term": "StatefulSets, DaemonSets, Jobs and CronJobs", "tier": "working", "related": ["Pods", "Persistent volumes"], "what": "**StatefulSet:** Pods with stable identities (`db-0`, `db-1`) and their own persistent volumes, for databases and quorum systems. **DaemonSet:** one Pod per node (log agents, security agents). **Job:** run to completion. **CronJob:** scheduled Jobs.", "watch": "Running databases on Kubernetes is possible but operationally heavy. Banks usually prefer managed databases."}, {"id": "compute-and-containers--configmaps-and-kubernetes-secrets", "domain": "compute-and-containers", "term": "ConfigMaps and Kubernetes Secrets", "tier": "working", "related": ["Secret Manager", "Workload Identity Federation for GKE"], "what": "**ConfigMaps** inject non-secret configuration. **Secrets** inject sensitive values, but they're only base64-encoded, and stored in etcd (encrypted at rest on GKE, with optional application-layer encryption using Cloud KMS).", "gcp": "Prefer **Secret Manager**, accessed through Workload Identity or the Secret Manager CSI driver / add-on, so secrets have central IAM, audit and rotation."}, {"id": "compute-and-containers--namespaces-resource-requests-and-limits", "domain": "compute-and-containers", "term": "Namespaces, resource requests and limits", "tier": "working", "related": ["GKE Autopilot", "Autoscaling"], "what": "**Namespaces** divide a cluster for teams or environments (scoping RBAC, quotas and network policies). **Requests** are what a Pod is guaranteed and scheduled on. **Limits** are the maximum it may use (exceeding the memory limit gets the container OOM-killed; CPU is throttled).", "gcp": "GKE Autopilot **bills by Pod requests**, so right-sizing requests is cost control."}, {"id": "compute-and-containers--autoscaling-hpa-vpa-cluster-autoscaler", "domain": "compute-and-containers", "term": "Autoscaling: HPA, VPA, cluster autoscaler", "tier": "working", "related": ["Autoscaling concepts", "Managed Instance Groups", "Cloud Run"], "what": "**Horizontal Pod Autoscaler (HPA):** changes the replica count based on CPU, memory or custom/external metrics (for example Pub/Sub backlog). **Vertical Pod Autoscaler (VPA):** recommends or sets requests. **Cluster autoscaler / node auto-provisioning:** adds or removes nodes when Pods can't be scheduled or nodes sit idle.", "watch": "HPA and VPA acting on the same metric for the same Pods fight each other."}, {"id": "compute-and-containers--probes-liveness-readiness-and-startup", "domain": "compute-and-containers", "term": "Probes: liveness, readiness and startup", "tier": "working", "related": ["Health checks", "Pods"], "what": "**Readiness:** is the Pod ready for traffic? (Failing removes it from Service endpoints.) **Liveness:** is it stuck? (Failing restarts the container.) **Startup:** give slow starters time before liveness checks begin.", "watch": "A liveness probe that checks a database restarts all your Pods when the database blips, turning a partial outage into a full one."}, {"id": "compute-and-containers--gke-standard-vs-autopilot", "domain": "compute-and-containers", "term": "GKE Standard vs Autopilot", "tier": "core", "related": ["Kubernetes architecture", "Spot VMs"], "what": "**Autopilot:** Google manages the nodes, scaling, security hardening and upgrades. You deploy Pods and pay for their requested resources. This is the default recommendation. **Standard:** you manage node pools (machine types, GPUs, autoscaling, upgrades) and pay per node.", "how": "Both have a Google-managed control plane with an SLA. Both support **regional** clusters (control plane and nodes across 3 zones), **release channels** (Rapid, Regular, Stable, Extended) and maintenance windows and exclusions.", "gcp": "Choose Standard when you need node-level control: specific GPUs or TPUs, special kernels, privileged DaemonSets, or bin-packing tuned for cost."}, {"id": "compute-and-containers--service-mesh-and-sidecars", "domain": "compute-and-containers", "term": "Service mesh and sidecars", "tier": "working", "related": ["mTLS", "Zero trust", "Observability"], "what": "An infrastructure layer for service-to-service traffic. A proxy (usually **Envoy**) sits beside each workload as a **sidecar**, or as a node-level or ambient proxy, and handles **mTLS**, retries, timeouts, traffic splitting and authorization policies, and produces uniform telemetry, without code changes. **Istio** is the main open-source mesh.", "gcp": "**Cloud Service Mesh** (managed Istio / Traffic Director) for GKE, VMs and Cloud Run. It gives automatic workload identity certificates, SLO-ready golden-signal metrics, and authorization policies like \"only payments-api may call ledger-api\"."}, {"id": "compute-and-containers--helm-kustomize-and-fleets", "domain": "compute-and-containers", "term": "Helm, Kustomize and fleets", "tier": "aware", "related": ["GitOps", "Infrastructure as code"], "what": "**Helm:** a package manager for Kubernetes (templated \"charts\"). **Kustomize:** template-free overlays per environment. **Fleets (GKE Enterprise):** manage many clusters as one: Config Sync (GitOps), Policy Controller (OPA Gatekeeper constraints), multi-cluster ingress or gateway, and Cloud Service Mesh."}, {"id": "compute-and-containers--cloud-run-services", "domain": "compute-and-containers", "term": "Cloud Run services", "tier": "core", "related": ["Serverless", "Cold starts", "Concurrency", "Serverless VPC Access"], "what": "Fully managed, request-driven containers. Give it an image (or source), and it serves HTTPS with autoscaling, including **to zero**.", "how": "Key concepts: **revisions** (immutable code + config) and **traffic splitting** across them with tags; **concurrency** (requests per instance, default 80, up to 1000); **min/max instances**; **CPU allocation** (request-based, or instance-based \"always on\"); request **timeout** up to 60 minutes; **startup CPU boost**; **gen2 execution environment** (full Linux compatibility, network file systems); multi-container **sidecars**; **volume mounts** (Cloud Storage FUSE, NFS, in-memory, secrets); **GP
