Us**; **ingress settings** (all / internal / internal + load balancer); IAM authentication (`roles/run.invoker`); **Direct VPC egress**; HTTP/2 and gRPC, WebSockets and server-sent events; **service identity** (its service account); regional deployment (use a load balancer for multi-region).", "gcp": "The default runtime for APIs, web apps, AI agents and backends-for-frontends. Common in bank GenAI stacks for orchestrators, tools and MCP servers."}, {"id": "compute-and-containers--cloud-run-jobs-and-worker-pools", "domain": "compute-and-containers", "term": "Cloud Run jobs and worker pools", "tier": "working", "related": ["Batch", "Cloud Scheduler", "Workflows"], "what": "**Jobs:** containers that run to completion, with parallel **tasks** (each gets an index), retries, and up to days of runtime. Used for batch, ETL, migrations and scheduled work through Cloud Scheduler. **Worker pools:** always-on, non-HTTP background workers (for example pulling from Pub/Sub or Kafka)."}, {"id": "compute-and-containers--cloud-run-functions", "domain": "compute-and-containers", "term": "Cloud Run functions", "tier": "working", "related": ["Eventarc", "Serverless"], "what": "Functions-as-a-service (formerly Cloud Functions, now built on Cloud Run). Write a function, and it's triggered by HTTP or by events (Pub/Sub, Cloud Storage, Firestore, audit-log events through Eventarc).", "gcp": "Good for small glue code. Anything bigger or longer-lived fits better as a Cloud Run service."}, {"id": "compute-and-containers--cold-starts", "domain": "compute-and-containers", "term": "Cold starts", "tier": "core", "related": ["Cloud Run services", "Autoscaling concepts"], "what": "Extra latency when a new instance has to start (pull the image, start the runtime, run initialization) before serving a request. It happens when scaling from zero or during sharp scale-out.", "how": "Mitigations: **min instances** (always-warm capacity, which you pay for), smaller images, lazy initialization, startup CPU boost, language and runtime choice (Go is faster than JVM without tuning), and connection reuse.", "watch": "Large Python AI images (with torch, for example) can take tens of seconds to cold start. Keep heavy model work in hosted endpoints."}, {"id": "compute-and-containers--concurrency-requests-per-instance", "domain": "compute-and-containers", "term": "Concurrency (requests per instance)", "tier": "core", "related": ["Cloud Run services", "Cold starts"], "what": "How many requests one instance handles at the same time. A higher setting means fewer instances and lower cost, but the code must be thread-safe or async and stay within per-instance memory.", "watch": "LLM-calling services are I/O-bound (they wait on the model), so high concurrency with async code is very efficient. CPU-bound work (local inference, PDF parsing) needs low concurrency."}, {"id": "compute-and-containers--serverless", "domain": "compute-and-containers", "term": "Serverless", "tier": "core", "related": ["Cloud Run", "BigQuery", "Pub/Sub", "Firestore"], "what": "No servers to provision or manage, automatic scaling (often to zero), and paying for use rather than capacity.", "gcp": "Compute (Cloud Run, functions), data (BigQuery, Firestore, Spanner with autoscaling), messaging (Pub/Sub, Eventarc), orchestration (Workflows), AI (Gemini APIs).", "watch": "Serverless doesn't mean limitless. There are quotas, concurrency limits and downstream bottlenecks (databases) to plan for."}, {"id": "compute-and-containers--autoscaling-concepts-horizontal-vs-vertical", "domain": "compute-and-containers", "term": "Autoscaling concepts (horizontal vs vertical)", "tier": "core", "related": ["Managed Instance Groups", "HPA", "Cloud Run services"], "what": "**Horizontal** scaling adds or removes instances: needs stateless design, a load balancer, and has effectively no ceiling. **Vertical** scaling gives an instance more CPU and RAM: simple, limited by the largest machine, and often needs a restart.", "how": "Autoscalers act on signals (CPU, requests, queue depth, custom metrics), with cooldowns or stabilization to avoid flapping. Predictive autoscaling uses history.", "watch": "Scaling the stateless tier just moves the bottleneck to the database. Design both tiers together."}, {"id": "compute-and-containers--stateless-vs-stateful-services", "domain": "compute-and-containers", "term": "Stateless vs stateful services", "tier": "core", "related": ["Autoscaling concepts", "Cloud Run services", "Caching"], "what": "A **stateless** service keeps no client state between requests (state lives in a DB, cache or token), so any instance can serve any request, and scaling and failover are trivial. A **stateful** service keeps state locally (sessions in memory, local files, a database engine), which makes scaling, failover and deployment harder.", "watch": "Cloud Run instances can disappear at any time. Store conversation and agent session state in Firestore, Memorystore, AlloyDB or Agent Runtime sessions, never in instance memory."}, {"id": "compute-and-containers--twelve-factor-app", "domain": "compute-and-containers", "term": "Twelve-factor app", "tier": "working", "related": ["Stateless vs stateful services", "Containers"], "what": "Principles for cloud-native apps: config in the environment, backing services as attached resources, stateless processes, port binding, disposability (fast start, graceful shutdown on SIGTERM), dev/prod parity, logs as event streams to stdout, and more.", "gcp": "Cloud Run, GKE and Cloud Logging assume these principles."}, {"id": "compute-and-containers--app-engine", "domain": "compute-and-containers", "term": "App Engine", "tier": "aware", "related": ["Cloud Run services"], "what": "Google's original PaaS (standard environment: sandboxed runtimes; flexible environment: containers on VMs). It still runs many legacy apps, but **Cloud Run is the recommended choice for new work**."}, {"id": "compute-and-containers--batch", "domain": "compute-and-containers", "term": "Batch", "tier": "aware", "related": ["Cloud Run jobs", "Spot VMs"], "what": "A managed batch scheduler that provisions VMs (including Spot and GPUs) to run containerized or script jobs at scale, then tears them down. Used for HPC, risk simulations and large data jobs."}, {"id": "compute-and-containers--google-cloud-vmware-engine-and-bare-metal-solution", "domain": "compute-and-containers", "term": "Google Cloud VMware Engine and Bare Metal Solution", "tier": "aware", "related": ["Migration strategies (7 Rs)"], "what": "**VMware Engine:** a dedicated VMware SDDC (vSphere, vSAN, NSX) running in Google Cloud, so VMware estates can be lifted without re-platforming. **Bare Metal Solution:** dedicated physical servers near Google regions for workloads like Oracle RAC that can't be virtualized or need special licensing."}, {"id": "compute-and-containers--developer-environments-cloud-shell-cloud-workstations", "domain": "compute-and-containers", "term": "Developer environments (Cloud Shell, Cloud Workstations)", "tier": "aware", "related": ["VPC Service Controls"], "what": "**Cloud Shell:** a free, ephemeral browser terminal with tools pre-installed. **Cloud Workstations:** managed, policy-controlled dev environments running inside your VPC, which banks like because source code never sits on laptops and egress is controlled."}, {"id": "compute-and-containers--vm-manager-and-patch-management", "domain": "compute-and-containers", "term": "VM Manager and patch management", "tier": "aware", "related": ["Vulnerability management", "Compute Engine"], "what": "OS inventory, **patch compliance reporting**, scheduled patch jobs, and OS policies (config management) across VM fleets, through the OS Config agent."}, {"id": "storage-and-databases--block-vs-file-vs-object-storage", "domain": "storage-and-databases", "term": "Block vs file vs object storage", "tier": "core", "related": ["Persistent Disk", "Filestore", "Cloud Storage"], "what": "**Block:** raw volumes the OS formats and mounts (one VM, low latency, used for databases and boot disks): Persistent Disk and Hyperdisk. **File:** a shared hierarchical filesystem over NFS or SMB (many clients, POSIX semantics): Filestore, NetApp Volumes. **Object:** whole immutable objects in a flat namespace, accessed over HTTP APIs, with practically unlimited scale and cheap storage: Cloud Storage.", "watch": "Object storage isn't a filesystem. There's no in-place append or edit, and rename is copy + delete. FUSE adapters hide this, but the performance doesn't change."}, {"id": "storage-and-databases--cloud-storage-gcs", "domain": "storage-and-databases", "term": "Cloud Storage (GCS)", "tier": "core", "related": ["Storage classes", "Signed URLs", "Object lifecycle management"], "what": "Object storage with very high durability (designed for 11 nines). **Buckets** (globally unique names, with a location and default class) hold **objects** (immutable blobs with metadata).", "how": "**Strong global consistency** for reads after writes, overwrites, deletes and listings. **Locations:** regional, dual-region (with optional turbo replication, an RPO of 15 minutes), multi-region. Access: **uniform bucket-level access** (IAM only, recommended) or legacy ACLs, **public access prevention**, signed URLs. Protection: **object versioning**, **soft delete** (deleted objects recoverable for a set number of days), **retention policies** and **bucket lock** (WORM; it satisfies some record-keeping rules), object holds. Movement: Storage Transfer Service, `gcloud storage`, parallel composite uploads. Data lake integrations through BigLake.", "gcp": "The landing zone for data lakes, model artifacts, RAG source documents, backups, logs archives and static sites."}, {"id": "storage-and-databases--storage-classes", "domain": "storage-and-databases", "term": "Storage classes", "tier": "core", "related": ["Cloud Storage", "Object lifecycle management", "Cost"], "what": "**Standard** (hot, no minimum), **Nearline** (30-day minimum, about monthly access), **Coldline** (90-day minimum), **Archive** (365-day minimum). All have **millisecond first-byte latency** and the same API and durability. Colder classes cost less to store but more to retrieve, and have early-deletion charges.", "how": "**Autoclass** moves objects between classes automatically based on access. A bucket's class is a default. Each object has its own class."}, {"id": "storage-and-databases--object-lifecycle-management", "domain": "storage-and-databases", "term": "Object lifecycle management", "tier": "working", "related": ["Storage classes", "Data retention"], "what": "Bucket rules that **change storage class or delete objects** based on conditions: age, created-before date, number of newer versions, live or noncurrent state, prefix or suffix.", "gcp": "For example: move logs to Coldline after 30 days, delete after 7 years. Delete noncurrent versions after 90 days. Lifecycle can't delete objects under a retention policy before it expires."}, {"id": "storage-and-databases--signed-urls-and-signed-policy-documents", "domain": "storage-and-databases", "term": "Signed URLs and signed policy documents", "tier": "working", "related": ["Cloud Storage", "Service accounts"], "what": "Time-limited URLs that grant whoever holds them access to one object (GET to download, PUT to upload) without an IAM identity. Signed with a service account key or, keylessly, through the IAM `signBlob` API.", "gcp": "The standard pattern for browser and mobile uploads straight to Cloud Storage, which keeps large files out of your API servers."}, {"id": "storage-and-databases--filestore-and-netapp-volumes", "domain": "storage-and-databases", "term": "Filestore and NetApp Volumes", "tier": "working", "related": ["Block vs file vs object storage"], "what": "Managed NFS file shares (Filestore tiers: Basic, Zonal, Regional, Enterprise). NetApp Volumes adds SMB and NetApp features. Used for lift-and-shift apps needing a shared POSIX filesystem, GKE ReadWriteMany volumes, and some ML training data."}, {"id": "storage-and-databases--durability-vs-availability", "domain": "storage-and-databases", "term": "Durability vs availability", "tier": "core", "related": ["Replication", "SLA"], "what": "**Durability:** the probability your data isn't *lost* (for example 11 nines). **Availability:** the proportion of time you can *access* it (for example 99.95%). Data can be perfectly durable and temporarily unavailable.", "watch": "Durability doesn't protect against *you* deleting or corrupting data. That's what versioning, soft delete, backups and PITR are for."}, {"id": "storage-and-databases--oltp-vs-olap", "domain": "storage-and-databases", "term": "OLTP vs OLAP", "tier": "core", "related": ["Row vs columnar storage", "BigQuery", "Cloud SQL"], "what": "**OLTP** (online transaction processing): many small, concurrent reads and writes of individual records, with low latency and strict consistency. Bank ledgers, payments, customer profiles. **OLAP** (online analytical processing): fewer, huge queries scanning and aggregating millions or billions of rows. Reporting, risk, ML features.", "gcp": "OLTP: Cloud SQL, AlloyDB, Spanner, Firestore, Bigtable (key lookups). OLAP: BigQuery. **HTAP** (both) features: AlloyDB's columnar engine, Spanner Data Boost, BigQuery federated queries to Spanner and Cloud SQL."}, {"id": "storage-and-databases--row-vs-columnar-storage", "domain": "storage-and-databases", "term": "Row vs columnar storage", "tier": "core", "related": ["OLTP vs OLAP", "BigQuery"], "what": "**Row stores** keep each record's fields together, so fetching or updating one record is fast (OLTP). **Columnar stores** keep each column together, so scanning a few columns over many rows is fast, and the data compresses very well (OLAP).", "watch": "That's why `SELECT *` on BigQuery is expensive (you pay for every column scanned) and why BigQuery isn't a transactional database."}, {"id": "storage-and-databases--acid-transactions", "domain": "storage-and-databases", "term": "ACID transactions", "tier": "core", "related": ["Isolation levels", "Spanner", "Cloud SQL"], "what": "**Atomicity** (all or nothing), **Consistency** (constraints hold before and after), **Isolation** (concurrent transactions don't see each other's partial work), **Durability** (committed means it survives crashes).", "gcp": "Cloud SQL, AlloyDB and Spanner are fully ACID (Spanner even across regions). Firestore has ACID transactions over documents. Bigtable gives single-row atomicity only. BigQuery supports multi-statement transactions but isn't built for OLTP."}, {"id": "storage-and-databases--isolation-levels-and-anomalies", "domain": "storage-and-databases", "term": "Isolation levels and anomalies", "tier": "working", "related": ["ACID transactions", "Consistency models"], "what": "How strongly concurrent transactions are separated. **Read committed** (the default in PostgreSQL) prevents dirty reads, but non-repeatable reads and phantoms can happen. **Repeatable read / snapshot isolation**: a stable snapshot, but *write skew* is possible. **Serializable**: as if transactions ran one after another (the safest, with more conflicts and retries).", "gcp": "Spanner defaults to serializable (with strict \"external consistency\"). For money movement, know which level you're running at, and handle retries on conflicts."}, {"id": "storage-and-databases--consistency-models", "domain": "storage-and-databases", "term": "Consistency models", "tier": "core", "related": ["CAP and PACELC", "Replication"], "what": "What readers are guaranteed to see after a write. **Strong / linearizable:** every read sees the latest committed write. **Eventual:** replicas converge over time, so a read may be stale. In between: **read-your-writes**, **monotonic reads**, **bounded staleness**.", "gcp": "Strong: Cloud Storage, Spanner, Firestore, Cloud SQL primary, and Bigtable within a single cluster. Eventual: Cloud SQL read replicas, Bigtable cross-cluster replication, caches. Spanner offers **stale reads** (bounded or exact staleness) for lower latency when slightly old data is fine.", "watch": "Reading from an async replica right after writing to the primary returns old data, a classic bug in \"read-replica for scale\" designs."}, {"id": "storage-and-databases--cap-theorem-and-pacelc", "domain": "storage-and-databases", "term": "CAP theorem and PACELC", "tier": "working", "related": ["Consistency models", "Spanner"], "what": "**CAP:** during a network **P**artition, a distributed system must choose **C**onsistency (reject or block some requests) or **A**vailability (answer, possibly with stale data). **PACELC** extends it: **E**lse (normally), choose between **L**atency and **C**onsistency.", "gcp": "Spanner chooses consistency, and gets very high availability by running on Google's redundant private network and TrueTime. Bigtable multi-cluster and caches choose availability and latency."}, {"id": "storage-and-databases--replication-sync-vs-async-leader-follower", "domain": "storage-and-databases", "term": "Replication (sync vs async, leader/follower)", "tier": "core", "related": ["High availability", "RPO", "Cloud SQL", "Spanner"], "what": "Keeping copies of data on multiple nodes or locations. **Synchronous:** a write is acknowledged only when the replicas have it, so **RPO = 0**, but write latency includes the slowest replica (fine within a region, painful across distant regions). **Asynchronous:** acknowledge first, replicate later, so writes are fast, but **RPO > 0** (recent writes can be lost on failover) and replicas lag.", "how": "**Leader/follower** (single writer, many readers), **multi-leader** (conflict resolution needed), **consensus (Paxos/Raft)** (a majority quorum agrees, as in Spanner).", "gcp": "Cloud SQL HA uses synchronous replication to a standby in another zone. Read replicas and cross-region replicas are async. Spanner uses Paxos-based synchronous replication across zones or regions. Regional Persistent Disk replicates synchronously across 2 zones."}, {"id": "storage-and-databases--sharding-and-partitioning", "domain": "storage-and-databases", "term": "Sharding and partitioning", "tier": "core", "related": ["Spanner", "Bigtable", "BigQuery partitioning"], "what": "Splitting data across nodes by key so that storage and throughput scale horizontally. **Range** sharding (contiguous key ranges) or **hash** sharding.", "how": "A good key spreads load evenly. **Hotspots** happen when keys are sequential (timestamps, auto-increment IDs), because all new writes hit one shard.", "gcp": "Spanner and Bigtable split data by key range automatically. Avoid monotonically increasing leading keys: use UUIDv4, bit-reversed sequences, or a hashed or salted prefix. BigQuery \"partitioning\" is a related but different idea: it splits tables (usually by date) to prune scans."}, {"id": "storage-and-databases--indexes", "domain": "storage-and-databases", "term": "Indexes", "tier": "working", "related": ["OLTP vs OLAP", "Firestore"], "what": "Data structures (B-trees mostly, plus hash, GIN, vector indexes) that make lookups by a column fast, at the cost of write overhead and storage.", "gcp": "Cloud SQL, AlloyDB and Spanner have secondary indexes. Firestore needs an index for every query (single-field indexes are automatic, composite ones you define). Bigtable has only the row key, so design your key around your queries. Vector indexes: ScaNN (AlloyDB), HNSW/IVF (pgvector), Vector Search."}, {"id": "storage-and-databases--normalization-denormalization-and-star-schemas", "domain": "storage-and-databases", "term": "Normalization, denormalization and star schemas", "tier": "working", "related": ["BigQuery", "Data warehouse"], "what": "**Normalization:** split data into related tables to avoid duplication and update anomalies (OLTP). **Denormalization:** duplicate data or nest it to avoid joins (analytics, NoSQL). A **star schema** has central *fact* tables (events, transactions) joined to *dimension* tables (customer, product, date).", "gcp": "BigQuery handles star schemas well, and it also rewards **nested and repeated fields** (STRUCT/ARRAY), which store child records inside the parent row to avoid joins."}, {"id": "storage-and-databases--cloud-sql", "domain": "storage-and-databases", "term": "Cloud SQL", "tier": "core", "related": ["Replication", "Backup and PITR", "Connection pooling"], "what": "Managed MySQL, PostgreSQL and SQL Server. Google handles provisioning, patching, backups, replication and failover.", "how": "**HA configuration:** a primary plus a standby in another zone of the same region, with synchronous storage-level replication and automatic failover (about a minute). **Read replicas** (async, same or cross-region) can be promoted for DR. Automated backups + **point-in-time recovery** (PITR, from transaction logs). **Private IP** (through PSA or PSC) and the **Cloud SQL Auth Proxy** / language connectors (IAM-authorized, TLS, no allow-listing IPs). **IAM database authentication**. Maintenance windows. **Editions:** Enterprise and **Enterprise Plus** (better performance, near-zero-downtime maintenance, 99.99% SLA, larger data cache). It scales **vertically**, with storage up to tens of TB.", "gcp": "The default for \"a normal relational app database\" and lift-and-shift of MySQL, PostgreSQL or SQL Server."}, {"id": "storage-and-databases--alloydb-for-postgresql", "domain": "storage-and-databases", "term": "AlloyDB for PostgreSQL", "tier": "core", "related": ["Cloud SQL", "Vector search", "HTAP"], "what": "A PostgreSQL-compatible database built by Google with compute separated from a distributed, log-based storage layer.", "how": "Faster transactional throughput than standard PostgreSQL, a **columnar engine** for fast analytics on live data, **read pools** for scaling reads, a 99.99% SLA, cross-region secondary clusters for DR, and **AlloyDB AI**: **pgvector with ScaNN indexes**, in-database calls to embedding and Gemini models, natural-language-to-SQL. AlloyDB Omni runs it anywhere (on-prem, other clouds).", "gcp": "Strong choice for demanding PostgreSQL workloads and for RAG, where you want vectors, metadata filters and transactional data in one place."}, {"id": "storage-and-databases--spanner", "domain": "storage-and-databases", "term": "Spanner", "tier": "core", "related": ["CAP and PACELC", "TrueTime", "Sharding"], "what": "A globally distributed relational database with **horizontal scale**, **strong external consistency** and up to **99.999% availability** (multi-region configurations; 99.99% regional).", "how": "Data is split by primary-key ranges across servers, and each split is replicated with **Paxos** across zones or regions. **TrueTime** (GPS- and atomic-clock-backed time with bounded uncertainty) gives globally ordered commit timestamps. It offers GoogleSQL or a PostgreSQL interface, interleaved tables (child rows stored with the parent), change streams, **Data Boost** (analytics without hurting OLTP), graph and vector search, full-text search. Capacity is measured in nodes or processing units, with autoscaling and editions.", "watch": "Hotspotting from sequential keys. Cost is higher than Cloud SQL, so justify it with scale or availability needs (core banking ledgers, payments, global consistency)."}, {"id": "storage-and-databases--truetime", "domain": "storage-and-databases", "term": "TrueTime", "tier": "aware", "related": ["Spanner"], "what": "Google's clock API that returns a time *interval* guaranteed to contain true time, using GPS and atomic clocks in each data centre. Spanner waits out the uncertainty at commit (\"commit wait\") so timestamps reflect real-time order everywhere."}, {"id": "storage-and-databases--firestore", "domain": "storage-and-databases", "term": "Firestore", "tier": "core", "related": ["Serverless", "Consistency models", "Indexes"], "what": "A serverless, autoscaling **document database**. **Collections** contain **documents** (JSON-like, nested), which can contain subcollections.", "how": "Strongly consistent reads and queries, ACID transactions, **real-time listeners** (clients get pushed updates), offline SDKs for mobile and web, security rules for direct client access, TTL policies, PITR, and regional or multi-region locations (99.999% multi-region SLA). Two modes: **Native** (the full feature set) and **Datastore mode** (server-side, for the legacy Datastore API). Firestore also offers MongoDB compatibility and vector search.", "watch": "Every query needs an index. There are write-rate limits per document (about 1 sustained write per second per document) and sequential-ID hotspots."}, {"id": "storage-and-databases--bigtable", "domain": "storage-and-databases", "term": "Bigtable", "tier": "core", "related": ["Sharding", "Time-series data", "HBase"], "what": "A wide-column NoSQL store for **massive throughput and single-digit millisecond latency** at TB–PB scale. It's the technology behind Search, Maps and Analytics.", "how": "Each row has one **row key**, and the table is sorted by it. Columns are grouped into **column families**. Cells are versioned by timestamp. It offers single-row transactions only, no secondary indexes (beyond limited new features) and an HBase-compatible API. Clusters are made of nodes (throughput scales roughly linearly). **Replication** across clusters and regions is *eventually consistent*, with app profiles that route to one cluster or many.", "gcp": "Used for time series, IoT, market tick data, fraud feature lookups, personalization and ad-tech. Row key design (for example `customerId#reverseTimestamp`) is the whole game."}, {"id": "storage-and-databases--memorystore", "domain": "storage-and-databases", "term": "Memorystore", "tier": "core", "related": ["Caching patterns", "Stateless services"], "what": "Managed in-memory data stores: **Redis** (and Redis Cluster), **Valkey** (the open-source Redis fork) and **Memcached**. Sub-millisecond latency.", "how": "Uses: caching, session state, rate-limit counters, leaderboards (sorted sets), pub/sub, queues, LLM response or semantic caches, vector search. HA with replicas and automatic failover. Private connectivity (PSC). Persistence (RDB/AOF) is optional. It's still memory first, so not a system of record."}, {"id": "storage-and-databases--caching-patterns", "domain": "storage-and-databases", "term": "Caching patterns", "tier": "core", "related": ["Memorystore", "CDN", "Consistency models"], "what": "**Cache-aside** (lazy loading): the app checks the cache, and on a miss reads the DB and fills the cache. **Read-through**: the cache loads from the DB itself. **Write-through**: write to the cache and DB together. **Write-behind**: write to the cache, flush to the DB later (risk of loss). Entries leave through **TTLs** and **eviction** (LRU, LFU).", "how": "Two hard problems: **invalidation** (when the source changes) and **stampedes** (thundering herd, when many misses hit the DB at once; fixed by request coalescing, jittered TTLs, early refresh).", "gcp": "Memorystore (application cache), Cloud CDN (edge), BigQuery result cache and BI Engine, LLM **context caching** (cache long prompts on the model side) and **semantic caching** (reuse answers to similar questions, through Apigee or a vector cache)."}, {"id": "storage-and-databases--bigquery", "domain": "storage-and-databases", "term": "BigQuery", "tier": "core", "related": ["OLAP", "Partitioning and clustering", "BigQuery slots and editions"], "what": "A serverless, petabyte-scale data warehouse with separate storage and compute and standard SQL. It's also the hub of GCP analytics and AI.", "how": "**Storage:** columnar (Capacitor format) on Colossus, organized as project → **dataset** (location-bound, the main access boundary) → tables and views. **Compute:** the Dremel query engine allocates **slots** (units of compute). **Pricing:** on-demand (per TB scanned) or **capacity** (editions with reservations and autoscaling slots). Ingestion: free batch loads, the **Storage Write API** (streaming, exactly-once), Pub/Sub BigQuery subscriptions, Datastream (CDC), Data Transfer Service. Features: partitioning and clustering, **materialized views**, **BI Engine** (in-memory acceleration), **search indexes**, **vector search**, **BigQuery ML** (train or call models, including Gemini, in SQL), **remote functions** (call Cloud Run from SQL), **time travel** (7 days) and **fail-safe**, **authorized views and datasets**, **row-level security**, **column-level security with policy tags** (and dynamic data masking), **Analytics Hub** (data sharing), **BigLake / external tables** (query GCS data in Iceberg or Parquet), multi-statement transactions.", "watch": "It isn't for OLTP or point lookups at high QPS. Costs come from scanning (on-demand), so partition, cluster, avoid `SELECT *`, and set custom quotas or maximum bytes billed."}, {"id": "storage-and-databases--bigquery-partitioning-and-clustering", "domain": "storage-and-databases", "term": "BigQuery partitioning and clustering", "tier": "core", "related": ["BigQuery", "Sharding"], "what": "**Partitioning** splits a table into segments by a date or timestamp column, ingestion time, or integer range. Queries that filter on the partition column only scan the matching partitions. **Clustering** sorts the data within partitions by up to 4 columns, so filters and aggregations on those columns read fewer blocks.", "gcp": "You can require a partition filter (`require_partition_filter`) to stop accidental full scans. Partition expiry is a way to implement retention policies."}, {"id": "storage-and-databases--bigquery-slots-editions-and-reservations", "domain": "storage-and-databases", "term": "BigQuery slots, editions and reservations", "tier": "working", "related": ["BigQuery", "Pricing models"], "what": "A **slot** is a virtual CPU for queries. **On-demand** pricing uses a shared pool with a per-project cap. **Editions** (Standard, Enterprise, Enterprise Plus) let you buy slot capacity with **autoscaling** and optional commitments. **Reservations** and **assignments** dedicate capacity to projects or folders (workload isolation: prod ETL separated from ad-hoc analysts).", "watch": "Enterprise Plus brings features some regulated workloads need (for example certain compliance controls and managed disaster recovery). Check the edition-feature matrix."}, {"id": "storage-and-databases--data-lake-data-warehouse-and-lakehouse", "domain": "storage-and-databases", "term": "Data lake, data warehouse and lakehouse", "tier": "core", "related": ["Cloud Storage", "BigQuery", "BigLake", "Dataplex"], "what": "**Data lake:** cheap object storage holding raw data in any format (schema-on-read). **Warehouse:** curated, structured, governed tables optimized for SQL (schema-on-write). **Lakehouse:** warehouse-style governance, transactions and performance on open table formats (**Apache Iceberg**, Delta, Hudi) in object storage, readable by many engines (BigQuery, Spark, Trino).", "gcp": "**BigLake** gives unified, fine-grained governance over GCS data and BigQuery, including BigLake Iceberg tables and a metastore. Common layering: raw/bronze → cleaned/silver → curated/gold."}, {"id": "storage-and-databases--dataplex-universal-catalog-data-governance", "domain": "storage-and-databases", "term": "Dataplex Universal Catalog (data governance)", "tier": "working", "related": ["Data lake", "Sensitive Data Protection", "Lineage"], "what": "GCP's data governance layer: a **catalog** (search and metadata across BigQuery, GCS, databases and AI assets), **business glossary**, **data lineage** (column-level lineage across BigQuery, Dataflow, Composer and others), **data quality** scans and **data profiling**, and lake/zone management with security policies.", "gcp": "It answers the regulator's questions \"where did this number come from?\" (lineage, as in BCBS 239 risk-data aggregation) and \"who owns this dataset and what's in it?\"."}, {"id": "storage-and-databases--backup-pitr-and-backup-and-dr-service", "domain": "storage-and-databases", "term": "Backup, PITR and Backup and DR Service", "tier": "core", "related": ["RPO and RTO", "Disaster recovery"], "what": "**Backups** are copies taken at intervals. **Point-in-time recovery (PITR)** replays transaction logs to restore to any second within a window. **Backup and DR Service** is GCP's centralized backup management (VMs, databases, file systems, GKE) with **backup vaults** that are immutable and indelible (protection against ransomware and insiders).", "gcp": "Cloud SQL (automated backups + PITR), AlloyDB (continuous backup + PITR), Spanner (backups + PITR up to 7 days), Firestore (PITR + scheduled backups), BigQuery (time travel + snapshots), GKE (Backup for GKE).", "watch": "A backup you've never restored is a hope, not a control. Test restores, and measure the real RTO."}, {"id": "storage-and-databases--database-center", "domain": "storage-and-databases", "term": "Database Center", "tier": "aware", "related": ["Cloud SQL", "AlloyDB", "Spanner"], "what": "A fleet-wide dashboard for all your GCP databases (inventory, health, security and configuration issues, recommendations), with AI-assisted insights."}, {"id": "data-processing-and-messaging--batch-vs-streaming", "domain": "data-processing-and-messaging", "term": "Batch vs streaming", "tier": "core", "related": ["Dataflow", "Pub/Sub", "Windowing"], "what": "**Batch** processes a bounded dataset on a schedule (nightly risk runs, end-of-day reconciliations): simpler, cheaper, with higher latency. **Streaming** processes an unbounded flow of events continuously, with seconds of latency (fraud detection, real-time dashboards, alerts): harder, because of ordering, late data and state.", "gcp": "Batch: BigQuery SQL, Dataflow batch, Dataproc, Cloud Run jobs, Batch. Streaming: Pub/Sub or Kafka → Dataflow → BigQuery or Bigtable, or BigQuery continuous queries."}, {"id": "data-processing-and-messaging--etl-vs-elt", "domain": "data-processing-and-messaging", "term": "ETL vs ELT", "tier": "core", "related": ["BigQuery", "Dataform", "Dataflow"], "what": "**ETL:** extract → transform (in a separate engine) → load the cleaned result. **ELT:** extract → load raw data into the warehouse → transform there with SQL. ELT has become the default with powerful warehouses like BigQuery.", "gcp": "ELT with BigQuery + **Dataform** (version-controlled SQL pipelines) or dbt. ETL with Dataflow, Dataproc or Data Fusion when you need heavy transformation, streaming, or data shaping before it lands (for example PII tokenization before the data reaches the lake)."}, {"id": "data-processing-and-messaging--change-data-capture-cdc", "domain": "data-processing-and-messaging", "term": "Change data capture (CDC)", "tier": "core", "related": ["Datastream", "Transactional outbox", "Replication"], "what": "Capturing row-level inserts, updates and deletes from a database's transaction log and streaming them elsewhere, without heavy queries on the source.", "gcp": "**Datastream** (serverless CDC from MySQL, PostgreSQL, Oracle, SQL Server and AlloyDB into BigQuery or Cloud Storage), Spanner change streams, Debezium on Kafka. A very common bank pattern: core systems on-prem → CDC → BigQuery for analytics and ML features."}, {"id": "data-processing-and-messaging--queue-vs-pub-sub-vs-event-log-stream", "domain": "data-processing-and-messaging", "term": "Queue vs pub/sub vs event log (stream)", "tier": "core", "related": ["Pub/Sub", "Kafka", "Cloud Tasks"], "what": "**Queue:** each message goes to *one* consumer from a pool (work distribution), and is deleted once processed. **Pub/sub:** each message is copied to *every subscription* (fan-out), and each subscription is a queue for its consumers. **Event log / stream (Kafka-style):** an ordered, retained, append-only log split into partitions. Consumers track their own **offset** and can replay from any point.", "gcp": "Pub/Sub is pub/sub with per-subscription queues, plus retention and seek for replay. Managed Service for Apache Kafka is the log model. Cloud Tasks is a queue of HTTP calls to one target."}, {"id": "data-processing-and-messaging--pub-sub", "domain": "data-processing-and-messaging", "term": "Pub/Sub", "tier": "core", "related": ["Delivery semantics", "Dead-letter topics", "Eventarc"], "what": "A global, serverless, autoscaling messaging service. Publishers send to **topics**, and **subscriptions** deliver to subscribers.", "how": "Subscription types: **pull** (StreamingPull for high throughput), **push** (HTTPS POST to an endpoint, for example Cloud Run, with OIDC authentication), **BigQuery** (writes straight into a table), **Cloud Storage** (batches into files). Delivery: messages are redelivered until **acked**, within an **ack deadline** that can be extended. Other features: **retention** (7 days by default, longer configurable; topic retention allows replay), **seek** (replay to a timestamp or snapshot), **ordering keys** (in order per key, within a region), **exactly-once delivery** (pull, per region), **dead-letter topics**, **filtering** (by attributes), **schemas** (Avro or Protobuf), **message storage policy** (restrict which regions store messages, which matters for UK residency), **single message transforms**, CMEK. Throughput scales automatically.", "watch": "Pub/Sub is a *global* service by default. Set the message storage policy (or use regional endpoints) when data must stay in the UK."}, {"id": "data-processing-and-messaging--delivery-semantics-at-most-at-least-exactly-once", "domain": "data-processing-and-messaging", "term": "Delivery semantics (at-most / at-least / exactly once)", "tier": "core", "related": ["Idempotency", "Pub/Sub", "Dataflow"], "what": "**At-most-once:** may lose messages, never duplicates. **At-least-once:** never loses, may duplicate. This is the norm. **Exactly-once:** each message has its effect exactly once, which in practice means at-least-once delivery + deduplication or idempotent processing.", "gcp": "Pub/Sub is at-least-once by default, with an exactly-once option for pull subscriptions. Dataflow gives exactly-once *processing* inside the pipeline. BigQuery Storage Write API gives exactly-once writes with offsets.", "watch": "End-to-end exactly-once needs your *sink* to be idempotent too. Assume duplicates."}, {"id": "data-processing-and-messaging--message-ordering", "domain": "data-processing-and-messaging", "term": "Message ordering", "tier": "working", "related": ["Pub/Sub", "Kafka", "Sharding"], "what": "Guaranteeing consumers see related messages in the order they were published.", "how": "Global ordering doesn't scale, so systems order **per key**: Pub/Sub ordering keys, Kafka partitions. A failure (an unacked message) blocks later messages for that key until it's resolved.", "watch": "Ask whether you really need ordering, or whether you can use versioning or timestamps and idempotent \"last write wins\" instead."}, {"id": "data-processing-and-messaging--dead-letter-topics-and-poison-messages", "domain": "data-processing-and-messaging", "term": "Dead-letter topics and poison messages", "tier": "working", "related": ["Pub/Sub", "Retries and backoff"], "what": "A **poison message** fails processing every time (bad format, a bug) and would block or loop forever. A **dead-letter topic (DLT/DLQ)** receives messages after N failed delivery attempts, so the rest keep flowing, and someone can inspect or replay them later.", "gcp": "Pub/Sub subscriptions take `--dead-letter-topic` and `--max-delivery-attempts`. The Pub/Sub service agent needs publisher and subscriber roles for this. Alert on DLT backlog."}, {"id": "data-processing-and-messaging--apache-kafka-and-managed-service-for-apache-kafka", "domain": "data-processing-and-messaging", "term": "Apache Kafka and Managed Service for Apache Kafka", "tier": "working", "related": ["Queue vs pub/sub vs event log", "Pub/Sub"], "what": "**Kafka** is the open-source distributed event-log platform: topics split into **partitions** (ordered, replicated), producers, **consumer groups** (each partition is consumed by one member of the group), offsets, retention by time or size, a connector ecosystem (Kafka Connect) and stream processing (Kafka Streams).", "gcp": "**Google Cloud Managed Service for Apache Kafka** runs Kafka clusters for you. Choose it when you have Kafka skills, Kafka-native tools (Debezium, Connect) or multicloud portability needs. Choose Pub/Sub for serverless simplicity and native GCP integration."}, {"id": "data-processing-and-messaging--dataflow-and-apache-beam", "domain": "data-processing-and-messaging", "term": "Dataflow and Apache Beam", "tier": "core", "related": ["Batch vs streaming", "Windowing and watermarks", "Pub/Sub"], "what": "**Apache Beam** is a unified programming model (Java, Python, Go, SQL, YAML) for batch *and* streaming pipelines. **Dataflow** is Google's serverless runner for Beam.", "how": "Pipelines are graphs of **PCollections** (datasets) and **transforms** (ParDo, GroupByKey, Combine, windowing). Dataflow handles autoscaling workers, **Streaming Engine**, dynamic work rebalancing, exactly-once processing, **templates** (Classic or Flex, for reusable launches), Dataflow Prime, and GPUs for ML inference in pipelines. Common sources and sinks: Pub/Sub, Kafka, GCS, BigQuery, Bigtable, Spanner, JDBC.", "gcp": "The standard engine for streaming ETL, real-time feature computation (fraud), and large batch transforms. Enrichment and ML inference (RunInference) can run inside the pipeline."}, {"id": "data-processing-and-messaging--windowing-watermarks-and-late-data", "domain": "data-processing-and-messaging", "term": "Windowing, watermarks and late data", "tier": "working", "related": ["Dataflow", "Batch vs streaming"], "what": "Ways to aggregate an unbounded stream. **Windows** group events by **event time**: **fixed / tumbling** (every 5 minutes), **sliding** (5-minute windows every minute), **session** (bursts separated by gaps). A **watermark** is the system's estimate of \"we've probably seen all events up to time T\". **Triggers** decide when to emit results (at the watermark, early speculative results, late updates). **Allowed lateness** controls how long late events can still update a window.", "watch": "Event time (when it happened) ≠ processing time (when you saw it). Mobile and on-prem sources often deliver late. Correct streaming results depend on handling this."}, {"id": "data-processing-and-messaging--dataproc", "domain": "data-processing-and-messaging", "term": "Dataproc", "tier": "working", "related": ["Dataflow", "Data lake"], "what": "Managed **Apache Spark** and Hadoop ecosystem (Hive, Presto/Trino, Flink). Clusters start in about 90 seconds. **Dataproc Serverless** runs Spark batches and interactive sessions without clusters.", "how": "Best practice: **ephemeral, job-scoped clusters**, with data in **Cloud Storage** (not HDFS) and metadata in a shared metastore. Use autoscaling and Spot secondary workers.", "gcp": "Choose it to migrate existing Spark or Hadoop jobs, or for Spark skills and libraries. Choose Dataflow for new serverless pipelines, especially streaming."}, {"id": "data-processing-and-messaging--cloud-composer-apache-airflow", "domain": "data-processing-and-messaging", "term": "Cloud Composer (Apache Airflow)", "tier": "working", "related": ["Workflows", "Orchestration vs choreography"], "what": "Managed **Apache Airflow** for orchestrating data pipelines as **DAGs** (directed acyclic graphs) of tasks, with operators for BigQuery, Dataflow, Dataproc, GCS, external systems, retries, SLAs, backfills and scheduling.", "watch": "Composer *orchestrates*: it triggers and monitors work done elsewhere. Don't do heavy processing inside Airflow workers. For lightweight orchestration of API calls and services, use **Workflows**."}, {"id": "data-processing-and-messaging--dataform", "domain": "data-processing-and-messaging", "term": "Dataform", "tier": "working", "related": ["ETL vs ELT", "BigQuery"], "what": "Develops, version-controls (git), tests and schedules **SQL transformation pipelines in BigQuery** (SQLX files with dependencies, assertions for data quality, incremental tables). Comparable to dbt, and native to BigQuery."}, {"id": "data-processing-and-messaging--cloud-data-fusion", "domain": "data-processing-and-messaging", "term": "Cloud Data Fusion", "tier": "aware", "related": ["ETL vs ELT"], "what": "A visual, low-code ETL/ELT designer (based on open-source CDAP) with many connectors. Pipelines run on Dataproc. Suits teams that prefer GUI-built integrations."}, {"id": "data-processing-and-messaging--data-transfer-and-ingestion-services", "domain": "data-processing-and-messaging", "term": "Data transfer and ingestion services", "tier": "working", "related": ["Migration", "Cloud Storage", "BigQuery"], "what": "**Storage Transfer Service:** bulk and scheduled transfers into GCS from other clouds, HTTP sources, on-prem file systems (through agents) or between buckets. **Transfer Appliance:** a physical device shipped to you for offline transfer of hundreds of TB to PB. **BigQuery Data Transfer Service:** scheduled loads from SaaS (Google Ads, Salesforce and others), other warehouses (Teradata, Redshift migrations) and GCS. **`gcloud storage`:** command-line copies.", "watch": "Rule of thumb: when bandwidth × time-window is less than the data size, use the appliance."}, {"id": "data-processing-and-messaging--looker-and-looker-studio", "domain": "data-processing-and-messaging", "term": "Looker and Looker Studio", "tier": "working", "related": ["BigQuery", "Semantic layer"], "what": "**Looker:** an enterprise BI platform with a governed **semantic layer** (LookML defines metrics once), embedded analytics and APIs. **Looker Studio:** free, self-service dashboards and reports with many connectors.", "gcp": "Banks prefer Looker, because consistent, governed metric definitions matter for regulatory reporting. The semantic layer also grounds natural-language-to-data agents (\"conversational analytics\")."}, {"id": "data-processing-and-messaging--bigquery-continuous-queries-and-real-time-analytics", "domain": "data-processing-and-messaging", "term": "BigQuery continuous queries and real-time analytics", "tier": "aware", "related": ["Batch vs streaming", "BigQuery"], "what": "**Continuous queries** run SQL on data as it streams into BigQuery and export results continuously to Pub/Sub, Bigtable or other tables (for example real-time alerting with SQL only). Together with Storage Write API ingestion, BigQuery can handle near-real-time use cases without Dataflow."}, {"id": "data-processing-and-messaging--data-mesh-and-federated-governance", "domain": "data-processing-and-messaging", "term": "Data mesh and federated governance", "tier": "aware", "related": ["Dataplex", "Data products"], "what": "An organizational approach where **domain teams own their data as products** (with SLAs, documentation and quality), on a self-service platform, under **federated computational governance** (global standards enforced automatically).", "gcp": "Often built with domain-owned projects and datasets, Dataplex for catalog and governance, Analytics Hub for sharing, and BigLake for shared lake storage."}, {"id": "data-processing-and-messaging--data-quality-and-validation", "domain": "data-processing-and-messaging", "term": "Data quality and validation", "tier": "aware", "related": ["Dataplex", "Dataform"], "what": "Checks that data is complete, valid, unique, timely and consistent. In pipelines: schema enforcement, assertions (Dataform), Dataplex data-quality scans, Great Expectations-style tests, and quarantining bad records rather than failing everything."}, {"id": "apis-and-service-communication--synchronous-vs-asynchronous-communication", "domain": "apis-and-service-communication", "term": "Synchronous vs asynchronous communication", "tier": "core", "related": ["Request/response vs event-driven", "Pub/Sub", "Timeouts"], "what": "**Synchronous:** the caller sends a request and waits for the response (REST, gRPC). It's simple and immediate, but it couples availability (if B is down, A fails) and latency (A's latency includes B's). **Asynchronous:** the caller hands off a message or event and continues (Pub/Sub, Kafka, Cloud Tasks). It decouples availability and buffers load, at the cost of eventual consistency, harder debugging and more complex error handling.", "how": "Rule of thumb: synchronous for queries and anything the user is waiting on. Asynchronous for side effects, fan-out, long-running work and integration between domains.", "watch": "A chain of synchronous calls multiplies failure probability. Five services at 99.9% each give about 99.5% end to end."}, {"id": "apis-and-service-communication--request-response-vs-event-driven-architecture", "domain": "apis-and-service-communication", "term": "Request/response vs event-driven architecture", "tier": "core", "related": ["Synchronous vs asynchronous", "Eventarc", "Choreography vs orchestration"], "what": "**Request/response:** \"do this for me and tell me the result\" (a command). **Event-driven:** services publish **events** (\"PaymentSettled\") describing facts that happened, and interested services react independently. Producers don't know who the consumers are.", "how": "Event types: **notification** (thin: an ID, so consumers call back for details), **event-carried state transfer** (fat: includes the data), **domain events**.", "gcp": "Pub/Sub, Eventarc (with the CloudEvents format), Kafka. For example, a \"transaction posted\" event fans out to fraud scoring, notifications, the ledger analytics feed and an agent that categorizes the spend."}, {"id": "apis-and-service-communication--rest", "domain": "apis-and-service-communication", "term": "REST", "tier": "core", "related": ["HTTP basics", "HTTP status codes", "OpenAPI"], "what": "An architectural style for HTTP APIs: **resources** identified by URLs (`/accounts/123/transactions`), manipulated with standard **methods**, **stateless** requests, representations (usually JSON), and meaningful **status codes**.", "how": "GET reads, POST creates (or triggers an action), PUT replaces, PATCH partially updates, DELETE removes. Collections support filtering, sorting and pagination. Versioning goes in the path (`/v1/`) or headers.", "gcp": "Almost every Google API is available as REST (and gRPC). Google's **API Improvement Proposals (AIPs)** are a good REST design guide (resource names, standard methods, long-running operations, pagination)."}, {"id": "apis-and-service-communication--http-methods-safety-and-idempotency", "domain": "apis-and-service-communication", "term": "HTTP methods: safety and idempotency", "tier": "core", "related": ["Idempotency", "Retries"], "what": "**Safe** methods don't change state: GET, HEAD, OPTIONS. **Idempotent** methods have the same effect whether called once or many times: GET, PUT, DELETE (plus HEAD, OPTIONS). **POST is not idempotent** and PATCH isn't guaranteed to be.", "watch": "Clients and proxies retry idempotent requests freely. A retried POST \"make payment\" can pay twice unless the API supports **idempotency keys**."}, {"id": "apis-and-service-communication--http-status-codes", "domain": "apis-and-service-communication", "term": "HTTP status codes", "tier": "core", "related": ["REST", "Retries"], "what": "**2xx** success: 200 OK, 201 Created, 202 Accepted (async processing started), 204 No Content. **3xx** redirect: 301/308 permanent, 302/307 temporary, 304 Not Modified. **4xx** client error: 400 Bad Request, **401 Unauthorized** (actually *unauthenticated*), **403 Forbidden** (authenticated but not allowed), 404 Not Found, 409 Conflict, 412 Precondition Failed (etag mismatch), **429 Too Many Requests** (rate limited; respect `Retry-After`). **5xx** server error: 500 Internal, **502 Bad Gateway** (a proxy got a bad response from upstream), **503 Service Unavailable** (overloaded or down; retryable), **504 Gateway Timeout** (upstream too slow).", "watch": "Only retry 429, 503, 504 and idempotent requests after timeouts or connection errors. Never blindly retry 4xx."}, {"id": "apis-and-service-communication--grpc-and-protocol-buffers", "domain": "apis-and-service-communication", "term": "gRPC and Protocol Buffers", "tier": "core", "related": ["HTTP/2", "REST", "Service mesh"], "what": "**gRPC** is a high-performance RPC framework. Services and messages are defined in **Protocol Buffers** (`.proto`), a compact binary serialization format with strong schemas, and client and server code is generated from them. It runs over **HTTP/2**.", "how": "Four call types: **unary** (request → response), **server streaming** (request → stream of responses), **client streaming**, **bidirectional streaming**. Built-in **deadlines** (propagated across hops), cancellation, metadata (headers), status codes, and backward-compatible schema evolution (field numbers; never reuse them).", "gcp": "Many Google APIs are gRPC-native (Pub/Sub, Spanner, Bigtable clients). **Cloud Run** supports gRPC, including streaming, with HTTP/2 end-to-end. Application Load Balancers and service mesh route gRPC. **gRPC-Web** or **transcoding** (API Gateway, Cloud Endpoints, Envoy) exposes gRPC services as REST/JSON to browsers.", "watch": "It's great for internal service-to-service calls (fast, typed, streaming). It's less friendly for public, browser-facing or partner APIs, where REST/JSON plus OpenAPI is the norm."}, {"id": "apis-and-service-communication--graphql", "domain": "apis-and-service-communication", "term": "GraphQL", "tier": "working", "related": ["REST", "API gateway"], "what": "A query language for APIs. Clients ask for exactly the fields they need from a typed schema in one request, which avoids over- and under-fetching across many REST calls. It has one endpoint, and mutations for writes and subscriptions for push.", "watch": "Caching, authorization per field and query cost control (deeply nested queries) are harder than with REST. Apigee supports GraphQL proxies with schema validation."}, {"id": "apis-and-service-communication--websockets", "domain": "apis-and-service-communication", "term": "WebSockets", "tier": "working", "related": ["Server-sent events", "HTTP basics", "Cloud Run"], "what": "A full-duplex, long-lived connection over a single TCP connection, started with an HTTP `Upgrade` handshake. Either side can send messages at any time.", "gcp": "Supported on Cloud Run (bounded by the request timeout, up to 60 minutes; clients must reconnect), GKE and Application Load Balancers (backend service timeout). Scaling needs care: connections pin to instances, so use session affinity and shared state through Memorystore pub/sub or similar. Live trading UIs, chat, real-time voice agents (for example the Gemini Live API)."}, {"id": "apis-and-service-communication--server-sent-events-sse-and-streaming-responses", "domain": "apis-and-service-communication", "term": "Server-sent events (SSE) and streaming responses", "tier": "core", "related": ["WebSockets", "LLM basics", "A2A protocol"], "what": "A one-way stream from server to client over a normal HTTP response (`Content-Type: text/event-stream`). The server keeps the response open and writes `data:` lines as events occur. It's simpler than WebSockets and works through most HTTP infrastructure.", "how": "It's the standard way LLM APIs **stream tokens** to clients, and it's used by MCP (streamable HTTP) and A2A for streaming updates.", "watch": "Proxies, gateways and load balancers that *buffer* responses break streaming. Check timeouts and buffering settings on every hop (Apigee, load balancer, Cloud Run)."}, {"id": "apis-and-service-communication--long-polling-and-webhooks", "domain": "apis-and-service-communication", "term": "Long polling and webhooks", "tier": "working", "related": ["Server-sent events", "Idempotency", "HMAC"], "what": "**Long polling:** the client sends a request, and the server holds it until data is available or a timeout, then the client immediately re-asks. **Webhooks:** the provider calls *your* HTTP endpoint when something happens (a callback), for example a payment-provider status update.", "how": "Webhook receivers must **verify authenticity** (an HMAC signature header, mTLS, or an OIDC token), respond fast (queue the work and return 2xx), be **idempotent** (providers retry), and tolerate out-of-order delivery.", "gcp": "Pub/Sub push subscriptions and Eventarc are webhooks with OIDC authentication. Cloud Run is the usual receiver, often writing straight to Pub/Sub or Cloud Tasks."}, {"id": "apis-and-service-communication--api-design-versioning-pagination-errors-long-running-operations", "domain": "apis-and-service-communication", "term": "API design: versioning, pagination, errors, long-running operations", "tier": "working", "related": ["REST", "OpenAPI", "API management"], "what": "**Versioning:** major versions in the path, additive changes within a version, deprecation policies. **Pagination:** prefer cursor or page tokens over offsets (stable under inserts). **Errors:** a consistent error model (code, message, details), as in Google's `google.rpc.Status`. **Long-running operations:** return 202 + an operation resource the client polls (or a callback), which is how Google APIs handle slow tasks. **Field masks** for partial updates and reads. **Etags** for optimistic concurrency."}, {"id": "apis-and-service-communication--openapi", "domain": "apis-and-service-communication", "term": "OpenAPI", "tier": "working", "related": ["REST", "Apigee", "API Gateway"], "what": "A standard, machine-readable specification (YAML or JSON) for REST APIs: paths, operations, parameters, schemas and security schemes. It drives documentation, client and server generation, mocking, testing and gateway configuration.", "gcp": "API Gateway and Cloud Endpoints are configured from OpenAPI specs. Apigee imports OpenAPI to generate proxies and developer-portal docs. **Agents use OpenAPI specs as tool definitions**, so well-described APIs become agent tools quickly."}, {"id": "apis-and-service-communication--idempotency-and-idempotency-keys", "domain": "apis-and-service-communication", "term": "Idempotency and idempotency keys", "tier": "core", "related": ["Delivery semantics", "Retries", "Webhooks"], "what": "An operation is **idempotent** if repeating it has the same effect as doing it once. **Idempotency keys** make non-idempotent operations safe: the client sends a unique key (for example a UUID per payment attempt), and the server stores key → result and returns the stored result for repeats instead of executing again.", "how": "Store keys with a TTL, atomically with the side effect (same transaction), and scope them per client. Consumers of at-least-once messages dedupe on message or business IDs.", "watch": "In financial systems this is non-negotiable: network timeouts and retries **will** happen, and \"did my payment go through?\" must have one answer."}, {"id": "apis-and-service-communication--retries-exponential-backoff-and-jitter", "domain": "apis-and-service-communication", "term": "Retries, exponential backoff and jitter", "tier": "core", "related": ["Idempotency", "Circuit breaker", "HTTP status codes"], "what": "Retrying transient failures (timeouts, 429, 503) with **exponentially growing waits** (for example 100 ms, 200 ms, 400 ms… capped) plus **random jitter**, so that many clients don't retry in sync and hammer a recovering service.", "how": "Limit attempts, and set an overall deadline. Retry only idempotent operations or those with idempotency keys. Use **retry budgets** (for example retries must stay under 10% of requests) to avoid retry storms.", "gcp": "Google client libraries retry automatically with backoff for retryable errors. Pub/Sub has retry policies. Cloud Tasks and Workflows have configurable retries.", "watch": "Retries at every layer multiply: 3 retries × 3 layers = 27 attempts on the bottom service. Retry at one layer."}, {"id": "apis-and-service-communication--timeouts-deadlines-and-deadline-propagation", "domain": "apis-and-service-communication", "term": "Timeouts, deadlines and deadline propagation", "tier": "core", "related": ["gRPC", "Retries", "Circuit breaker"], "what": "Every remote call needs a **timeout**. Without one, a slow dependency holds threads and connections until the caller collapses too. A **deadline** is an absolute \"must finish by\" time, **propagated** down the call chain so downstream services stop work the caller has already given up on.", "how": "Set timeouts per hop that add up to less than the user-facing budget. gRPC propagates deadlines natively.", "gcp": "Cloud Run request timeout, load balancer backend timeout, Apigee target timeouts, client library timeouts. LLM calls have long and variable latency, so budget for them explicitly and stream."}, {"id": "apis-and-service-communication--circuit-breaker", "domain": "apis-and-service-communication", "term": "Circuit breaker", "tier": "working", "related": ["Retries", "Graceful degradation", "Service mesh"], "what": "Wraps calls to a dependency. After repeated failures it **opens** (fails fast, without calling the dependency, maybe returning a fallback). After a cool-down it goes **half-open** to test with a few calls, then **closes** if healthy.", "how": "It prevents wasting resources on a dead dependency and gives the dependency room to recover.", "gcp": "In code (resilience libraries) or in a service mesh / Envoy (outlier detection, connection limits). Load balancer outlier detection is a related mechanism."}, {"id": "apis-and-service-communication--bulkheads-rate-limiting-and-throttling", "domain": "apis-and-service-communication", "term": "Bulkheads, rate limiting and throttling", "tier": "core", "related": ["Apigee", "Cloud Armor", "Backpressure"], "what": "**Bulkheads:** isolate resources (thread pools, connection pools, instances) per dependency or tenant, so one failure can't sink the whole service. **Rate limiting:** cap requests per client or key in a time window. Algorithms are **token bucket** (allows bursts up to the bucket size), **leaky bucket** (smooth rate) and fixed or sliding windows. **Throttling** is the response: reject with 429 or delay.", "gcp": "Apigee (Quota, SpikeArrest policies), Cloud Armor rate-limiting rules, API Gateway quotas, Cloud Tasks queue rates, and Gemini model quotas (protect yourself from the provider's 429s too)."}, {"id": "apis-and-service-communication--backpressure-and-load-shedding", "domain": "apis-and-service-communication", "term": "Backpressure and load shedding", "tier": "working", "related": ["Pub/Sub", "Rate limiting", "Graceful degradation"], "what": "**Backpressure:** a slow consumer signals producers to slow down, instead of buffering until it runs out of memory (flow control in Pub/Sub StreamingPull, TCP windows, reactive streams). **Load shedding:** under overload, deliberately reject low-priority work early, so high-priority requests still succeed.", "gcp": "A queue (Pub/Sub, Cloud Tasks) between bursty producers and fragile consumers is the classic buffer. Its backlog becomes the autoscaling signal."}, {"id": "apis-and-service-communication--api-gateway-vs-api-management", "domain": "apis-and-service-communication", "term": "API gateway vs API management", "tier": "core", "related": ["Apigee", "API Gateway", "Reverse proxy"], "what": "An **API gateway** is a reverse proxy in front of APIs that does routing, authentication, rate limiting and transformation. **API management** adds the full lifecycle around it: a **developer portal** (documentation and self-service keys), **API products** and plans, analytics, monetization, versioning, security policies, and governance across many teams and external consumers.", "gcp": "**API Gateway** is lightweight and serverless, for simple backends. **Apigee** is enterprise API management. Cloud Endpoints is legacy."}, {"id": "apis-and-service-communication--apigee", "domain": "apis-and-service-communication", "term": "Apigee", "tier": "core", "related": ["API gateway vs API management", "OAuth 2.0", "Private Service Connect"], "what": "Google's enterprise API management platform. Very common in banks for external, partner and **Open Banking** APIs, and increasingly for governing access to internal APIs and AI models.", "how": "You define **API proxies**: a **proxy endpoint** (client-facing, \"northbound\") and **target endpoint** (backend, \"southbound\"), with **flows** of **policies** attached: **VerifyAPIKey**, **OAuthV2** (Apigee as the authorization server, issuing and validating tokens), **VerifyJWT**, **Quota**, **SpikeArrest**, **JSONThreatProtection / RegexProtection**, **AssignMessage** (transform), **ResponseCache**, **ServiceCallout**, JavaScript or Java callouts, and shared flows (reusable policy chains, for example a corporate security flow). **API products** bundle proxies, scopes and quotas. **Apps and developers** get credentials. There's an integrated **developer portal**, **analytics**, **monetization** and **Advanced API Security** (abuse detection, security scoring). Deployment models: **Apigee X** (Google-managed; networking northbound through an external or internal load balancer, or PSC, and southbound to backends through PSC or VPC peering) and **Apigee hybrid** (you run the runtime plane on your own Kubernetes on-prem or in another cloud, while Google hosts the management plane).", "gcp": "**Apigee as an AI gateway**: proxies in front of model endpoints (Gemini, Claude through Model Garden, internal models) enforce authentication, **token-based quotas** per team, PII checks (calling Sensitive Data Protection or Model Armor), logging, semantic caching and model routing, giving one governed front door for every LLM call in the bank. Check current Apigee docs for the latest LLM-specific policies."}, {"id": "apis-and-service-communication--api-gateway-and-cloud-endpoints", "domain": "apis-and-service-communication", "term": "API Gateway and Cloud Endpoints", "tier": "working", "related": ["Apigee", "OpenAPI"], "what": "**API Gateway:** a fully managed gateway configured from an OpenAPI spec, for Cloud Run, Cloud Run functions and App Engine backends, with API keys, JWT validation and quotas. Cheaper and simpler than Apigee, but without a portal, monetization or rich policies. **Cloud Endpoints:** the older option based on the Extensible Service Proxy (ESPv2/Envoy) sidecar."}, {"id": "apis-and-service-communication--service-discovery", "domain": "apis-and-service-communication", "term": "Service discovery", "tier": "working", "related": ["Kubernetes Services", "Cloud DNS", "Service mesh"], "what": "How a service finds the current network location of another. **DNS-based** (Kubernetes Service DNS names, Cloud DNS private zones), **registry-based** (Service Directory, Consul), or handled by the **mesh**.", "gcp": "Cloud Run services have stable URLs (discovery is easy). In GKE, use `service.namespace.svc.cluster.local`. Service Directory registers endpoints across GKE, VMs and on-prem."}, {"id": "apis-and-service-communication--monolith-vs-microservices", "domain": "apis-and-service-communication", "term": "Monolith vs microservices", "tier": "core", "related": ["Service mesh", "Event-driven architecture", "Strangler fig"], "what": "A **monolith** deploys as one unit: simple to build, test and run; it scales as a whole, and coordinating releases gets harder as teams grow. **Microservices** are independently deployable services around business capabilities, each owning its data: they allow independent scaling and release, at the cost of distributed-systems complexity (network failures, eventual consistency, observability, many deployments).", "how": "A **modular monolith** is often the right first step. Split out services where independent scaling, team autonomy or different release cadences pay for the complexity.", "watch": "A \"distributed monolith\" (services that must deploy together and share a database) gets the worst of both."}, {"id": "apis-and-service-communication--choreography-vs-orchestration", "domain": "apis-and-service-communication", "term": "Choreography vs orchestration", "tier": "core", "related": ["Saga pattern", "Workflows", "Event-driven architecture"], "what": "**Orchestration:** a central coordinator tells each service what to do and tracks the overall state (for example Workflows, Composer, an agent orchestrator). It's easy to see and change the flow, but the coordinator becomes coupled to everything. **Choreography:** services react to each other's events with no central controller. It's loosely coupled, but the end-to-end flow is implicit and harder to trace.", "gcp": "Orchestration: **Workflows**, Cloud Composer, Cloud Tasks chains, ADK workflow agents. Choreography: Pub/Sub and Eventarc."}, {"id": "apis-and-service-communication--saga-pattern-distributed-transactions", "domain": "apis-and-service-communication", "term": "Saga pattern (distributed transactions)", "tier": "working", "related": ["Choreography vs orchestration", "ACID", "Idempotency"], "what": "Keeping data consistent across services *without* a distributed ACID transaction. A saga is a sequence of local transactions, each with a **compensating action** that undoes it if a later step fails (reserve funds → book FX → transfer; if the transfer fails, release the FX booking, then release the funds).", "how": "It can be orchestrated (a coordinator such as Workflows) or choreographed (events). Every step and compensation must be idempotent.", "watch": "Between steps the system is temporarily inconsistent, and compensations aren't always possible (you can't un-send an email). Design for that."}, {"id": "apis-and-service-communication--transactional-outbox", "domain": "apis-and-service-communication", "term": "Transactional outbox", "tier": "working", "related": ["Change data capture", "Delivery semantics", "Saga"], "what": "Solves the \"dual write\" problem: updating your database *and* publishing an event can't be atomic across two systems. Instead, write the event to an **outbox table in the same database transaction** as the business change. A separate relay (a poller, or CDC) publishes outbox rows to Pub/Sub or Kafka.", "gcp": "Cloud SQL or AlloyDB outbox + a Datastream or Debezium relay, or Spanner change streams → Dataflow → Pub/Sub."}, {"id": "apis-and-service-communication--cqrs-and-event-sourcing", "domain": "apis-and-service-communication", "term": "CQRS and event sourcing", "tier": "aware", "related": ["Event-driven architecture", "Data lake"], "what": "**CQRS** (Command Query Responsibility Segregation) uses separate models for writes and reads (for example writes to Spanner, reads from a denormalized BigQuery or Elasticsearch view). **Event sourcing** stores state as an append-only log of events and derives current state by replaying them. That gives a full audit history, which suits ledgers, but adds complexity."}, {"id": "apis-and-service-communication--eventarc", "domain": "apis-and-service-communication", "term": "Eventarc", "tier": "core", "related": ["Pub/Sub", "Event-driven architecture", "Cloud Run"], "what": "GCP's event routing service. It delivers events in the **CloudEvents** format from sources to targets.", "how": "Sources: **direct events** (Cloud Storage object finalized, Pub/Sub messages, Firestore changes, and more), **Cloud Audit Logs events** (almost any API call on GCP, for example \"a BigQuery table was created\"), and third-party providers. Targets: Cloud Run, Cloud Run functions, GKE services, Workflows, internal HTTP endpoints. Triggers have filters, and run as a service account that needs invoker rights. **Eventarc Advanced** adds a central message bus with routing, filtering and transformation across many publishers and subscribers.", "gcp": "\"When a document lands in this bucket, start the RAG ingestion job\" is a one-trigger Eventarc pattern."}, {"id": "apis-and-service-communication--cloudevents", "domain": "apis-and-service-communication", "term": "CloudEvents", "tier": "aware", "related": ["Eventarc"], "what": "A CNCF specification for describing events in a common way (`id`, `source`, `type`, `time`, `subject`, `data`), so producers and consumers across platforms interoperate."}, {"id": "apis-and-service-communication--cloud-tasks", "domain": "apis-and-service-communication", "term": "Cloud Tasks", "tier": "working", "related": ["Pub/Sub", "Rate limiting", "Retries"], "what": "Managed **queues of HTTP (or App Engine) tasks**, where each task is a request to a *specific* target. You get explicit control: **rate limits** (dispatches per second, max concurrent), **retries** with backoff, **scheduled delivery** (run at time X), and **deduplication** by task name.", "gcp": "Use it to protect a fragile downstream (a legacy core banking API that can take only 50 requests per second), or for deferred work per user. Pub/Sub is better for fan-out and decoupled events, where the publisher doesn't know the consumers."}, {"id": "apis-and-service-communication--cloud-scheduler", "domain": "apis-and-service-communication", "term": "Cloud Scheduler", "tier": "working", "related": ["Cloud Run jobs", "Workflows"], "what": "A managed **cron** service. It triggers HTTP targets (with OIDC or OAuth authentication), Pub/Sub topics or App Engine on a schedule, with retries."}, {"id": "apis-and-service-communication--workflows", "domain": "apis-and-service-communication", "term": "Workflows", "tier": "working", "related": ["Choreography vs orchestration", "Saga pattern", "Eventarc"], "what": "Serverless **orchestration** of services and APIs, defined in YAML or JSON: steps, conditions, loops, parallel branches, variables, **try/retry/except** error handling, **connectors** for Google APIs (with long-running operations handled for you), **callbacks** (wait for external events or human approval), and executions that can last up to a year.", "gcp": "Good for sagas, document-processing pipelines, approval flows (\"generate a credit memo with Gemini → wait for underwriter approval via callback → file it\"), and gluing Cloud Run services together without writing orchestration code."}, {"id": "apis-and-service-communication--application-integration-and-integration-connectors", "domain": "apis-and-service-communication", "term": "Application Integration and Integration Connectors", "tier": "aware", "related": ["Workflows", "Apigee"], "what": "Google's iPaaS: low-code integration flows with **Integration Connectors** to SaaS and enterprise systems (Salesforce, SAP, ServiceNow, databases, mainframes and so on). The connectors can also be exposed as tools for AI agents."}, {"id": "apis-and-service-communication--serialization-formats", "domain": "apis-and-service-communication", "term": "Serialization formats", "tier": "working", "related": ["gRPC and Protocol Buffers", "Data lake"], "what": "How data is encoded on the wire or on disk. **JSON** (human-readable, flexible, verbose), **Protocol Buffers** (binary, schema'd, compact, the RPC standard), **Avro** (binary, schema travels with the data, common in Kafka and Pub/Sub schemas), **Parquet / ORC** (columnar files for analytics, used in data lakes and BigLake), **CSV** (simple, fragile).", "watch": "Schema evolution rules (adding optional fields is safe; renaming or reusing field numbers is not) matter more than the format."}, {"id": "apis-and-service-communication--cors", "domain": "apis-and-service-communication", "term": "CORS", "tier": "working", "related": ["HTTP basics", "API gateway"], "what": "Cross-Origin Resource Sharing: the browser rule that blocks a web page on origin A from reading responses from API origin B, unless B returns headers (`Access-Control-Allow-Origin` and others) allowing it. Non-simple requests trigger a **preflight** `OPTIONS` request.", "watch": "CORS protects *browsers'* users. It isn't API security, because servers and scripts ignore it. Configure it on the gateway or the service, and never use `*` with credentials."}, {"id": "reliability-and-operations--availability-and-the-nines", "domain": "reliability-and-operations", "term": "Availability and \"the nines\"", "tier": "core", "related": ["SLI/SLO/SLA", "High availability"], "what": "Availability = the proportion of time (or of requests) a service works. Downtime budgets: **99%** ≈ 7.3 h/month · **99.9%** ≈ 43.8 min/month · **99.95%** ≈ 21.9 min/month · **99.99%** ≈ 4.4 min/month · **99.999%** ≈ 26 s/month.", "how": "Serial dependencies multiply: a service that needs A (99.95%) *and* B (99.95%) is at most about 99.9%. Redundancy improves availability: two independent 99% replicas, where either can serve, give about 99.99%.", "watch": "Each extra nine costs roughly an order of magnitude more effort. Choose the target from business impact, and set it in line with the *impact tolerance* for that business service."}, {"id": "reliability-and-operations--sli-slo-sla-and-error-budgets", "domain": "reliability-and-operations", "term": "SLI, SLO, SLA and error budgets", "tier": "core", "related": ["Availability", "Alerting", "Burn rate"], "what": "**SLI** (indicator): a measured ratio of good events to total events, for example the proportion of requests that return 2xx within 300 ms. **SLO** (objective): the internal target for an SLI over a window, for example 99.9% over 28 days. **SLA** (agreement): a contractual promise with penalties, set looser than the SLO. **Error budget:** 100% − SLO, the amount of unreliability you're allowed to \"spend\" on releases, experiments and incidents.", "how": "An **error budget policy** says what happens when the budget is used up: freeze features and focus on reliability. That's what makes SLOs drive decisions rather than sit on dashboards.", "gcp": "Cloud Monitoring **SLO monitoring** (request-based or windows-based SLIs on Cloud Run, GKE, load balancers, Cloud Service Mesh or custom metrics) with burn-rate alerts. Google publishes SLAs per product (for example Cloud Run 99.95%, Spanner multi-region 99.999%). Your SLO can't be higher than your dependencies allow."}, {"id": "reliability-and-operations--burn-rate-alerting", "domain": "reliability-and-operations", "term": "Burn rate alerting", "tier": "working", "related": ["SLI/SLO/SLA", "Alerting"], "what": "Alerting on *how fast* you're consuming the error budget instead of on raw thresholds. A burn rate of 1 uses exactly the budget over the window. 14.4× over 1 hour means 2% of a 30-day budget gone in an hour, which should page someone.", "how": "Use multi-window, multi-burn-rate alerts (a fast window for sudden outages, a slow one for gradual degradation). This gives high precision (few false pages) and good recall."}, {"id": "reliability-and-operations--high-availability-vs-disaster-recovery", "domain": "reliability-and-operations", "term": "High availability vs disaster recovery", "tier": "core", "related": ["RTO and RPO", "Failure domains", "Replication"], "what": "**High availability (HA):** survive *component and zone* failures automatically with little or no disruption (redundancy within a region). **Disaster recovery (DR):** recover from *large-scale* events (region loss, data corruption, ransomware, a cyber attack) to a defined RTO and RPO, often involving a failover decision.", "watch": "Replication isn't backup. Corruption and deletion replicate instantly. DR needs immutable, point-in-time copies as well."}, {"id": "reliability-and-operations--rto-and-rpo", "domain": "reliability-and-operations", "term": "RTO and RPO", "tier": "core", "related": ["High availability vs disaster recovery", "Backup and PITR", "Impact tolerance"], "what": "**RTO** (Recovery Time Objective): the maximum acceptable time to restore service. **RPO** (Recovery Point Objective): the maximum acceptable data loss, measured as time (for example \"the last 5 minutes of transactions\")."
